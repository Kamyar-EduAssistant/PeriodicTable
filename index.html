<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول تناوبی تعاملی عناصر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- فونت فارسی وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- کتابخانه KaTeX برای فرمول‌نویسی ریاضی -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" xintegrity="sha384-n8MVd4RsNIU0KOVEMckDpbCjaWr2Ugeh4/EGactnsCJO8e2i7gqY+2eJV6gwUqML" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" xintegrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" xintegrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --accent: #2563eb;
            --header-bg: rgba(255, 255, 255, 0.9);
            --drawer-bg: #ffffff;
            --info-bg: #f9fafb;
            --hover-shadow: rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-main: #ffffff;
                --text-secondary: #aaaaaa;
                --border-color: #333;
                --accent: #3b82f6;
                --header-bg: rgba(30, 30, 30, 0.9);
                --drawer-bg: #18181b;
                --info-bg: #27272a;
                --hover-shadow: rgba(255,255,255,0.1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: var(--header-bg) !important;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 15px;
            font-weight: 900 !important;
            font-size: 2rem !important;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-white {
            color: #ffffff !important;
        }
        ul, ol {
            margin: 0.5em 0 !important;
        }
        ul li::marker, ol li::marker {
            color: #15803d; /* سبز تیره */
            font-weight: bold;
        }
        ul li, ol li {
            margin-bottom: 0.3em;
            padding-right: 1rem;
        }
        ul li ul, ol li ol {
            margin-top: 0.3em;
            margin-bottom: 0.3em;
        }
        .ai-table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; }
        .ai-table th, .ai-table td { border: 1px solid #d1d5db; padding: 0.75rem; text-align: right; }
        .ai-table th { background-color: #f3f4f6; font-weight: bold; }
        .ai-table tr:nth-child(even) { background-color: #f9fafb; }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-mode {
            background: var(--card-bg);
            font-family: 'Vazirmatn', sans-serif;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-mode:hover, .btn-mode.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .table-scroll-container {
            width: 100%;
            overflow-x: auto;
            padding: 20px;
            display: flex;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: 30px repeat(18, 70px); 
            grid-template-rows: 30px repeat(9, 70px);
            gap: 6px;
            margin: 0 auto;
            position: relative;
        }

        .periodic-table.highlight-mode .element {
            opacity: 0.5 !important;
            filter: grayscale(0.8);
            transition: all 0.1s ease-in-out;
        }

        .periodic-table.highlight-mode .element.highlight {
            opacity: 1 !important;
            filter: grayscale(0);
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--hover-shadow);
            z-index: 50;
            transition: all 0.1s ease-in-out;
        }

        .legend-item {
            transition: all 0.2s ease;
            padding: 6px 12px;
        }

        .legend-item:hover {
            background: var(--info-bg);
            transform: translateY(-2px);
        }

        /* استایل شماره‌های گروه و دوره */
        .grid-header {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .element {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            overflow: hidden;
            user-select: none;
            color: var(--text-main);
        }

        .element:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 0 15px var(--hover-shadow);
            border-color: var(--accent);
        }

        .bohr-element:hover {
            transform: scale(2.1);
        }
        .image-element:hover {
            transform: scale(1.5);
        }

        .element .radioactive {
            position: absolute;
            bottom: 1.25px;
            right: 1.25px;
            font-size: 0.675rem;
            color: #f43f5e; /* سرخابی یا قرمز */
        }

        .radioactive-big {
            position: absolute;
            bottom: 6px;
            right: 9px;
            font-size: 1.8rem;
            color: #f43f5e;
        }

        .atomic-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.65rem;
            color: var(--text-secondary);
        }
        .symbol {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 2px;
        }
        .name {
            font-size: 0.6rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
            margin-top: -5px;
        }
        .mass {
            font-size: 0.55rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .img-symbol {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        

        /* استایل‌های محتوای حالت‌های مختلف */
        .bohr-view, .image-view {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .orbital-view {
            font-size: 0.6rem;
            text-align: center;
            line-height: 1.2;
            padding: 2px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        .orbital-view strong {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        /* Drawer Styles */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(2px);
            z-index: 199;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .drawer-overlay.active { opacity: 1; visibility: visible; }

        .drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 86.5vh;
            background: var(--drawer-bg);
            border-top: 1px solid var(--border-color);
            border-radius: 30px 30px 0 0;
            z-index: 200;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            color: var(--text-main);
        }
        .drawer.active { transform: translateY(0); box-shadow: 0 -5px 30px rgba(0,0,0,0.7); }

        .drawer-header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .drawer-close {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }
        .drawer-content {
            padding: 25px;
            overflow-y: auto;
            gap: 30px;
            align-content: flex-start;
        }

        .drawer-top-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .element-big-card {
            width: 260px;
            height: 280px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            flex-shrink: 0;
        }
        .big-number {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.5rem;
            opacity: 0.8;
            font-weight: bold;
        }
        .big-symbol {
            font-size: 6rem;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .big-name { font-size: 2rem; margin-top: -10px; }

        .details-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--border-color);
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-section { flex: 1; min-width: 300px; }

        /* استایل اختصاصی برای بخش مدل بور و اطلاعات مداری */
        .bohr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--info-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 260px;
            margin-top: 25px;
            margin-bottom: 25px;
            flex-shrink: 0;
        }
        .bohr-canvas {
            max-width: 100%;
            height: auto;
        }
        #bohrCanvas {
            max-width: 100%;
            height: auto;
        }
        #orbitInfo {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            direction: rtl;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .info-item {
            background: var(--info-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .info-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 5px;
        }
        .info-value { font-size: 1rem; overflow-x: auto; overflow-y: hidden; }
        
        .katex-display { margin-left: auto; margin-right: auto; direction: ltr; }
        span.katex { direction: ltr; display: inline-block; }

        .description-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.8;
            font-size: 0.95rem;
            padding: 25px;
            text-align: justify;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            padding: 10px;
            max-width: 1200px;
            margin: 10px auto;
        }
        .legend-item {
            display: flex;
            justify-content: space-between;
            flex-direction: row-reverse;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            column-gap: 6px;
        }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; margin-left: 6px; }

        @media (max-width: 600px) {
            .drawer-content { align-items: center; flex-wrap: wrap; }
            .info-section { width: 100%; }
            .element-big-card { width: 100%; }
            .bohr-container { width: 100%; }
        }
        @media (min-width: 600px) {
            .drawer-content { display: flex; }
        }
        @media (prefers-color-scheme: dark) {
            .ai-table th, .ai-table td { 
            	border: 1px solid #415c3b; /* خطوط روشن‌تر */
            }
            .ai-table th { 
            	background-color: #3c5736ab; 
            }
            .ai-table tr:nth-child(even) { 
            	background-color: #3e493b8f; 
            }
            .ai-table tr:nth-child(odd) { 
            	background-color: #222b2394; /* یا رنگ اصلی بدنه */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>جدول تناوبی تعاملی عناصر</h1>
        <div class="controls">
            <button class="btn-mode active" onclick="setMode('standard')">استاندارد</button>
            <button class="btn-mode" onclick="setMode('block')">بلوک</button>
            <button class="btn-mode" onclick="setMode('bohr')">مدل بور</button>
            <button class="btn-mode" onclick="setMode('orbital')">آرایش اوربیتالی</button>
            <button class="btn-mode" onclick="setMode('phase')">حالت ماده</button>
            <button class="btn-mode" onclick="setMode('image')">تصویری</button>
        </div>
    </header>

    <div class="table-scroll-container">
        <div class="periodic-table" id="periodicTable" dir="ltr"></div>
    </div>

    <div class="legend" id="legend"></div>

    <!-- پنل کشویی (Drawer) -->
    <div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h2 id="drawerTitle">جزئیات عنصر</h2>
            <button class="drawer-close" onclick="closeDrawer()">✕</button>
        </div>
        <div style="overflow-y: auto;" id="drawerContent"></div>
    </div>

    <script>
        const colorPalette = {
            'alkali-metal': '#ff0c0c',      // قرمز
            'alkaline-earth': '#f97316',    // نارنجی
            'transition-metal': '#eab308',  // زرد
            'post-transition': '#84cc16',   // سبز لیمویی
            'metalloid': '#10b981',         // سبز
            'non-metal': '#00b1db',         // فیروزه‌ای
            'halogen': '#326aed',           // آبی
            'noble-gas': '#8b5cf6',         // بنفش
            'lanthanide': '#d946ef',        // صورتی
            'actinide': '#ff314b',          // سرخابی
        };
        const blockColors = {
            's': '#ef4444',
            'p': '#eab308',
            'd': '#3b82f6',
            'f': '#10b981'
        };

        const categoryNames = {
            'alkali-metal': 'فلزات قلیایی',
            'alkaline-earth': 'فلزات قلیایی خاکی',
            'transition-metal': 'فلزات واسطه',
            'post-transition': 'فلزات پس‌واسطه',
            'metalloid': 'شبه‌فلزات',
            'non-metal': 'نافلزات',
            'halogen': 'هالوژن‌ها',
            'noble-gas': 'گازهای نجیب',
            'lanthanide': 'لانتانیدها',
            'actinide': 'آکتینیدها',
        };

        // --- الگوریتم دقیق آرایش الکترونی (Aufbau Principle) ---
        // Order: 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p, 6s, 4f, 5d, 6p, 7s, 5f, 6d, 7p
        const aufbauOrder = [
            {n:1, t:'s', c:2}, {n:2, t:'s', c:2}, {n:2, t:'p', c:6},
            {n:3, t:'s', c:2}, {n:3, t:'p', c:6}, {n:4, t:'s', c:2},
            {n:3, t:'d', c:10}, {n:4, t:'p', c:6}, {n:5, t:'s', c:2},
            {n:4, t:'d', c:10}, {n:5, t:'p', c:6}, {n:6, t:'s', c:2},
            {n:4, t:'f', c:14}, {n:5, t:'d', c:10}, {n:6, t:'p', c:6},
            {n:7, t:'s', c:2}, {n:5, t:'f', c:14}, {n:6, t:'d', c:10}, {n:7, t:'p', c:6}
        ];

        function calculateElectronConfig(Z) {
            const exceptions = {
                24: "1s2 2s2 2p6 3s2 3p6 4s1 3d5",
                29: "1s2 2s2 2p6 3s2 3p6 4s1 3d10",
                41: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d4",
                42: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d5",
                44: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d7",
                45: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d8",
                46: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 4d10",
                47: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d10",
                78: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p6 6s1 4f14 5d9",
                79: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p6 6s1 4f14 5d10"
            };

            if (exceptions[Z]) return parseConfigString(exceptions[Z]);

            let electrons = Z;
            let config = [];

            for (let orb of aufbauOrder) {
                if (electrons <= 0) break;
                let fill = Math.min(electrons, orb.c);
                config.push({
                    n: orb.n,
                    type: orb.t,
                    count: fill
                });
                electrons -= fill;
            }
            return config;
        }


        function parseConfigString(str) {
            return str.split(' ').map(part => {
                let match = part.match(/(\d+)([spdf])(\d+)/);
                if (match) {
                    return { name: part.slice(0, match[0].length-match[3].length), n: parseInt(match[1]), type: match[2], count: parseInt(match[3]) };
                }
                // fallback simple parser
                let name = part.slice(0, 2);
                let count = parseInt(part.slice(2));
                return { name, count, n: parseInt(name[0]), type: name[1] };
            });
        }

        function getLatexElectronConfig(Z) {
            const nobleGases = [
                { Z: 2, sym: 'He' },
                { Z: 10, sym: 'Ne' },
                { Z: 18, sym: 'Ar' },
                { Z: 36, sym: 'Kr' },
                { Z: 54, sym: 'Xe' },
                { Z: 86, sym: 'Rn' }
            ];

            let noble = null;
            for (let ng of nobleGases) {
                if (Z > ng.Z) noble = ng;
            }

            const full = calculateElectronConfig(Z);

            if (!noble) {
                return full.map(o => `${o.n}${o.type}^{${o.count}}`).join('\\,');
            }

            const core = calculateElectronConfig(noble.Z);

            // حذف اوربیتال‌های هسته به‌صورت ساختاری
            let valence = full.slice(core.length);

            return `[\\mathrm{${noble.sym}}]\\,` +
                valence.map(o => `${o.n}${o.type}^{${o.count}}`).join('\\,');
        }

        function orbitalTable(Z) {
            const nobleGases = [{ Z: 2, sym: 'He' },{ Z: 10, sym: 'Ne' },{ Z: 18, sym: 'Ar' },{ Z: 36, sym: 'Kr' },{ Z: 54, sym: 'Xe' },{ Z: 86, sym: 'Rn' }];
            let noble = null;
            for (let ng of nobleGases) {
                if (Z > ng.Z) noble = ng;
            }
            const full = calculateElectronConfig(Z);
            if (!noble) {
                return full.map(o => `${o.n}${o.type}^{${o.count}}`).join('\\,');
            }
            const core = calculateElectronConfig(noble.Z);
            let valence = full.slice(core.length);
            const shouldShorten = 
                (Z >= 31 && Z <= 36) || 
                (Z >= 49 && Z <= 54) || 
                (Z >= 71 && Z <= 86) || 
                (Z >= 103 && Z <= 118);
            let valenceLatex = "";
            if (shouldShorten) {
                const lastOrbital = valence[valence.length - 1];
                valenceLatex = "\\dots\\," + `${lastOrbital.n}${lastOrbital.type}^{${lastOrbital.count}}`;
            } else {

        <h2 class="text-2xl font-bold my-3">هیدروژن: سرآغاز هستی و سوخت آینده</h2>

        <h3 class="text-xl font-bold my-3">ویژگی‌های فیزیکی و شیمیایی گسترده</h3>
        <p>هیدروژن در شرایط استاندارد ($\\text{STP}$) به صورت مولکول‌های دواتمی ($\\mathrm{H}_2$) یافت می‌شود. پیوند بین دو اتم هیدروژن یکی از قوی‌ترین پیوندهای کووالانسی یگانه است ($\\mathrm{H{-}H}$).</p>

        <h3 class="text-xl font-bold my-3">فیزیک پلاسما و طیف نوری</h3>
        <p>در دماهای بسیار بالا یا تحت ولتاژهای شدید، هیدروژن الکترون خود را از دست داده و به حالت پلاسما در می‌آید. انتقال الکترون بین ترازهای انرژی در اتم هیدروژن باعث ایجاد طیف نشری خطی می‌شود که با فرمول ریدبرگ محاسبه می‌گردد:$$\\frac{1}{\\lambda} = R_H \\left( \\frac{1}{n_1^2} - \\frac{1}{n_2^2} \\right)$$ در این فرمول، $R_H$ ثابت ریدبرگ برای هیدروژن است. خطوط مرئی این طیف (سری بالمر) شامل رنگ‌های قرمز ($n=3 \\to 2$)، آبی-سبز ($4 \\to 2$) و بنفش ($5 \\to 2$) است که در مجموع ظاهری صورتی‌رنگ به گاز درخشان می‌دهند.</p>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Emission_spectrum-H.svg/2560px-Emission_spectrum-H.svg.png" alt="طیف نشری خطی هیدروژن" class="my-2 rounded-lg shadow-md mx-auto max-w-full h-auto">

        <h3 class="text-xl font-bold my-3">ایزوتوپ‌ها و تفاوت‌های ساختاری </h3>
        <p>هیدروژن تنها عنصری است که ایزوتوپ‌های آن به دلیل تفاوت فاحش در جرم، رفتارهای شیمیایی متفاوتی نشان می‌دهند (اثر ایزوتوپی):</p>
        <ol style="list-style-type: persian;" class="list-inside">
            <li>پروتیوم ($^1_1\\mathrm{H}$): فراوان‌ترین شکل هیدروژن ($99.98\\%$). هسته آن تنها از یک پروتون تشکیل شده است.</li>
            <li>دوتریوم ($^2_1\\mathrm{H}$ یا $\\mathrm{D}$): معروف به هیدروژن سنگین. دارای یک پروتون و یک نوترون است. چگالی آب سنگین ($\\mathrm{D}_2\\mathrm{O}$) حدود $11\\%$ بیشتر از آب معمولی است و در رآکتورهای هسته‌ای به عنوان کندکننده نوترون عمل می‌کند.</li>
            <li>تریتیوم ($^3_1\\mathrm{H}$ یا $\\mathrm{T}$): ایزوتوپ رادیواکتیو با نیمه‌عمر ۱۲.۳ سال. در هسته آن دو نوترون وجود دارد. از آن در نورافشان‌های ساعت و به عنوان سوخت در بمب‌های هیدروژنی استفاده می‌شود.</li>
        </ol>
        <h3 class="text-xl font-bold my-3">مکانیسم‌های تولید انرژی: گداخت هسته‌ای</h3>
        <p>در مرکز ستارگان، فشار و دمای فوق‌العاده زیاد باعث می‌شود پروتون‌ها بر نیروی رانش الکترواستاتیکی غلبه کرده و با هم ادغام شوند. فرآیند اصلی، چرخه پروتون-پروتون است:</p>
        <ol style="list-style-type: persian;" class="list-inside">
            <li>دو پروتون با هم برخورد کرده و یک دوتریوم، یک پوزیترون و یک نوترینو تولید می‌کنند.</li>
            <li>دوتریوم با پروتون دیگری برخورد کرده و هلیوم-۳ ($^3_2\\mathrm{He}$) تولید می‌کند.</li>
            <li>نهایت، دو هسته هلیوم-۳ با هم برخورد کرده و هلیوم-۴ پایدار را می‌سازند.</li>
        </ol>
        <p>معادله کلی انرژی‌زا: $$4 \\ ^1_1\\mathrm{H} \\rightarrow \\ ^4_2\\mathrm{He} + 2e^+ + 2\\nu_e + 26.73 \\ \\text{MeV}$$ این انرژی معادل تبدیل بخشی از جرم به انرژی طبق فرمول معروف اینشتین ($E=mc^2$) است.</p>
        <h3 class="text-xl font-bold my-3">کاربردها و نقش در اقتصاد آینده</h3>
        <h4 class="text-lg font-semibold mt-4 mb-2">۱. اقتصاد هیدروژنی (سوخت پاک)</h4>
        <p>هیدروژن به عنوان حامل انرژی در سلول‌های سوختی (Fuel Cells) استفاده می‌شود. در این سلول‌ها، واکنش شیمیایی مستقیماً به برق تبدیل شده و تنها خروجی آن بخار آب خالص است:$$2\\mathrm{H}_2(\\mathrm{g}) + \\mathrm{O}_2(\\mathrm{g}) \\rightarrow 2\\mathrm{H}_2\\mathrm{O}(\\mathrm{l}) + \\text{Energy}$$</p>
        <h4 class="text-lg font-semibold mt-4 mb-2">۲. هیدروژنه کردن در صنایع غذایی</h4>
        <p>برای تبدیل روغن‌های مایع گیاهی به چربی‌های جامد (مارگارین)، اتم‌های هیدروژن به پیوندهای دوگانه کربن-کربون اضافه می‌شوند.</p>
        <h4 class="text-lg font-semibold mt-4 mb-2">۳. فرآیند هابر-بوش</h4>
        <p>هیدروژن ماده اولیه حیاتی برای تولید آمونیاک است که پایه و اساس کودهای شیمیایی برای تأمین غذای جمعیت جهان محسوب می‌شود:$$\\mathrm{N}_2(\\mathrm{g}) + 3\\mathrm{H}_2(\\mathrm{g}) \\xrightarrow{\\mathrm{Fe}, \\Delta, P} 2\\mathrm{NH}_3(\\mathrm{g})$$</p>
        <h3 class="text-xl font-bold my-3">ایمنی و چالش‌ها</h3>
        <p>هیدروژن بسیار سبک است و به سرعت نشت می‌کند. همچنین به دلیل دامنه اشتعال‌پذیری وسیع در هوا ($4\\%$ تا $75\\%$)، نگهداری آن نیازمند مخازن فشار بالا و سیستم‌های تشخیص نشت پیشرفته است. یکی از پدیده‌های جالب، "تردی هیدروژنی" است که در آن نفوذ اتم‌های هیدروژن به داخل ساختار فلزات باعث شکننده شدن آن‌ها می‌شود.</p>

        // تولید کامل لیست عناصر
        let elementsData = [];
        
        function initData() {
            // نگاشت داده‌های دستی
            let manualData = {};
            baseElements.forEach(e => manualData[e.n] = e);

            const tableMap = [
                {n:1, r:1, c:1}, {n:2, r:1, c:18},
                {n:3, r:2, c:1}, {n:4, r:2, c:2}, {n:5, r:2, c:13}, {n:6, r:2, c:14}, {n:7, r:2, c:15}, {n:8, r:2, c:16}, {n:9, r:2, c:17}, {n:10, r:2, c:18},
                {n:11, r:3, c:1}, {n:12, r:3, c:2}, {n:13, r:3, c:13}, {n:14, r:3, c:14}, {n:15, r:3, c:15}, {n:16, r:3, c:16}, {n:17, r:3, c:17}, {n:18, r:3, c:18}
            ];
            
            let count = 19;
            for(let c=1; c<=18; c++) tableMap.push({n:count++, r:4, c:c});
            for(let c=1; c<=18; c++) tableMap.push({n:count++, r:5, c:c});
            
            tableMap.push({n:55, r:6, c:1}); tableMap.push({n:56, r:6, c:2});
            count = 72; for(let c=4; c<=18; c++) tableMap.push({n:count++, r:6, c:c});
            
            tableMap.push({n:87, r:7, c:1}); tableMap.push({n:88, r:7, c:2});
            count = 104; for(let c=4; c<=18; c++) tableMap.push({n:count++, r:7, c:c});
            
            count = 57; for(let c=4; c<=18; c++) { tableMap.push({n:count++, r:8, c:c-1}); }
            count = 89; for(let c=4; c<=18; c++) { tableMap.push({n:count++, r:9, c:c-1}); }

            function isLaAc(Z) {
                if (57 <= Z && Z <= 71 || 89 <= Z && Z <= 103) {
                    return true;
                } else {
                    return false;
                }
            }

            tableMap.forEach(pos => {
                let manual = manualData[pos.n];
                let config = calculateElectronConfig(pos.n);
                // Shells calculation
                let shells = {};
                config.forEach(c => { shells[c.n] = (shells[c.n] || 0) + c.count; });
                let shellsArr = Object.values(shells);

                elementsData.push({
                    number: pos.n,
                    row: pos.r,
                    col: pos.c,
                    period: isLaAc(pos.n) ? (pos.r)-2 : pos.r,
                    group: isLaAc(pos.n) ? '-' : pos.c,
                    symbol: manual.s,
                    name: manual.name,
                    nameEng: manual.nameEng,
                    mass: manual.m,
                    cat: manual.c,
                    block: manual.block,
                    state: manual.st,
                    configList: config,
                    shells: shellsArr,
                    density: manual.density,
                    mp: manual.mp,
                    bp: manual.bp,
                    isotopes: manual.istops,
                    radiusAtm: manual.RAtm,
                    radiusVDW: manual.RvdW,
                    electronegativity: manual.elctrNeg,
                    oxidationNum: manual.OxN,
                    allotropes: manual.alotrops,
                    discover: manual.discvrr,
                    discoverDate: manual.discvrDate,
                    naming: manual.naming,
                    ra: manual ? manual.ra : false,
                    img: manual.ra ? 'https://ana.ir/media/2050a599ZTp3ZWJwfGY6L2ZpbGVzL2ZhL25ld3MvMTQwMi8xMS8zLzQ0MzI3M18xMjAucG5nfGZ1aTo0MzQ0NTR8bDpmYXx2OjE.webp' : manual.img,
                    desc: manual.d,
                });
            });
        }

        initData();

        function getPeriodStartZ(period) {
            switch(period) {
                case 1: return 1;
                case 2: return 3;
                case 3: return 11;
                case 4: return 19;
                case 5: return 37;
                case 6: return 55;
                case 7: return 87;
                case 8: return 55;
                case 9: return 87;
                default: return 1;
            }
        }

        // --- رابط کاربری ---

        let currentMode = 'standard';
        const table = document.getElementById('periodicTable');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');
        const drawerTitle = document.getElementById('drawerTitle');
        const drawerContent = document.getElementById('drawerContent');

        // ساخت راهنما
        const legendContainer = document.getElementById('legend');
        legendContainer.innerHTML = '';
        Object.entries(categoryNames).forEach(([key, value]) => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.style.cursor = 'pointer';
            item.innerHTML = `
                <span>${value}</span>
                <div class="legend-color" style="background: ${colorPalette[key]}"></div>
            `;
            legendContainer.appendChild(item);
        });

        function renderTable() {
            table.innerHTML = '';
            // --- اضافه کردن هدرها به گرید ---
            // 1. گوشه خالی (0,0)
            let corner = document.createElement('div');
            corner.className = 'grid-header';
            corner.style.gridRow = "1"; 
            corner.style.gridColumn = "1";
            table.appendChild(corner);

            // 2. شماره گروه‌ها (1 تا 18) در سطر 1
            for (let i = 1; i <= 18; i++) {
                let h = document.createElement('div');
                h.className = 'grid-header';
                h.textContent = i;
                h.style.gridRow = "1";
                h.style.gridColumn = i + 1; // ستون 1 رزرو شده برای شماره دوره
                table.appendChild(h);
            }

            // 3. شماره دوره‌ها (1 تا 7) در ستون 1
            for (let i = 1; i <= 7; i++) {
                let h = document.createElement('div');
                h.className = 'grid-header';
                h.textContent = i;
                h.style.gridRow = i + 1; // سطر 1 رزرو شده برای شماره گروه
                h.style.gridColumn = "1";
                table.appendChild(h);
            }

            // --- رندر عناصر ---
            elementsData.forEach(el => {
                const div = document.createElement('div');
                div.className = 'element';
                let gridR = el.row + 1; // +1 بخاطر هدر
                if (el.row >= 9) {
                     gridR = el.row + 1;
                     gridR = el.row + 1; 
                }
                div.style.gridRow = gridR;
                div.style.gridColumn = el.col + 1; // +1 بخاطر هدر ستون
                // تعیین رنگ
                let color;
                if (currentMode === 'block') {
                    color = blockColors[el.block];
                } else {
                    color = colorPalette[el.cat];
                }
                div.style.borderBottom = `3px solid ${color}`;
                div.style.color = 'var(--text-main)'; // Reset color
                div.setAttribute('data-cat', el.cat);
                div.setAttribute('data-catb', el.block);
                if (currentMode === 'bohr') {
                    div.onmouseenter = () => {
                        div.style.border = `1px solid ${color}`
                    };
                } else {
                    div.onmouseenter = () => {
                        div.style.background = currentMode === 'block' ? `${color}33` : `${color}33`;
                        div.style.border = `1px solid ${color}`
                    };
                }
                div.onmouseleave = () => {
                    div.style.background = 'var(--card-bg)';
                    div.style.borderColor = 'var(--border-color)';
                    div.style.borderBottom = `3px solid ${color}`;
                };
                div.onclick = () => openDrawer(el, color);

                let content = '';
                if (currentMode === 'standard' || currentMode === 'block') {
                    content = `
                        <div class="atomic-number">${el.number}</div>
                        <div class="symbol" style="color:${color}">${el.symbol}</div>
                        <div class="name">${el.name}</div>
                        <div class="mass">${el.mass}</div>
                    `;
                } else if (currentMode === 'bohr') {
                    content = `
                        <div class="bohr-view">
                            <canvas class="bohr-canvas" id="bohrCanvas${el.number}" width="380" height="380"></canvas>
                        </div>
                    `;
                    div.classList.add('bohr-element');
                } else if (currentMode === 'orbital') {
                    content = `
                        <div class="orbital-view">
                            <div class="atomic-number" style="position: absolute; top: 4px; left: 4px; font-size: 0.5rem; color: var(--text-secondary);">${el.number}</div>
                            <div class="symbol" style="color:${color}">${el.symbol}</div>
                            <div class="orb" dir="ltr" style="font-size:0.65rem; opacity:0.9">$${orbitalTable(el.number)}$</div>
                        </div>
                    `;
                } else if (currentMode === 'phase') {
                    let icon = '❓';
                    if (el.state === 'solid') icon = '🟫';
                    if (el.state === 'liquid') icon = '💧';
                    if (el.state === 'gas') icon = '☁️';
                    content = `
                        <div class="image-view">
                            <span style="font-size:1.8rem; opacity:0.9;">${icon}</span>
                            <span class="symbol" style="font-size:0.8rem; position:absolute; bottom:2px;">${el.symbol}</span>
                        </div>
                    `;
                } else if (currentMode === 'image') {
                    content = `
                        <div class="image-view">
                            <div class="atomic-number">${el.number}</div>
                            <div class="img-symbol" style="color: ${color};">${el.symbol}</div>
                            <img src="${el.img}" alt="${el.name}" style="max-width:100%; max-height: 36px; border-radius:5px;"/>
                            <div class="name" style="position:absolute; bottom:2px;">${el.name}</div>
                        </div>
                    `;
                    div.onmouseenter = () => {
                        div.style.background = `${color}`;
                        div.style.borderColor = color;
                        div.querySelectorAll('.img-symbol, .atomic-number, .name').forEach(elm => {
                            elm.classList.add('text-white');
                        });
                    };
                    div.onmouseleave = () => {
                        div.style.background = 'var(--card-bg)';
                        div.querySelectorAll('.img-symbol, .atomic-number, .name').forEach(elm => {
                            elm.classList.remove('text-white');
                        });
                        div.style.border = 'none';
                        div.style.borderBottom = `3px solid ${color}`;
                        div.querySelectorAll('.img-symbol').forEach(elm => {
                            elm.style.color = `${color}`;
                        });
                    };
                    div.style.background = 'var(--card-bg)';
                    div.style.border = 'none';
                    div.style.borderBottom = `3px solid ${color}`;
                    div.classList.add('image-element');
                }

                div.innerHTML = content;
                if (el.ra && currentMode !== 'image') div.innerHTML += `<span class="radioactive">☢</span>`;
                table.appendChild(div);
                if (window.renderMathInElement) { renderMathInElement(div, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] }); }
            });
            updateLegend();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.btn-mode').forEach(btn => {
                btn.classList.remove('active');
                if(btn.textContent.includes(getModeName(mode))) btn.classList.add('active');
            });
            renderTable();
            if (mode === 'bohr') {
                elementsData.forEach(el => {
                    const color = colorPalette[el.cat];
                    if(el.shells && el.shells.length > 0) {
                        startBohr(document.getElementById('bohrCanvas' + el.number), el.symbol, el.shells, el.number, getPeriodStartZ(el.row), color);
                    }
                });
            }
        }

        function getModeName(mode) {
            if(mode === 'standard') return 'استاندارد';
            if(mode === 'block') return 'بلوک';
            if(mode === 'bohr') return 'بور';
            if(mode === 'orbital') return 'اوربیتالی';
            if(mode === 'phase') return 'حالت';
            if(mode === 'image') return 'تصویر';
            return '';
        }

        function updateLegend() {
            legendContainer.innerHTML = '';
            let source = currentMode === 'block' ? blockColors : colorPalette;
            let names = currentMode === 'block' ? {'s':'دسته s', 'p':'دسته p', 'd':'دسته d', 'f':'دسته f'} : categoryNames;

            for (const [key, hex] of Object.entries(source)) {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `${names[key]} <div class="legend-color" style="background:${hex}"></div>`;
                let targets;
                item.onmouseenter = () => {
                    table.classList.add('highlight-mode');
                    if (currentMode === 'block') {
                        targets = document.querySelectorAll(`.element[data-catb="${key}"]`);
                        targets.forEach(el => {
                            el.classList.add('highlight');
                            el.style.background = `${hex}`;
                            el.querySelectorAll('.atomic-number, .symbol, .name, .mass').forEach(div => div.classList.add('text-white'));
                        });
                    } else {
                        targets = document.querySelectorAll(`.element[data-cat="${key}"]`);
                        if (currentMode !== 'bohr') {
                            targets.forEach(el => {
                                el.classList.add('highlight');
                                el.style.background = `${hex}`;
                                el.querySelectorAll('.atomic-number, .symbol, .name, .mass, .orb, .img-symbol').forEach(div => div.classList.add('text-white'));
                            });
                        } else {
                            targets.forEach(el => {el.classList.add('highlight'); el.style.border = `1px solid ${hex}`; el.style.borderBottom = `3px solid ${hex}`;});
                        }
                    }
                };

                item.onmouseleave = () => {
                    table.classList.remove('highlight-mode');
                    document.querySelectorAll('.element.highlight').forEach(el => {
                        el.classList.remove('highlight'); el.style.border = 'none';
                        el.style.background = `var(--card-bg)`; el.style.borderBottom = `3px solid ${hex}`;
                        el.querySelectorAll('.atomic-number, .symbol, .name, .mass, .orb, .img-symbol').forEach(div => div.classList.remove('text-white'));
                    });
                };
                legendContainer.appendChild(item);
            }
        }

        // انیمیشن کانواس
        let animationFrameId;

        function openDrawer(el, color) {
            document.getElementById('drawerTitle').textContent = `${el.name} (${el.nameEng})`;
            const content = document.getElementById('drawerContent');
            // تولید رشته لاتک آرایش
            const configLatex = getLatexElectronConfig(el.number);
            // محتوای HTML
            content.innerHTML = `
                <div class="drawer-content">
                    <div>
                        <div Id="element-big-card" class="element-big-card" style="background: linear-gradient(135deg, ${color}aa, ${color});">
                            <div class="big-number">${el.number}</div>
                            <div class="big-symbol">${el.symbol}</div>
                            <div class="big-name">${el.name}</div>
                            <div id="massCardBig" style="margin-top:10px; font-size:1rem; opacity:0.9">$${el.mass}\\text{u}$</div>
                        </div>
                        <div class="bohr-container info-item">
                            <div class="info-label">لایه های الکترونی</div>
                            <canvas id="bohrCanvas" width="380" height="380"></canvas>
                            <div id="orbitInfo"></div>
                        </div>
                    </div>

                    <div class="details-container">
                        <div class="section-title">اطلاعات عمومی</div>
                        <div class="info-grid">
                            <div class="info-item"><div class="info-label">گروه / دوره</div><div style="font-weight: 600;" class="info-value">${el.period < 8 ? el.group + ' / ' + el.period : '-'}</div></div>
                            <div class="info-item"><div class="info-label">دسته</div><div dir="auto" style="font-weight: 600;" class="info-value">$${el.block}$</div></div>
                            <div class="info-item"><div class="info-label">دسته‌بندی</div><div class="info-value" style="color:${color}; font-weight: 600;">${categoryNames[el.cat]}</div></div>
                            <div class="info-item"><div class="info-label">فاز در شرایط استاندارد ($25^{\\circ}\\text{C}$)</div><div style="font-weight: 600;" class="info-value">${el.state === 'solid' ? 'جامد' : el.state === 'gas' ? 'گاز' : 'مایع'}</div></div>
                        </div>

                        <div class="section-title">ویژگی‌های فیزیکی</div>
                        <div class="info-grid">
                            <div class="info-item"><div class="info-label">چگالی</div><div class="info-value" dir="ltr">${el.density}</div></div>
                            <div class="info-item"><div class="info-label">نقطه ذوب</div><div class="info-value" dir="ltr">${el.mp}</div></div>
                            <div class="info-item"><div class="info-label">نقطه جوش</div><div class="info-value" dir="ltr">${el.bp}</div></div>
                            <div class="info-item"><div class="info-label">ایزوتوپ‌ها</div><div class="info-value">${el.isotopes}</div></div>
                        </div>

                        <div class="section-title">ویژگی‌های شیمیایی و اتمی</div>
                        <div Id="chemical-property" class="info-grid">
                            <div class="info-item" style="grid-column: span 2;">
                                <div class="info-label">آرایش الکترونی</div>
                                <div class="info-value" id="configLatexContainer" dir="ltr" style="font-size:1.1rem;  padding:5px;"></div>
                            </div>
                            <div class="info-item"><div class="info-label">شعاع اتمی</div><div class="info-value" dir="ltr">${el.radiusAtm}</div></div>
                            <div class="info-item"><div class="info-label">شعاع واندروالسی</div><div class="info-value" dir="ltr">${el.radiusVDW}</div></div>
                            <div class="info-item"><div class="info-label">الکترونگاتیوی</div><div class="info-value" dir="ltr">${el.electronegativity}</div></div>
                            <div class="info-item"><div class="info-label">عدد اکسایش</div><div class="info-value" dir="ltr">${el.oxidationNum}</div></div>
                            <div class="info-item"><div class="info-label">آلوتروپ‌ها</div><div class="info-value">${el.allotropes}</div></div>
                        </div>

                        <div class="section-title">تاریخچه</div>
                        <div class="info-grid">
                            <div class="info-item"><div class="info-label">کاشف</div><div dir="auto" class="info-value">${el.discover}</div></div>
                            <div class="info-item"><div class="info-label">سال کشف</div><div dir="auto" class="info-value">${el.discoverDate}</div></div>
                            <div class="info-item"><div class="info-label">نامگذار</div><div dir="auto" class="info-value">${el.naming}</div></div>
                        </div>
                    </div>
                </div>
                <div class="section-title" style="padding: 25px;">توضیحات</div>
                <div class="description-box">
                    ${el.desc}
                </div>
            `;
            if (el.ra) {
                document.getElementById('chemical-property').innerHTML += `<div class="info-item"><div class="info-label">رادیواکتیویته</div><div class="info-value">پرتوزا☢️</div></div>`;
                document.getElementById('element-big-card').innerHTML += `<span class="radioactive-big">☢️</span>`;
            };

            // رندر کردن KaTeX
            const resultEl = document.getElementById('configLatexContainer');
            resultEl.innerHTML = `$${configLatex}$`;
            if (window.renderMathInElement) {
                renderMathInElement(resultEl, { delimiters: [{left: '$', right: '$', display: false}] });
            }
            if (window.renderMathInElement) { renderMathInElement(document.getElementById('drawer'), { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] }); }

            // اجرای انیمیشن بور
            drawBohr(el.shells);

            drawer.classList.add('active');
            overlay.classList.add('active');
        }

        function getStateName(state) {
            if(state === 'solid') return 'جامد';
            if(state === 'liquid') return 'مایع';
            if(state === 'gas') return 'گاز';
            return 'ناشناخته';
        }

        function closeDrawer() {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
            // توقف انیمیشن برای جلوگیری از مصرف منابع
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        // --- انیمیشن مدل بور ---
        function drawBohr(shells) {
            const canvas = document.getElementById("bohrCanvas");
            if(!canvas) return;
            const padding = 40;
            const maxRadius = 35 + (shells.length - 1) * 25;
            const size = maxRadius * 2 + padding;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            const cx = canvas.width/2, cy = canvas.height/2;
            let angle = 0;

            // نمایش اطلاعات مداری در زیر کانواس
            const orbitNames = ['اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم'];
            document.getElementById("orbitInfo").innerHTML =
                shells.map((n, i) => `<span>مدار ${orbitNames[i] || i+1}: <b>${n}</b></span>`).join(" | ");

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // هسته اتم
                ctx.fillStyle = "#f87171";
                ctx.beginPath();
                ctx.arc(cx, cy, 10, 0, Math.PI*2);
                ctx.fill();
                
                // درخشش هسته
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#f87171";
                ctx.fill();
                ctx.shadowBlur = 0;

                shells.forEach((count, i) => {
                    const r = 35 + i * 25; // شعاع مدار

                    // رسم مدار
                    ctx.strokeStyle = "rgba(128,128,128,0.3)";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI*2);
                    ctx.stroke();

                    // رسم الکترون‌ها
                    for(let e = 0; e < count; e++) {
                        const speed = 0.005 + (1 / (i + 1)) * 0.01; 
                        const a = angle * (i % 2 === 0 ? 1 : -1) * (2/(i+1)) + e * (2 * Math.PI / count); // چرخش معکوس یکی در میان
                        
                        const ex = cx + r * Math.cos(a);
                        const ey = cy + r * Math.sin(a);

                        ctx.fillStyle = "#38bdf8";
                        ctx.beginPath();
                        ctx.arc(ex, ey, 3.5, 0, Math.PI*2);
                        ctx.fill();
                    }
                });

                angle += 0.015;
                animationFrameId = requestAnimationFrame(animate);
            }
            
            // اگر انیمیشن قبلی در جریان است متوقف شود
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            animate();
        }

        const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;

        function startBohr(canvas, symbol, shells, Z, periodStartZ, color) {
            const ctx = canvas.getContext("2d");
            const cx = canvas.width/2, cy = canvas.height/2;
            let t = 0;

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // symbol
                ctx.fillStyle = isDarkMode ? '#ffffff' : '#000000';
                ctx.font = "22px Vazirmatn";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(symbol, cx, cy);

                shells.forEach((count, i) => {
                    let shrinkFactor;
                    if (72 <= Z && Z <= 86 || 104 <= Z && Z <= 118) {
                        shrinkFactor = 1 - (Z - 4 - periodStartZ) * 0.01;
                    } else {
                        shrinkFactor = 1 - (Z - periodStartZ) * 0.011;
                    }
                    const baseRadius = 35 + i * 25;
                    const r = baseRadius * shrinkFactor;

                    // رسم مدار
                    ctx.strokeStyle = "rgba(128,128,128,0.3)";
                    ctx.lineWidth = 4.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI*2);
                    ctx.stroke();

                    // رسم الکترون‌ها
                    for(let e = 0; e < count; e++) {
                        const dir = i % 2 === 0 ? 1 : -1;
                        const speed = 0.005 + (2 / (i + 1)) * 0.01; 
                        const a = t * (dir) * (speed)  + e * (2 * Math.PI / count); // چرخش معکوس یکی در میان
                        
                        const ex = cx + r * Math.cos(a);
                        const ey = cy + r * Math.sin(a);

                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.arc(ex, ey, 5.5, 0, Math.PI*2);
                        ctx.fill();
                    }
                });

                t++;
                requestAnimationFrame(animate);
            }
            animate();
        }

        // شروع برنامه
        renderTable();

    </script>
</body>

</html>
