## ۷.۴. تفاوت کوانتومی هلیم-۳ و هلیم-۴

یکی از تفاوت‌های بنیادی این دو ایزوتوپ، نوع آمارهٔ کوانتومی آن‌هاست.

هلیم-۴ به دلیل داشتن اسپین کلی صفر، یک بوزون محسوب می‌شود.

در مقابل، هلیم-۳ دارای اسپین نیمه‌صحیح است و در دستهٔ فرمیون‌ها قرار می‌گیرد.

این تفاوت در رفتار فیزیکی آن‌ها در دماهای بسیار پایین اهمیت اساسی دارد.

به همین دلیل، هلیم-۳ و هلیم-۴ در شرایط برودتی رفتارهای متفاوت و جالبی از خود نشان می‌دهند.

# ۸. منشأ هلیم در جهان

هلیم از نظر کیهان‌شناسی یکی از عناصر بسیار مهم است؛ زیرا بخش بزرگی از مقدار کنونی آن در نخستین مراحل تحول جهان به وجود آمده است.

هلیم در جهان عمدتاً از دو فرایند سرچشمه می‌گیرد:

۱. هسته‌زایی مهبانگ؛

۲. همجوشی هسته‌ای در ستارگان.

## ۸.۱. هلیم حاصل از مهبانگ

بر اساس مدل استاندارد کیهان‌شناسی، جهان در مراحل نخستین خود بسیار داغ و چگال بوده است.

پس از آغاز انبساط جهان و کاهش دما، ذرات بنیادی و هسته‌های سبک توانستند در شرایط مناسب تشکیل شوند.

در چند دقیقهٔ نخست پس از مهبانگ، فرایندی به نام هسته‌زایی مهبانگ (Big Bang Nucleosynthesis) رخ داد.

در این فرایند:

- پروتون‌ها و نوترون‌ها تشکیل شدند؛
- هسته‌های دوتریم پدید آمدند؛
- هسته‌های هلیم-۳ و هلیم-۴ تشکیل شدند؛
- مقادیر بسیار کمی از هسته‌های لیتیوم نیز به وجود آمدند.

بخش بزرگی از هلیم نخستین جهان در همین دوره شکل گرفت.

به همین دلیل، هلیم پس از هیدروژن دومین عنصر فراوان در جهان است.

## ۸.۲. تولید هلیم در ستارگان

درون ستارگان، از جمله خورشید، هلیم به‌طور مداوم از همجوشی هسته‌ای هیدروژن تولید می‌شود.

در دماها و فشارهای بسیار زیاد مرکز ستاره، هسته‌های هیدروژن در مجموعه‌ای از واکنش‌های هسته‌ای با یکدیگر ترکیب می‌شوند و هسته‌های هلیم را به وجود می‌آورند.

یکی از مسیرهای مهم این واکنش‌ها، زنجیرهٔ پروتون-پروتون (Proton-Proton Chain) است.

خلاصهٔ واکنش خالص آن را می‌توان به شکل زیر نشان داد:

$$4\\,{}^{1}\\mathrm{H} \\longrightarrow {}^{4}\\mathrm{He} + 2e^+ + 2\\nu_e + Q$$

در این واکنش، چهار هستهٔ هیدروژن در نهایت به یک هستهٔ هلیم-۴ تبدیل می‌شوند و انرژی آزاد می‌شود.

علت آزاد شدن انرژی، اختلاف جرم میان مواد اولیه و محصولات واکنش است.

این اختلاف جرم طبق رابطهٔ معروف اینشتین به انرژی تبدیل می‌شود:

$$\\boxed{E=mc^2}$$

انرژی حاصل از همجوشی هسته‌ای، منبع اصلی نور و گرمای خورشید و سایر ستارگان است.

# ۹. منشأ هلیم روی زمین

با وجود فراوانی هلیم در جهان، این عنصر در محیط زمین نسبتاً کمیاب است.

علت این موضوع، جرم اتمی پایین و قابلیت فرار آن از بخش‌های بالایی جو است.

## ۹.۱. تولید هلیم از واپاشی پرتوزا

بخش مهمی از هلیم زمینی، به‌خصوص هلیم-۴، در اثر واپاشی آلفای هسته‌های پرتوزای عناصر سنگین مانند اورانیوم و توریم تولید می‌شود.

در واپاشی آلفا، هستهٔ مادر یک ذرهٔ آلفا گسیل می‌کند.

ذرهٔ آلفا در حقیقت هستهٔ هلیم-۴ است:

$$\\alpha = {}^{4}\\mathrm{He}^{2+}$$

این ذره پس از جذب دو الکترون می‌تواند به یک اتم خنثی هلیم تبدیل شود:

$$^{4}\\mathrm{He}^{2+}+2e^- \\longrightarrow {}^{4}\\mathrm{He}$$

در طی میلیون‌ها سال، مقادیر زیادی هلیم در سنگ‌ها و مخازن زمین‌شناختی تولید می‌شود.

## ۹.۲. تجمع هلیم در مخازن زیرزمینی

هلیم تولیدشده در سنگ‌ها ممکن است از طریق شکاف‌ها و مسیرهای زمین‌شناختی حرکت کند.

در صورتی که شرایط مناسب وجود داشته باشد، این گاز در حفره‌ها و مخازن زیرزمینی محبوس می‌شود.

بسیاری از این مخازن در کنار ذخایر گاز طبیعی قرار دارند.

به همین دلیل، گاز طبیعی یکی از مهم‌ترین منابع اقتصادی استخراج هلیم در جهان است.

## ۹.۳. هلیم در جو زمین

غلظت هلیم در هوای خشک زمین تقریباً برابر با:

$$5.24\\ \\mathrm{ppm}$$

است؛ یعنی در هر یک میلیون واحد حجمی هوای خشک، حدود ۵٫۲۴ واحد حجمی هلیم وجود دارد.

این مقدار بسیار ناچیز است.

هلیم به دلیل جرم اتمی پایین، در بخش‌های بالایی جو می‌تواند به‌تدریج از میدان گرانشی زمین بگریزد و وارد فضا شود.

در نتیجه، استخراج هلیم از هوای معمولی از نظر اقتصادی مقرون‌به‌صرفه نیست.

# ۱۰. روش‌های استخراج و تولید هلیم

برخلاف بسیاری از گازهای نجیب که از هوا استخراج می‌شوند، منبع اصلی اقتصادی هلیم، مخازن خاص گاز طبیعی هستند.

در برخی از این مخازن، غلظت هلیم به چند درصد حجمی می‌رسد و در مواردی حتی می‌تواند بیشتر باشد.

به‌طور کلی، فرایند تولید تجاری هلیم شامل مراحل زیر است:

۱. استخراج گاز از مخازن زیرزمینی؛

۲. جداسازی اجزای اصلی گاز طبیعی و ناخالصی‌هایی مانند آب و دی‌اکسیدکربن؛

۳. جداسازی و تغلیظ هلیم از مخلوط گازی؛

۴. خالص‌سازی بیشتر با فناوری‌های صنعتی؛

۵. ذخیره‌سازی و توزیع هلیم به شکل گاز فشرده یا مایع برودتی.

برای جداسازی و خالص‌سازی هلیم می‌توان از روش‌هایی مانند جداسازی برودتی، جذب سطحی و فناوری‌های غشایی استفاده کرد.

خلوص نهایی هلیم به نوع کاربرد آن بستگی دارد؛ برای مثال، کاربردهای آزمایشگاهی و نیمه‌رساناها ممکن است به هلیم با خلوص بسیار بالا نیاز داشته باشند.

# ۱۱. حالت‌های ماده و رفتار کوانتومی هلیم

هلیم یکی از جالب‌ترین عناصر برای مطالعهٔ مکانیک کوانتومی در مقیاس ماکروسکوپی است.

در دماهای معمول، رفتار آن تقریباً مانند یک گاز معمولی است؛ اما با کاهش دما، ویژگی‌های متفاوتی از خود نشان می‌دهد.

## ۱۱.۱. هلیم مایع

در فشار یک اتمسفر، هلیم در دمای حدود ۴٫۲۲ کلوین به مایع تبدیل می‌شود.

هلیم مایع به دلیل دمای بسیار پایین، یکی از مهم‌ترین مواد در فناوری‌های سرمایش برودتی است.

دو ایزوتوپ هلیم-۳ و هلیم-۴ در شرایط معمول فشار، در دماهای بسیار پایین می‌توانند به حالت مایع درآیند.

## ۱۱.۲. ابرشارگی هلیم-۴

یکی از شگفت‌انگیزترین پدیده‌های مربوط به هلیم، ابرشارگی (Superfluidity) است.

هنگامی که دمای هلیم-۴ مایع به کمتر از حدود:

$$T_\\lambda \\approx 2.17\\ \\mathrm{K}$$

برسد، یک گذار فازی رخ می‌دهد.

در این حالت، هلیم مایع وارد فاز جدیدی به نام هلیم II می‌شود.

این فاز ویژگی‌هایی دارد که در مایعات معمولی مشاهده نمی‌شوند.

از مهم‌ترین ویژگی‌های ابرشارگی می‌توان به موارد زیر اشاره کرد:

- ویسکوزیتهٔ مؤثر بسیار ناچیز در جریان ابرشار؛
- قابلیت عبور از مجراهای بسیار باریک؛
- هدایت گرمایی فوق‌العاده زیاد؛
- تشکیل لایه‌های نازک روی سطوح جامد؛
- رفتارهای ویژه در انتقال گرما و جریان سیال.

در یک توصیف ساده، ابرشاره می‌تواند بدون اتلاف لزجی متعارف جریان پیدا کند.

این رفتار به دلیل پدیدار شدن اثرات کوانتومی در مقیاس ماکروسکوپی است.

## ۱۱.۳. ابرشارگی هلیم-۳

هلیم-۳ نیز می‌تواند به حالت ابرشاره تبدیل شود؛ اما دمای موردنیاز برای آن بسیار کمتر است.

این گذار در دماهای مرتبهٔ چند میلی‌کلوین رخ می‌دهد.

برخلاف هلیم-۴ که بوزون است، هلیم-۳ فرمیون محسوب می‌شود.

در نتیجه، ابرشارگی هلیم-۳ به فرایند جفت‌شدن کوانتومی فرمیون‌ها شباهت بنیادی به تشکیل جفت‌های کوپر در ابررساناها دارد.

مطالعهٔ هلیم-۳ اهمیت زیادی در درک فیزیک مادهٔ چگال، ابرشارگی و نظریه‌های کوانتومی دارد.

# ۱۲. کاربردهای هلیم

هلیم در بسیاری از فناوری‌های مدرن نقش اساسی دارد.

بعضی از کاربردهای آن به دلیل سبک بودن، برخی به علت بی‌اثری شیمیایی و گروهی نیز به علت ویژگی‌های خاص آن در دماهای بسیار پایین هستند.

## ۱۲.۱. بالن‌ها و بالن‌های هواشناسی

یکی از شناخته‌شده‌ترین کاربردهای هلیم، پر کردن بالن‌هاست.

هلیم چگالی کمتری از هوا دارد؛ بنابراین، نیروی شناوری وارد بر بالن می‌تواند وزن آن را جبران کند و آن را به سمت بالا حرکت دهد.

هلیم برخلاف هیدروژن، اشتعال‌پذیر نیست.

به همین دلیل، در بسیاری از بالن‌های تفریحی، علمی و هواشناسی از آن استفاده می‌شود.

## ۱۲.۲. تصویربرداری تشدید مغناطیسی (MRI)

یکی از مهم‌ترین کاربردهای صنعتی و پزشکی هلیم، خنک کردن آهنرباهای ابررسانای دستگاه‌های MRI است.

در بسیاری از این دستگاه‌ها از آهنرباهایی استفاده می‌شود که برای رسیدن به حالت ابررسانایی باید تا دماهای بسیار پایین سرد شوند.

هلیم مایع به دلیل نقطهٔ جوش بسیار پایین، گزینه‌ای بسیار مناسب برای این منظور است.

حفظ دمای مناسب باعث می‌شود سیم‌پیچ‌های ابررسانا بتوانند جریان الکتریکی را با مقاومت الکتریکی تقریباً صفر عبور دهند و میدان مغناطیسی قدرتمندی ایجاد کنند.

## ۱۲.۳. شتاب‌دهنده‌های ذرات

هلیم در بزرگ‌ترین پروژه‌های فیزیک ذرات نیز کاربرد دارد.

برای مثال، برخورددهندهٔ بزرگ هادرونی (Large Hadron Collider) در مرکز پژوهشی CERN برای خنک کردن آهنرباهای ابررسانای خود از هلیم استفاده می‌کند.

دمای عملیاتی آهنرباهای اصلی این شتاب‌دهنده حدود:

$$1.9\\ \\mathrm{K}$$

است.

این دما حتی از دمای میانگین تابش زمینهٔ کیهانی نیز کمتر است.

سامانهٔ برودتی LHC از هلیم فوق‌سرد برای حفظ شرایط لازم جهت عملکرد آهنرباهای ابررسانا بهره می‌برد.

## ۱۲.۴. جوشکاری

در برخی روش‌های جوشکاری، هلیم به‌عنوان گاز محافظ به کار می‌رود.

این گاز با ایجاد محیطی نسبتاً خنثی از واکنش فلز داغ با اجزای فعال هوا، مانند اکسیژن، جلوگیری می‌کند.

این ویژگی به بهبود کیفیت جوش و کاهش تشکیل اکسیدهای نامطلوب کمک می‌کند.

## ۱۲.۵. صنایع نیمه‌رسانا و فیبر نوری

در تولید قطعات الکترونیکی حساس و نیمه‌رساناها، کنترل ترکیب شیمیایی محیط اهمیت بسیار زیادی دارد.

هلیم به دلیل بی‌اثری شیمیایی و ویژگی‌های انتقال حرارت و نفوذ، در برخی مراحل تولید این تجهیزات به کار می‌رود.

همچنین در ساخت فیبرهای نوری، از هلیم برای ایجاد محیط کنترل‌شده و کمک به مدیریت حرارتی فرایند تولید استفاده می‌شود.

## ۱۲.۶. آشکارسازی نشتی

هلیم به دلیل اندازهٔ کوچک اتمی و قابلیت نفوذ نسبتاً زیاد، برای پیدا کردن نشتی در سامانه‌های بسته استفاده می‌شود.

در روش‌های پیشرفته، دستگاه‌های آشکارساز با استفاده از طیف‌سنجی جرمی می‌توانند مقادیر بسیار کمی از هلیم را شناسایی کنند.

این کاربرد در صنایع هوافضا، تجهیزات خلأ، سامانه‌های برودتی و تجهیزات دقیق اهمیت دارد.

## ۱۲.۷. کاربرد در غواصی

هلیم در برخی مخلوط‌های تنفسی تخصصی غواصی، مانند هلی‌اکس (Heliox)، به کار می‌رود.

جایگزینی بخشی از نیتروژن با هلیم می‌تواند برخی مشکلات تنفسی و فیزیولوژیکی مرتبط با گازهای تنفسی در فشارهای بالا را کاهش دهد.

این مخلوط‌ها فقط در شرایط تخصصی و تحت کنترل حرفه‌ای مورد استفاده قرار می‌گیرند.

## ۱۲.۸. لیزر هلیم ـ نئون

یکی از انواع لیزرهای گازی شناخته‌شده، لیزر هلیم ـ نئون (He-Ne Laser) است.

این لیزر از مخلوطی از هلیم و نئون در یک لولهٔ تخلیهٔ الکتریکی استفاده می‌کند.

از کاربردهای آن می‌توان به موارد زیر اشاره کرد:

- آزمایش‌های اپتیکی؛
- تداخل‌سنجی؛
- اندازه‌گیری‌های دقیق؛
- آموزش فیزیک؛
- برخی سامانه‌های اندازه‌گیری صنعتی.

## ۱۲.۹. میکروسکوپ یونی هلیم

در فناوری‌های پیشرفتهٔ تصویربرداری، از پرتو یون‌های هلیم برای بررسی سطوح مواد استفاده می‌شود.

میکروسکوپ یونی هلیم (Helium Ion Microscope) یکی از ابزارهای پیشرفتهٔ بررسی ساختارهای بسیار کوچک است که در پژوهش‌های مواد و نیمه‌رساناها کاربرد دارد.

## ۱۲.۱۰. کاربردهای هلیم-۳ در فناوری

هلیم-۳ به دلیل خواص هسته‌ای و کوانتومی منحصربه‌فرد خود کاربردهای ویژه‌ای دارد.

یکی از مهم‌ترین کاربردهای آن، استفاده در آشکارسازهای نوترونی است.

هلیم-۳ همچنین در یخچال‌های رقیق‌سازی به کار می‌رود؛ دستگاه‌هایی که برای دستیابی به دماهای بسیار پایین، در محدودهٔ میلی‌کلوین، طراحی شده‌اند.

این دماها در آزمایش‌های ابررسانایی، فیزیک کوانتومی و مطالعهٔ مواد پیشرفته اهمیت دارند.

# ۱۳. هلیم و آیندهٔ انرژی؛ همجوشی هلیم-۳

یکی از موضوعات جذاب در پژوهش‌های انرژی، بررسی امکان استفاده از هلیم-۳ در واکنش‌های همجوشی هسته‌ای است.

در یکی از واکنش‌های مورد مطالعه، هلیم-۳ با دوتریم ترکیب می‌شود:

$$^{2}\\mathrm{H}+{}^{3}\\mathrm{He} \\longrightarrow {}^{4}\\mathrm{He}+{}^{1}\\mathrm{H}+18.3\\ \\mathrm{MeV}$$

در این واکنش، یک هستهٔ هلیم-۴، یک پروتون و انرژی آزاد می‌شوند.

مزیت مورد توجه این واکنش آن است که محصولات اصلی آن ذرات باردار هستند و خود واکنش اصلی مستقیماً نوترون تولید نمی‌کند.

با این حال، این موضوع به معنای کاملاً بدون نوترون بودن یک راکتور واقعی نیست؛ زیرا واکنش‌های جانبی و سایر فرایندهای هسته‌ای می‌توانند نوترون تولید کنند.

استفادهٔ گسترده از این نوع همجوشی با چالش‌های مهمی روبه‌روست:

- کمیابی هلیم-۳ روی زمین؛
- دشواری تأمین سوخت؛
- نیاز به دماهای بسیار بالا؛
- دشواری محصورسازی پلاسما؛
- چالش‌های مهندسی و اقتصادی؛
- نیاز به توسعهٔ فناوری‌های پیشرفتهٔ تبدیل انرژی.

بنابراین، همجوشی دوتریم ـ هلیم-۳ در حال حاضر یک مسیر پژوهشی و نظری برای آیندهٔ انرژی است و نباید آن را یک فناوری تجاری و عملیاتی دانست.

# ۱۴. هلیم و مسئلهٔ تغییر صدای انسان

یکی از پدیده‌های شناخته‌شدهٔ مربوط به هلیم، تغییر صدای انسان پس از قرار گرفتن صدا در محیطی حاوی این گاز است.

سرعت صوت در هلیم بسیار بیشتر از سرعت آن در هواست.

در شرایط دمایی یکسان، سرعت صوت در هلیم تقریباً سه برابر سرعت صوت در هواست.

اما نکتهٔ مهم این است که هلیم فرکانس اصلی ارتعاش تارهای صوتی را مستقیماً افزایش نمی‌دهد.

آنچه تغییر می‌کند، نحوهٔ انتشار و تشدید امواج صوتی در مجرای صوتی است.

این تغییر در فرکانس‌های تشدیدی مجرای صوتی یا فرمنت‌ها (Formants) باعث می‌شود صدای تولیدشده زیرتر و متفاوت شنیده شود.

**نکتهٔ ایمنی:** استنشاق هلیم برای تغییر صدا خطرناک است. هلیم با جابه‌جا کردن اکسیژن می‌تواند باعث کمبود اکسیژن، بیهوشی و حتی مرگ شود. غیرسمی بودن شیمیایی این گاز به معنای بی‌خطر بودن تنفس آن نیست.

# ۱۵. ایمنی و خطرات هلیم

هلیم از نظر شیمیایی غیرسمی، غیرقابل اشتعال و بسیار کم‌واکنش است؛ اما این ویژگی‌ها به معنی بی‌خطر بودن آن در تمام شرایط نیست.

مهم‌ترین خطرات آن عبارت‌اند از:

## ۱۵.۱. خفگی ناشی از کمبود اکسیژن

هلیم یک گاز خفه‌کنندهٔ ساده (Simple Asphyxiant) محسوب می‌شود.

به این معنا که در صورت جایگزینی مقدار قابل توجهی از هوای محیط با هلیم، غلظت اکسیژن کاهش پیدا می‌کند.

کاهش اکسیژن می‌تواند موجب اختلال عملکرد مغز، بیهوشی و در شرایط شدید مرگ شود.

## ۱۵.۲. خطر هلیم مایع

هلیم مایع دمای فوق‌العاده پایینی دارد.

تماس مستقیم با آن یا سطوحی که به‌شدت سرد شده‌اند می‌تواند به بافت‌های بدن آسیب برساند و موجب سرمازدگی شدید شود.

## ۱۵.۳. خطر گاز فشرده

هلیم معمولاً در مخازن تحت فشار ذخیره می‌شود.

بنابراین، خطرات فیزیکی مربوط به فشار زیاد و آزاد شدن ناگهانی گاز نیز باید در نظر گرفته شوند.

در نتیجه، استفاده از هلیم مایع یا فشرده نیازمند تجهیزات تخصصی و رعایت استانداردهای ایمنی است.

# ۱۶. اهمیت اقتصادی و مسئلهٔ کمیابی هلیم

با وجود فراوانی بسیار زیاد هلیم در جهان، این عنصر روی زمین یک منبع ارزشمند و نسبتاً محدود محسوب می‌شود.

دلیل اصلی این موضوع آن است که بخش زیادی از هلیم تولیدشده در فرایندهای طبیعی، پس از ورود به جو به‌تدریج به فضا می‌گریزد.

از سوی دیگر، تولید طبیعی هلیم در پوستهٔ زمین بسیار آهسته و در مقیاس زمانی زمین‌شناختی انجام می‌شود.

بنابراین، منابع قابل استخراج هلیم را نمی‌توان در مقیاس زمانی مصرف انسانی به‌سرعت جایگزین کرد.

این مسئله به‌ویژه از آن جهت مهم است که بسیاری از کاربردهای هلیم، مانند تجهیزات MRI، شتاب‌دهنده‌ها، آشکارسازهای نوترونی و فناوری‌های برودتی، به ویژگی‌هایی وابسته‌اند که جایگزین کردن هلیم در آن‌ها دشوار است.

## ۱۶.۱. بازیافت هلیم

یکی از راهکارهای مهم برای مدیریت منابع هلیم، بازیافت آن است.

در برخی تجهیزات پزشکی و آزمایشگاهی، سامانه‌های بازیافت طراحی می‌شوند تا گاز تبخیرشده یا مصرف‌شده دوباره جمع‌آوری، خالص‌سازی و مورد استفاده قرار گیرد.

این کار می‌تواند میزان هلیم ازدست‌رفته را کاهش دهد و پایداری تأمین این عنصر را افزایش دهد.

بر اساس گزارش سال ۲۰۲۶ سازمان زمین‌شناسی ایالات متحده (USGS)، فروش هلیم گازی و هلیم با خلوص بالا در ایالات متحده برای سال ۲۰۲۵ حدود ۸۱ میلیون متر مکعب برآورد شده است.

این آمار نشان‌دهندهٔ اهمیت اقتصادی و صنعتی این عنصر است.

# ۱۷. اثرات زیست‌محیطی هلیم

هلیم برخلاف گازهایی مانند دی‌اکسیدکربن و متان، گاز گلخانه‌ای محسوب نمی‌شود و در شرایط عادی نیز از نظر شیمیایی واکنش‌پذیری بسیار اندکی دارد.

با این حال، مسئلهٔ اصلی زیست‌محیطی و راهبردی آن، محدودیت منابع قابل استخراج است.

هلیم پس از آزاد شدن در جو به‌راحتی از دسترس منابع زمینی خارج می‌شود و بازگرداندن آن از فضا از نظر عملی و اقتصادی امکان‌پذیر نیست.

از این رو، استفادهٔ بی‌رویه از هلیم در کاربردهای کم‌اهمیت می‌تواند منابعی را مصرف کند که برای مصارف پزشکی، علمی و فناوری‌های پیشرفته اهمیت زیادی دارند.

بازیافت و مدیریت مصرف هلیم، یکی از راهکارهای مهم برای حفظ این منبع ارزشمند است.

# ۱۸. چند نکتهٔ علمی جالب دربارهٔ هلیم

۱. هلیم نخستین بار در خورشید کشف شد، نه روی زمین.

۲. هلیم پس از هیدروژن فراوان‌ترین عنصر جهان است.

۳. هلیم در فشار یک اتمسفر حتی در دماهای بسیار نزدیک به صفر مطلق جامد نمی‌شود.

۴. هلیم-۴ می‌تواند به حالت ابرشاره تبدیل شود و رفتارهایی کاملاً متفاوت از مایعات معمولی نشان دهد.

۵. هلیم پایین‌ترین نقطهٔ جوش را در میان عناصر دارد.

۶. هلیم در دماهای بسیار پایین برای حفظ حالت ابررسانایی آهنرباهای قدرتمند به کار می‌رود.

۷. هلیم-۳ و هلیم-۴ از نظر آمارهٔ کوانتومی با یکدیگر تفاوت دارند؛ اولی فرمیون و دومی بوزون است.

۸. هلیم با وجود بی‌اثری شیمیایی زیاد، در فشارهای فوق‌العاده بالا می‌تواند ترکیبات غیرمعمولی تشکیل دهد.

۹. بخش بزرگی از هلیم موجود در مخازن زمینی حاصل واپاشی پرتوزای اورانیوم و توریم است.

۱۰. هلیم در برخورددهندهٔ بزرگ هادرونی CERN برای خنک کردن آهنرباهای ابررسانا تا دمای حدود ۱٫۹ کلوین استفاده می‌شود.

# ۱۹. نتیجه‌گیری

هلیم عنصری است که اهمیت آن بسیار فراتر از کاربردهای ساده‌ای مانند پر کردن بالن‌هاست. این عنصر به دلیل ساختار الکترونی ویژه، پایداری شیمیایی بالا، چگالی پایین و ویژگی‌های کوانتومی منحصربه‌فرد، جایگاه مهمی در علوم مختلف پیدا کرده است.

از دیدگاه کیهان‌شناسی، هلیم یکی از نخستین عناصر تشکیل‌شده در جهان است و فراوانی آن اطلاعات ارزشمندی دربارهٔ مراحل ابتدایی تحول کیهان در اختیار دانشمندان قرار می‌دهد. از دیدگاه اخترفیزیک، همجوشی هسته‌ای هیدروژن و تولید هلیم در ستارگان، اساس تولید انرژی آن‌ها را تشکیل می‌دهد.

از دیدگاه فیزیک مادهٔ چگال نیز هلیم یکی از مهم‌ترین مواد برای بررسی پدیده‌های کوانتومی، به‌ویژه ابرشارگی، است. رفتار هلیم-۳ و هلیم-۴ در دماهای بسیار پایین، فرصت کم‌نظیری برای مطالعهٔ خواص بنیادی ماده فراهم کرده است.

از سوی دیگر، کاربرد هلیم در تصویربرداری پزشکی، تجهیزات ابررسانا، شتاب‌دهنده‌های ذرات، صنایع نیمه‌رسانا، فناوری‌های هوافضا و آشکارسازهای علمی، اهمیت صنعتی آن را نشان می‌دهد.

با وجود فراوانی هلیم در مقیاس کیهانی، منابع اقتصادی آن روی زمین محدود هستند. بنابراین، توسعهٔ فناوری‌های بازیافت، بهینه‌سازی مصرف و مدیریت منابع این عنصر برای آیندهٔ علم و فناوری اهمیت زیادی دارد.

در نهایت، هلیم نمونه‌ای ارزشمند از پیوند میان شیمی، فیزیک، مکانیک کوانتومی، اخترفیزیک، زمین‌شناسی و مهندسی است؛ عنصری ساده از نظر ساختار اتمی، اما بسیار غنی از نظر رفتارهای فیزیکی و کاربردهای علمی.

## چکیده

لیتیم با نماد شیمیایی $\\mathrm{Li}$ و عدد اتمی ۳، سومین عنصر جدول تناوبی و سبک‌ترین فلز در میان عناصر شیمیایی است. این عنصر از فلزات قلیایی گروه نخست جدول تناوبی به شمار می‌رود و در شرایط معمول، جامدی نرم، نقره‌ای‌رنگ و بسیار سبک است. اتم لیتیم سه پروتون و سه الکترون دارد و آرایش الکترونی آن به‌صورت $1s^2 2s^1$ است. لیتیم در واکنش‌های شیمیایی معمولاً یک الکترون ظرفیت خود را از دست می‌دهد و یون مثبت $\\mathrm{Li^+}$ تشکیل می‌دهد.

لیتیم در طبیعت به‌صورت فلز آزاد یافت نمی‌شود، بلکه در کانی‌های سیلیکاتی، شورابه‌های زیرزمینی و برخی منابع زمین‌شناختی حضور دارد. دو ایزوتوپ پایدار طبیعی آن، لیتیم-۶ و لیتیم-۷، در پژوهش‌های هسته‌ای و ژئوشیمیایی اهمیت دارند. از مهم‌ترین کاربردهای لیتیم می‌توان به تولید باتری‌های قابل‌شارژ، ساخت شیشه و سرامیک‌های ویژه، تولید روان‌کارهای صنعتی، ساخت آلیاژهای سبک و برخی کاربردهای پزشکی اشاره کرد.

در دهه‌های اخیر، افزایش استفاده از خودروهای برقی، تجهیزات الکترونیکی قابل‌حمل و سامانه‌های ذخیره‌سازی انرژی، لیتیم را به یکی از عناصر راهبردی صنعت و فناوری تبدیل کرده است. با وجود اهمیت اقتصادی آن، استخراج لیتیم با چالش‌هایی مانند مصرف آب، تغییرات محیط‌زیستی، تولید پسماند و تمرکز منابع در مناطق خاص جهان همراه است. بنابراین، توسعهٔ روش‌های استخراج کم‌اثر، بازیافت باتری‌ها و مدیریت پایدار منابع لیتیم از موضوعات مهم پژوهش‌های علمی و صنعتی به شمار می‌روند.

**واژگان کلیدی:** لیتیم، فلزات قلیایی، ساختار اتمی، ایزوتوپ، لیتیم-۶، لیتیم-۷، باتری لیتیم‌یونی، استخراج لیتیم، ذخیره‌سازی انرژی، ژئوشیمی.

## ۱. معرفی و مشخصات عمومی

لیتیم سومین عنصر جدول تناوبی است و پس از هیدروژن و هلیوم قرار دارد. نماد شیمیایی آن $\\mathrm{Li}$ و عدد اتمی آن ۳ است. نام این عنصر از واژهٔ یونانی *Lithos* به معنای «سنگ» گرفته شده است؛ زیرا برخلاف برخی فلزات قلیایی که نخستین‌بار از مواد گیاهی شناسایی شدند، لیتیم از یک کانی معدنی کشف شد.

لیتیم در دمای اتاق فلزی جامد، نرم، نقره‌ای‌رنگ و بسیار سبک است. چگالی آن از چگالی آب کمتر است؛ بااین‌حال، به دلیل واکنش‌پذیری شیمیایی آن با آب، نمی‌توان رفتار لیتیم را صرفاً با مفهوم شناوری فلزات توضیح داد.

این عنصر از نظر شیمیایی به سدیم و پتاسیم شباهت دارد؛ زیرا هر سه در گروه فلزات قلیایی قرار می‌گیرند و در لایهٔ ظرفیت خود یک الکترون دارند. بااین‌حال، اندازهٔ کوچک اتم و یون لیتیم باعث می‌شود برخی خواص آن با سایر اعضای گروه متفاوت باشد.

## ۲. تاریخچهٔ کشف لیتیم

### ۲.۱. کشف کانی‌های لیتیم‌دار

تاریخچهٔ شناخت لیتیم به اواخر قرن هجدهم بازمی‌گردد. در دههٔ ۱۷۹۰ میلادی، کانی پتالیـت (Petalite) در جزیرهٔ اوتو در سوئد شناسایی شد. این کانی در بررسی‌های اولیه ویژگی‌هایی از خود نشان می‌داد که توجه پژوهشگران را جلب کرد.

با بررسی ترکیب شیمیایی این کانی مشخص شد که ماده‌ای ناشناخته در ساختار آن وجود دارد.

### ۲.۲. شناسایی عنصر توسط یوهان آگوست آرفودسون

در سال ۱۸۱۷، شیمیدان سوئدی یوهان آگوست آرفودسون (Johan August Arfwedson) هنگام بررسی کانی پتالیـت به وجود عنصری ناشناخته پی برد.

او دریافت که این عنصر از نظر خواص شیمیایی به فلزات قلیایی شباهت دارد، اما نمی‌توان آن را با سدیم یا پتاسیم یکسان دانست.

آرفودسون نام Lithium را از واژهٔ یونانی *Lithos*، به معنای سنگ، برای این عنصر انتخاب کرد.

### ۲.۳. جداسازی فلز لیتیم

آرفودسون موفق نشد لیتیم فلزی خالص را جدا کند. در سال ۱۸۲۱، ویلیام برند مقدار بسیار اندکی از این فلز را به دست آورد؛ اما مقدار آن برای بررسی‌های دقیق کافی نبود.

سرانجام در سال ۱۸۵۵، رابرت بونزن و آگوستوس ماتیسن توانستند لیتیم فلزی را با استفاده از الکترولیز لیتیم کلرید مذاب به مقدار قابل‌اندازه‌گیری تولید کنند.

این مرحله، گامی اساسی در شناخت خواص فیزیکی و شیمیایی لیتیم به شمار می‌رفت.

منبع: [Royal Society of Chemistry – Lithium History](https://periodic-table.rsc.org/element/3/lithium).

## ۳. ساختار اتمی و ویژگی‌های کوانتومی

### ۳.۱. ساختار اتم لیتیم

عدد اتمی لیتیم برابر با ۳ است؛ بنابراین تمام اتم‌های لیتیم دارای سه پروتون در هستهٔ خود هستند.

در یک اتم خنثی، تعداد الکترون‌ها با تعداد پروتون‌ها برابر است؛ پس اتم خنثی لیتیم دارای سه الکترون است.

تعداد نوترون‌های هسته به ایزوتوپ لیتیم بستگی دارد. برای مثال، لیتیم-۶ سه نوترون و لیتیم-۷ چهار نوترون دارد.

| ذره | تعداد در لیتیم-۶ | تعداد در لیتیم-۷ | بار الکتریکی |
|---|---:|---:|---|
| پروتون | ۳ | ۳ | مثبت |
| نوترون | ۳ | ۴ | خنثی |
| الکترون در اتم خنثی | ۳ | ۳ | منفی |

### ۳.۲. آرایش الکترونی

سه الکترون اتم لیتیم در دو زیرلایهٔ الکترونی قرار می‌گیرند.

دو الکترون نخست در اوربیتال $1s$ و الکترون سوم در اوربیتال $2s$ قرار دارد.

بنابراین آرایش الکترونی آن به‌صورت زیر است:

$$1s^2 2s^1$$

در نمایش فشرده، آرایش الکترونی لیتیم چنین نوشته می‌شود:

$$[\\mathrm{He}]2s^1$$

از آنجا که زیرلایهٔ $1s$ کامل است، لیتیم تنها یک الکترون در لایهٔ ظرفیت خود دارد. این الکترون در تشکیل بسیاری از پیوندهای شیمیایی و رفتار فلزی لیتیم نقش اساسی ایفا می‌کند.

### ۳.۳. تشکیل یون لیتیم

لیتیم معمولاً با از دست دادن یک الکترون، به یون مثبت تبدیل می‌شود:

$$\\mathrm{Li \\rightarrow Li^+ + e^-}$$

یون لیتیم دارای دو الکترون است و آرایش الکترونی آن با آرایش الکترونی هلیوم برابر می‌شود:

$$\\mathrm{Li^}: 1s^2$$

البته نماد درست یون حاصل به‌صورت $\\mathrm{Li^+}$ است.

تشکیل یون پایدار $\\mathrm{Li^+}$ یکی از مهم‌ترین ویژگی‌های شیمیایی این عنصر است.

### ۳.۴. انرژی یونش

انرژی یونش نخست لیتیم، مقدار انرژی لازم برای جداکردن نخستین الکترون از اتم خنثی لیتیم در حالت پایه است.

مقدار این انرژی تقریباً برابر با $5.3917\\ \\mathrm{eV}$ است.

$$\\mathrm{Li \\rightarrow Li^+ + e^-}$$

انرژی یونش نخست لیتیم از انرژی یونش نخست هیدروژن کمتر است؛ اما از انرژی یونش سدیم بیشتر است. این موضوع با روندهای تناوبی و تفاوت فاصلهٔ الکترون ظرفیت از هسته ارتباط دارد.

### ۳.۵. شعاع اتمی و اثر هسته‌ای

اتم لیتیم نسبت به اتم هیدروژن و هلیوم بزرگ‌تر است؛ زیرا دارای دو لایهٔ الکترونی است. الکترون ظرفیت آن در اوربیتال $2s$ قرار دارد و نسبت به الکترون‌های لایهٔ داخلی، فاصلهٔ بیشتری از هسته دارد.

دو الکترون لایهٔ داخلی بخشی از بار مثبت هسته را برای الکترون ظرفیت پوشش می‌دهند. به این پدیده اثر پوششی (Shielding Effect) گفته می‌شود.

در نتیجه، الکترون ظرفیت لیتیم نسبتاً آسان‌تر جدا می‌شود و تمایل این عنصر به تشکیل یون مثبت توضیح داده می‌شود.

### ۳.۶. ساختار بلوری

لیتیم فلزی در شرایط معمول دارای ساختار بلوری مکعبی مرکزپر (Body-Centered Cubic یا BCC) است.

در این ساختار، اتم‌ها در گوشه‌های یک مکعب و یک اتم در مرکز مکعب قرار می‌گیرد. این آرایش یکی از ساختارهای بلوری رایج در برخی فلزات است.

منابع: [NIST – Atomic Data for Lithium](https://physics.nist.gov/PhysRefData/Handbook/Tables/lithiumtable1.htm) و [RSC – Lithium](https://periodic-table.rsc.org/element/3/lithium).

## ۴. جایگاه لیتیم در جدول تناوبی

لیتیم در گروه نخست و دورهٔ دوم جدول تناوبی قرار دارد و به بلوک s تعلق دارد.

اعضای گروه نخست، به استثنای هیدروژن، فلزات قلیایی نامیده می‌شوند. این عناصر معمولاً یک الکترون در لایهٔ ظرفیت خود دارند و تمایل دارند با از دست دادن آن، یون مثبت با بار $+1$ تشکیل دهند.

ترتیب چند عنصر نخست این گروه به‌صورت زیر است:

$\\mathrm{Li}$، $\\mathrm{Na}$، $\\mathrm{K}$، $\\mathrm{Rb}$، $\\mathrm{Cs}$ و $\\mathrm{Fr}$

لیتیم در مقایسه با سایر فلزات قلیایی، رفتارهایی ویژه دارد:

۱. کمترین چگالی را در میان فلزات دارد.

۲. سخت‌تر و دارای نقطهٔ ذوب بالاتری نسبت به سدیم و پتاسیم است.

۳. به دلیل شعاع یونی بسیار کوچک، برخی از ترکیبات آن رفتار متفاوتی نسبت به ترکیبات عناصر پایین‌تر گروه نشان می‌دهند.

۴. با وجود واکنش‌پذیری قابل‌توجه، معمولاً واکنش آن با آب از واکنش سدیم و پتاسیم آرام‌تر است؛ بااین‌حال، این واکنش همچنان خطرناک است.

### ۴.۱. رابطهٔ لیتیم با هیدروژن

لیتیم از نظر آرایش الکترونی ظرفیت، شباهت‌هایی با هیدروژن دارد؛ زیرا هر دو یک الکترون در زیرلایهٔ ظرفیت خود دارند.

بااین‌حال، هیدروژن نافلز است و لیتیم فلزی قلیایی محسوب می‌شود. بنابراین شباهت آرایش الکترونی به معنای یکسان‌بودن خواص شیمیایی آن‌ها نیست.

## ۵. خواص فیزیکی لیتیم

### ۵.۱. ظاهر و حالت فیزیکی

لیتیم در دمای اتاق فلزی جامد، نرم و نقره‌ای‌رنگ است. سطح تازهٔ آن ظاهر فلزی براق دارد؛ اما در تماس با محیط، سطح آن به‌تدریج تغییر می‌کند.

لیتیم سبک‌ترین فلز جدول تناوبی است و چگالی آن تقریباً برابر با $0.534\\ \\mathrm{g/cm^3}$ است.

این چگالی از چگالی آب کمتر است؛ ولی لیتیم به علت واکنش‌پذیری با آب، نمی‌تواند مانند یک مادهٔ بی‌اثر در سطح آن باقی بماند.

### ۵.۲. نقطهٔ ذوب و جوش

لیتیم برخلاف هیدروژن و هلیوم، در دمای اتاق جامد است. برای ذوب‌شدن آن باید دما به حدود $180.50\\ ^{\\circ}\\mathrm{C}$ برسد.

| ویژگی | مقدار تقریبی |
|---|---:|
| نقطهٔ ذوب | $180.50\\ ^{\\circ}\\mathrm{C}$ |
| نقطهٔ ذوب بر حسب کلوین | $453.65\\ \\mathrm{K}$ |
| نقطهٔ جوش | $1342\\ ^{\\circ}\\mathrm{C}$ |
| چگالی | $0.534\\ \\mathrm{g/cm^3}$ |
| گرمای ویژه | حدود $3582\\ \\mathrm{J/(kg\\cdot K)}$ |

منبع: [Royal Society of Chemistry](https://periodic-table.rsc.org/element/3/lithium).

### ۵.۳. رسانایی الکتریکی و گرمایی

لیتیم یک فلز است و مانند دیگر فلزات، توانایی هدایت جریان الکتریکی و گرما را دارد.

رسانایی الکتریکی آن به وجود الکترون‌های متحرک در ساختار فلزی وابسته است. این الکترون‌ها می‌توانند در پاسخ به میدان الکتریکی در شبکهٔ فلزی حرکت کنند.

### ۵.۴. سختی و خواص مکانیکی

لیتیم فلزی بسیار نرم است و سختی کمی دارد. به همین دلیل، کاربرد آن در بسیاری از موارد به شکل ترکیبات شیمیایی یا آلیاژهای مهندسی است، نه به‌صورت قطعات فلزی خالص.

افزودن لیتیم به برخی آلیاژهای آلومینیوم و منیزیم می‌تواند چگالی آلیاژ را کاهش دهد و در شرایط مناسب، نسبت استحکام به جرم آن را بهبود دهد.

### ۵.۵. رنگ شعله

ترکیبات لیتیم در آزمون شعله، رنگ قرمز پررنگ یا قرمز کارمینی ایجاد می‌کنند.

این رنگ ناشی از گذارهای الکترونی و گسیل تابش با طول موج‌های مشخص است. به همین دلیل، آزمون شعله از روش‌های کیفی قدیمی برای شناسایی برخی یون‌های فلزی به شمار می‌رود.

## ۶. خواص شیمیایی لیتیم

### ۶.۱. واکنش‌پذیری و عدد اکسایش

لیتیم در واکنش‌های شیمیایی معمولاً یک الکترون از دست می‌دهد و به یون $\\mathrm{Li^+}$ تبدیل می‌شود.

در نتیجه، عدد اکسایش رایج آن در ترکیبات شیمیایی برابر با $+1$ است.

لیتیم عنصری نسبتاً واکنش‌پذیر است و می‌تواند با آب، اکسیژن، نیتروژن، هالوژن‌ها و برخی مواد دیگر واکنش دهد.

### ۶.۲. واکنش با آب

لیتیم با آب واکنش می‌دهد و لیتیم هیدروکسید و گاز هیدروژن تولید می‌کند.

معادلهٔ موازنه‌شدهٔ این واکنش به شکل زیر است:

$$\\mathrm{2Li + 2H_2O \\rightarrow 2LiOH + H_2}$$

لیتیم هیدروکسید، $\\mathrm{LiOH}$، یک باز قوی است و محلول آن خاصیت قلیایی دارد.

این واکنش گرمازا است و به دلیل تولید گاز هیدروژن و آزادشدن انرژی، از نظر ایمنی خطرناک محسوب می‌شود.

### ۶.۳. واکنش با اکسیژن

لیتیم با اکسیژن واکنش می‌دهد و اکسید لیتیم تشکیل می‌دهد:

$$\\mathrm{4Li + O_2 \\rightarrow 2Li_2O}$$

اکسید لیتیم، $\\mathrm{Li_2O}$، یکی از ترکیبات معدنی مهم لیتیم است و در تولید برخی شیشه‌ها و مواد سرامیکی کاربرد دارد.

### ۶.۴. واکنش با نیتروژن

یکی از ویژگی‌های قابل‌توجه لیتیم، توانایی واکنش آن با نیتروژن برای تشکیل لیتیم نیترید است.

$$\\mathrm{6Li + N_2 \\rightarrow 2Li_3N}$$

این ویژگی در مقایسه با بسیاری از فلزات قلیایی دیگر اهمیت دارد.

### ۶.۵. واکنش با هالوژن‌ها

لیتیم با هالوژن‌ها ترکیبات یونی تشکیل می‌دهد. برای مثال، واکنش آن با کلر به تولید لیتیم کلرید منجر می‌شود:

$$\\mathrm{2Li + Cl_2 \\rightarrow 2LiCl}$$

لیتیم کلرید یک نمک یونی است که در برخی فرایندهای صنعتی و شیمیایی کاربرد دارد.

### ۶.۶. تشکیل هیدرید لیتیم

لیتیم با هیدروژن ترکیب شده و لیتیم هیدرید تشکیل می‌دهد:

$$\\mathrm{2Li + H_2 \\rightarrow 2LiH}$$

لیتیم هیدرید جامدی یونی است که در آن هیدروژن به شکل یون هیدرید $\\mathrm{H^-}$ حضور دارد.

### ۶.۷. اثر اندازهٔ کوچک یون لیتیم

یون $\\mathrm{Li^+}$ در مقایسه با یون‌های فلزات قلیایی سنگین‌تر، شعاع یونی کوچک‌تری دارد.

این ویژگی باعث می‌شود چگالی بار آن نسبتاً زیاد باشد؛ در نتیجه، توانایی بیشتری برای قطبی‌کردن ابر الکترونی یون‌های منفی دارد.

به همین علت، برخی ترکیبات لیتیم نسبت به ترکیبات مشابه سدیم یا پتاسیم، ویژگی‌های متفاوتی از نظر حلالیت، پایداری و ماهیت پیوند دارند.

## ۷. ایزوتوپ‌های لیتیم

ایزوتوپ‌ها اتم‌های یک عنصر هستند که تعداد پروتون‌های یکسان، اما تعداد نوترون‌های متفاوت دارند.

لیتیم در طبیعت دو ایزوتوپ پایدار اصلی دارد:

- لیتیم-۶؛
- لیتیم-۷.

هر دو ایزوتوپ دارای سه پروتون هستند، اما تعداد نوترون‌های آن‌ها متفاوت است.

### ۷.۱. لیتیم-۶

لیتیم-۶ با نماد $^{6}_{3}\\mathrm{Li}$ نشان داده می‌شود.

هستهٔ آن از سه پروتون و سه نوترون تشکیل شده است. فراوانی طبیعی این ایزوتوپ به‌طور معمول حدود ۷٫۵۹ درصد گزارش می‌شود؛ البته مقدار آن در نمونه‌های طبیعی مختلف می‌تواند تغییر کند.

لیتیم-۶ به دلیل ویژگی‌های هسته‌ای خاص خود در پژوهش‌های فیزیک هسته‌ای، بررسی برهم‌کنش نوترون‌ها با ماده و برخی فناوری‌های هسته‌ای اهمیت دارد.

### ۷.۲. لیتیم-۷

لیتیم-۷ با نماد $^{7}_{3}\\mathrm{Li}$ نشان داده می‌شود.

هستهٔ آن از سه پروتون و چهار نوترون تشکیل شده است. این ایزوتوپ فراوان‌ترین ایزوتوپ طبیعی لیتیم است و به‌طور معمول حدود ۹۲٫۴۱ درصد لیتیم طبیعی را تشکیل می‌دهد.

لیتیم-۷ در مطالعات اخترفیزیک، زمین‌شناسی و فیزیک هسته‌ای اهمیت دارد.

### ۷.۳. مقایسهٔ ایزوتوپ‌ها

| ویژگی | لیتیم-۶ | لیتیم-۷ |
|---|---:|---:|
| نماد | $^{6}_{3}\\mathrm{Li}$ | $^{7}_{3}\\mathrm{Li}$ |
| تعداد پروتون | ۳ | ۳ |
| تعداد نوترون | ۳ | ۴ |
| عدد جرمی | ۶ | ۷ |
| جرم اتمی | تقریباً $6.0151\\ \\mathrm{u}$ | تقریباً $7.0160\\ \\mathrm{u}$ |
| فراوانی طبیعی نماینده | حدود ۷٫۵۹٪ | حدود ۹۲٫۴۱٪ |
| پایداری | پایدار | پایدار |

مقادیر فراوانی بالا، مقادیر نماینده‌اند و نسبت ایزوتوپی لیتیم در نمونه‌های طبیعی مختلف می‌تواند کمی تفاوت داشته باشد.

منابع: [CIAAW – Lithium Isotopes](https://ciaaw.org/lithium.htm) و [National Isotope Development Center](https://isotopes.gov/products/lithium).

## ۸. منشأ کیهانی لیتیم

### ۸.۱. تشکیل لیتیم در مهبانگ

لیتیم یکی از سه عنصر سبکی است که بخشی از هسته‌های آن در مراحل آغازین جهان و در جریان هسته‌زایی مهبانگ تشکیل شد.

در دقایق نخست پس از مهبانگ، جهان بسیار داغ و چگال بود. در این شرایط، واکنش‌های هسته‌ای توانستند هسته‌های سبک را به وجود آورند.

عناصر اصلی حاصل از این دوره شامل هیدروژن و هلیوم و مقدار بسیار کمتری از لیتیم بودند.

بااین‌حال، مقدار لیتیم تولیدشده در مهبانگ نسبت به هیدروژن و هلیوم بسیار اندک بود.

### ۸.۲. تولید لیتیم در پرتوهای کیهانی

یکی از مسیرهای مهم تشکیل لیتیم، فرایندی به نام فروپاشی هسته‌ای بر اثر برخورد پرتوهای کیهانی (Cosmic-Ray Spallation) است.

در این فرایند، ذرات پرانرژی کیهانی با هسته‌های سنگین‌تر، مانند کربن و اکسیژن، برخورد می‌کنند. برخورد می‌تواند باعث شکستن هستهٔ اولیه و تشکیل هسته‌های سبک‌تری مانند لیتیم، بریلیم و بور شود.

این فرایند به‌ویژه در توضیح منشأ لیتیم-۶ اهمیت دارد.

### ۸.۳. تولید در ستارگان

برخی ستارگان نیز در مراحل خاصی از تحول خود می‌توانند لیتیم تولید و به محیط میان‌ستاره‌ای منتشر کنند.

از جمله منابع مورد بررسی عبارت‌اند از:

- ستارگان در مرحلهٔ شاخهٔ مجانبی غول‌ها؛
- نواخترها؛
- برخی فرایندهای مرتبط با انفجارهای ستاره‌ای.

در مقابل، لیتیم می‌تواند درون ستارگان و در شرایط دمایی مناسب از بین برود؛ بنابراین فراوانی آن در محیط‌های ستاره‌ای به تعادل میان فرایندهای تولید، تخریب و انتقال وابسته است.

### ۸.۴. مسئلهٔ لیتیم در کیهان‌شناسی

یکی از مسائل جالب اخترفیزیک، اختلاف میان مقدار لیتیم-۷ پیش‌بینی‌شده بر اساس مدل استاندارد هسته‌زایی مهبانگ و مقدار اندازه‌گیری‌شده در برخی ستارگان بسیار قدیمی است.

این اختلاف با عنوان «مسئلهٔ لیتیم کیهانی» (Cosmological Lithium Problem) شناخته می‌شود.

دانشمندان هنوز در حال بررسی توضیحات احتمالی آن هستند؛ از جمله فرایندهای تخریب لیتیم در ستارگان، مدل‌های تحول ستاره‌ای و احتمال وجود فیزیک جدید در جهان اولیه.

منابع: [NASA – The Origin of the Elements](https://imagine.gsfc.nasa.gov/science/questions/composition.html) و [NASA – Cosmic Ray Collisions and Lithium](https://imagine.gsfc.nasa.gov/educators/elements/imagine/07.html).

## ۹. لیتیم در زمین و طبیعت

### ۹.۱. فراوانی در پوستهٔ زمین

لیتیم در پوستهٔ زمین به مقدار نسبتاً کم و به‌صورت پراکنده وجود دارد. این عنصر در بسیاری از سنگ‌های آذرین و برخی محلول‌های طبیعی یافت می‌شود.

لیتیم آزاد و فلزی در طبیعت پایدار نیست؛ زیرا به‌سرعت با مواد محیط واکنش می‌دهد. بنابراین، منابع طبیعی آن عمدتاً ترکیبات معدنی و محلول‌های شور هستند.

### ۹.۲. کانی‌های لیتیم‌دار

مهم‌ترین کانی‌های دارای لیتیم عبارت‌اند از:

**اسپودومن (Spodumene):**

فرمول شیمیایی:

$$\\mathrm{LiAlSi_2O_6}$$

اسپودومن یکی از مهم‌ترین کانی‌های تجاری لیتیم است و در پگماتیت‌های گرانیتی یافت می‌شود.

**پتالیت (Petalite):**

فرمول شیمیایی:

$$\\mathrm{LiAlSi_4O_{10}}$$

این کانی از نخستین منابعی بود که وجود لیتیم در آن شناسایی شد.

**لپیدولیت (Lepidolite):**

لپیدولیت نوعی کانی میکایی لیتیم‌دار است و معمولاً همراه با عناصر دیگری مانند پتاسیم و آلومینیوم حضور دارد. ترکیب دقیق آن می‌تواند متغیر باشد.

**آمبلیگونیت (Amblygonite):**

این کانی یک فسفات لیتیم و آلومینیوم است و می‌تواند در برخی ذخایر معدنی منبع لیتیم باشد.

### ۹.۳. شورابه‌های لیتیم‌دار

یکی دیگر از منابع مهم لیتیم، شورابه‌های طبیعی هستند. این شورابه‌ها محلول‌های بسیار غلیظی از نمک‌های محلول در آب‌اند که می‌توانند در حوضه‌های بسته و مناطق خشک یافت شوند.

برخی از بزرگ‌ترین منابع شورابه‌ای لیتیم در بخش‌هایی از آمریکای جنوبی، به‌ویژه در منطقهٔ آند، قرار دارند.

### ۹.۴. منابع دیگر

علاوه بر سنگ‌های پگماتیتی و شورابه‌ها، لیتیم می‌تواند در منابع دیگری نیز وجود داشته باشد:

- برخی رس‌های لیتیم‌دار؛
- شورابه‌های میدان‌های نفتی؛
- شورابه‌های زمین‌گرمایی؛
- برخی آب‌های زیرزمینی غنی از نمک.

وجود لیتیم در یک منبع طبیعی لزوماً به معنای اقتصادی‌بودن استخراج آن نیست. غلظت لیتیم، ترکیب سایر یون‌ها، شرایط زمین‌شناسی، هزینهٔ فرآوری و دسترسی به آب و انرژی در امکان بهره‌برداری نقش دارند.

منابع: [USGS – Lithium Deposits in the United States](https://www.usgs.gov/data/lithium-deposits-united-states) و [Royal Society of Chemistry](https://periodic-table.rsc.org/element/3/lithium).

## ۱۰. روش‌های استخراج و تولید صنعتی لیتیم

لیتیم برای استفاده در صنعت معمولاً ابتدا از منابع طبیعی جدا شده و به ترکیبات خالص‌تر مانند کربنات لیتیم یا هیدروکسید لیتیم تبدیل می‌شود.

دو مسیر اصلی تأمین لیتیم عبارت‌اند از استخراج از سنگ معدن و جداسازی از شورابه‌ها.

### ۱۰.۱. استخراج از سنگ معدن

در این روش، کانی‌های لیتیم‌دار، به‌ویژه اسپودومن، از ذخایر معدنی استخراج می‌شوند.

پس از استخراج، سنگ معدن باید فرآوری شود تا کانی موردنظر از سایر مواد جدا و غلیظ‌تر شود. سپس فرآیندهای صنعتی و شیمیایی برای تبدیل لیتیم موجود در کانی به ترکیبات قابل‌استفاده انجام می‌گیرند.

محصولات اصلی این زنجیره می‌توانند شامل کربنات لیتیم و هیدروکسید لیتیم باشند.

### ۱۰.۲. استخراج از شورابه‌ها

در این روش، شورابهٔ غنی از یون لیتیم از مخازن زیرزمینی به سطح منتقل می‌شود.

روش سنتی در برخی مناطق شامل تمرکز محلول از طریق تبخیر در حوضچه‌های بزرگ و سپس جداسازی و خالص‌سازی ترکیبات لیتیم است.

این فناوری به شرایط آب‌وهوایی، ترکیب شورابه و نسبت یون‌هایی مانند منیزیم به لیتیم وابسته است.

### ۱۰.۳. استخراج مستقیم لیتیم (Direct Lithium Extraction)

استخراج مستقیم لیتیم یا DLE مجموعه‌ای از فناوری‌های جدیدتر است که هدف آن جداسازی انتخابی یون لیتیم از شورابه، بدون اتکای کامل به تبخیر طولانی‌مدت در حوضچه‌هاست.

در برخی از این روش‌ها از جاذب‌ها، غشاها یا فرایندهای تبادل یونی استفاده می‌شود.

این فناوری‌ها می‌توانند زمان فرآوری را کاهش دهند؛ اما لزوماً بدون اثر زیست‌محیطی نیستند. مصرف آب شیرین، مواد شیمیایی، انرژی و مدیریت شورابهٔ باقی‌مانده از جمله موضوعاتی هستند که باید در ارزیابی آن‌ها لحاظ شوند.

### ۱۰.۴. تولید لیتیم فلزی

لیتیم فلزی را می‌توان از طریق الکترولیز نمک‌های مذاب حاوی لیتیم تولید کرد.

در روش صنعتی متداول، از مخلوطی از لیتیم کلرید و پتاسیم کلرید مذاب استفاده می‌شود. این فرایند به تجهیزات و شرایط صنعتی ویژه نیاز دارد.

نکتهٔ مهم آن است که محصول موردنیاز بسیاری از صنایع باتری، ترکیباتی مانند کربنات لیتیم و هیدروکسید لیتیم است؛ بنابراین همهٔ لیتیم استخراج‌شده الزاماً به فلز خالص تبدیل نمی‌شود.

---

## ۱۱. مهم‌ترین ترکیبات لیتیم

لیتیم ترکیبات شیمیایی گوناگونی تشکیل می‌دهد که بسیاری از آن‌ها از نظر صنعتی اهمیت دارند.

| ترکیب | فرمول شیمیایی | کاربرد یا ویژگی |
|---|---|---|
| لیتیم اکسید | $\\mathrm{Li_2O}$ | تولید شیشه و سرامیک |
| لیتیم هیدروکسید | $\\mathrm{LiOH}$ | تولید مواد باتری و کاربردهای شیمیایی |
| لیتیم کربنات | $\\mathrm{Li_2CO_3}$ | تولید ترکیبات لیتیم و کاربرد پزشکی |
| لیتیم کلرید | $\\mathrm{LiCl}$ | فرایندهای شیمیایی و سامانه‌های جذب رطوبت |
| لیتیم برومید | $\\mathrm{LiBr}$ | سامانه‌های سرمایش جذبی |
| لیتیم نیترید | $\\mathrm{Li_3N}$ | ترکیب معدنی دارای لیتیم و نیتروژن |
| لیتیم هیدرید | $\\mathrm{LiH}$ | ترکیب یونی و مادهٔ مورد مطالعه در ذخیره‌سازی هیدروژن |
| لیتیم فلورید | $\\mathrm{LiF}$ | مواد نوری و برخی کاربردهای ویژه |

### ۱۱.۱. کربنات لیتیم

کربنات لیتیم یکی از مهم‌ترین محصولات تجاری لیتیم است.

فرمول شیمیایی آن:

$$\\mathrm{Li_2CO_3}$$

این ترکیب در تولید مواد اولیهٔ باتری، شیشه و سرامیک و همچنین برخی کاربردهای دارویی استفاده می‌شود.

### ۱۱.۲. هیدروکسید لیتیم

هیدروکسید لیتیم با فرمول $\\mathrm{LiOH}$ شناخته می‌شود و در تولید برخی مواد کاتدی باتری‌های لیتیم‌یونی و دیگر فرایندهای شیمیایی اهمیت دارد.

### ۱۱.۳. لیتیم استئارات

لیتیم استئارات یکی از ترکیبات مهم لیتیم در صنعت روان‌کارها است.

این ماده در تولید گریس‌های صنعتی کاربرد دارد و به حفظ ویژگی‌های روان‌کاری در گستره‌ای از دماها کمک می‌کند.

---

## ۱۲. باتری‌های لیتیم‌یونی

یکی از مهم‌ترین کاربردهای لیتیم در جهان امروز، تولید باتری‌های قابل‌شارژ است.

باتری‌های لیتیم‌یونی در تلفن‌های همراه، لپ‌تاپ‌ها، دوربین‌ها، خودروهای برقی، ابزارهای الکتریکی و سامانه‌های ذخیره‌سازی انرژی مورد استفاده قرار می‌گیرند.

### ۱۲.۱. اجزای اصلی باتری لیتیم‌یونی

یک سلول باتری لیتیم‌یونی معمولاً از چهار بخش اصلی تشکیل شده است:

**۱. آند (Anode):**

الکترودی که در بسیاری از باتری‌های متداول از گرافیت ساخته می‌شود و در هنگام شارژ، یون‌های لیتیم را در ساختار خود جای می‌دهد.

**۲. کاتد (Cathode):**

الکترود مقابل آند که معمولاً از ترکیبات حاوی لیتیم و فلزات دیگر، مانند اکسیدهای فلزی یا فسفات آهن لیتیم، ساخته می‌شود.

**۳. الکترولیت (Electrolyte):**

محیطی که امکان حرکت یون‌های لیتیم میان دو الکترود را فراهم می‌کند.

**۴. جداکننده (Separator):**

لایه‌ای که از تماس مستقیم الکترودها جلوگیری می‌کند، اما امکان عبور یون‌ها از میان خود را فراهم می‌سازد.

### ۱۲.۲. سازوکار عملکرد باتری

باتری لیتیم‌یونی بر اساس جابه‌جایی برگشت‌پذیر یون‌های لیتیم میان دو الکترود عمل می‌کند.

هنگام تخلیهٔ باتری، یون‌های لیتیم معمولاً از آند به سمت کاتد حرکت می‌کنند. هم‌زمان، الکترون‌ها از مسیر مدار خارجی عبور می‌کنند و جریان الکتریکی ایجاد می‌شود.

هنگام شارژ، جهت حرکت یون‌های لیتیم در سلول برعکس می‌شود و آن‌ها دوباره در ساختار آند جای می‌گیرند.

به این ترتیب، انرژی الکتریکی در قالب تغییرات انرژی شیمیایی ذخیره و آزاد می‌شود.

### ۱۲.۳. نقش یون لیتیم

یون لیتیم با نماد $\\mathrm{Li^+}$ درون الکترولیت حرکت می‌کند. این یون به دلیل اندازهٔ کوچک و جرم کم، برای انتقال بار در ساختار باتری مناسب است.

در بسیاری از باتری‌های لیتیم‌یونی، لیتیم فلزی به شکل توده‌ای از آند وجود ندارد؛ بلکه یون‌های لیتیم بین مواد الکترودی جابه‌جا می‌شوند.

برای نمونه، در آند گرافیتی می‌توان به‌طور ساده حضور لیتیم را با ترکیبی مانند $\\mathrm{LiC_6}$ نمایش داد.

در هنگام تخلیه، واکنش ایدئال‌شدهٔ آند می‌تواند به شکل زیر نوشته شود:

$$\\mathrm{LiC_6 \\rightarrow C_6 + Li^+ + e^-}$$

واکنش دقیق کاتد به نوع شیمی باتری وابسته است؛ بنابراین یک معادلهٔ کلی واحد برای تمام باتری‌های لیتیم‌یونی وجود ندارد.

### ۱۲.۴. انواع مهم باتری‌های لیتیم‌یونی

باتری‌های لیتیم‌یونی بر اساس ترکیب مواد الکترودی انواع مختلفی دارند. چند نمونهٔ مهم عبارت‌اند از:

- **LCO:** اکسید لیتیم کبالت؛ رایج در برخی تجهیزات الکترونیکی قابل‌حمل.
- **NMC:** ترکیبات اکسیدی لیتیم، نیکل، منگنز و کبالت؛ مورد استفاده در برخی خودروهای برقی.
- **NCA:** ترکیبات اکسیدی لیتیم، نیکل، کبالت و آلومینیوم.
- **LFP:** فسفات آهن لیتیم؛ دارای ویژگی‌های مناسب از نظر دوام و پایداری حرارتی در بسیاری از کاربردها.
- **LMO:** اکسید لیتیم منگنز؛ یکی دیگر از شیمی‌های مورد استفاده در باتری‌ها.

هر یک از این فناوری‌ها از نظر چگالی انرژی، هزینه، طول عمر، پایداری حرارتی و مواد اولیه تفاوت دارند.

### ۱۲.۵. مزایای باتری‌های لیتیم‌یونی

۱. چگالی انرژی نسبتاً زیاد؛

۲. جرم کم در مقایسه با بسیاری از باتری‌های قدیمی؛

۳. امکان شارژ و تخلیهٔ مکرر؛

۴. کاربرد در طیف گسترده‌ای از تجهیزات؛

۵. قابلیت توسعه در اندازه‌ها و ظرفیت‌های گوناگون.

### ۱۲.۶. محدودیت‌ها و چالش‌ها

۱. کاهش ظرفیت در اثر گذر زمان و چرخه‌های شارژ و تخلیه؛

۲. حساسیت برخی شیمی‌های باتری به دما و شرایط کاری؛

۳. نیاز به سامانه‌های مدیریت باتری؛

۴. خطر آتش‌سوزی در شرایط خرابی یا فرار حرارتی؛

۵. نیاز به استخراج و فرآوری مواد اولیه؛

۶. ضرورت توسعهٔ زیرساخت‌های بازیافت.

منابع: [Argonne National Laboratory – Lithium-Ion Batteries](https://www.anl.gov/) و [U.S. Department of Energy – Batteries](https://www.energy.gov/science/doe-explainsbatteries).

## ۱۳. سایر کاربردهای لیتیم

اگرچه باتری‌ها مهم‌ترین کاربرد کنونی لیتیم هستند، این عنصر و ترکیبات آن در صنایع دیگری نیز نقش دارند.

### ۱۳.۱. صنعت شیشه و سرامیک

اکسید لیتیم در تولید برخی شیشه‌ها و سرامیک‌های ویژه به کار می‌رود.

افزودن ترکیبات لیتیم می‌تواند خواصی مانند ضریب انبساط حرارتی، رفتار ذوب و ویژگی‌های فیزیکی برخی مواد را تغییر دهد.

این کاربرد در ساخت شیشه‌های مقاوم به تغییرات دما و برخی سرامیک‌های مهندسی اهمیت دارد.

### ۱۳.۲. صنایع هوافضا

لیتیم در برخی آلیاژهای آلومینیوم و منیزیم به کار می‌رود.

افزودن لیتیم می‌تواند چگالی آلیاژ را کاهش دهد و در بعضی ترکیب‌ها، ویژگی‌های مکانیکی مطلوبی ایجاد کند.

این ویژگی برای طراحی سازه‌های سبک در صنعت هوافضا اهمیت دارد؛ زیرا کاهش جرم سازه می‌تواند به بهبود عملکرد و کاهش مصرف انرژی کمک کند.

### ۱۳.۳. تولید روان‌کارها

گریس‌های لیتیمی در خودروها، ماشین‌آلات صنعتی و تجهیزات مکانیکی کاربرد گسترده‌ای دارند.

این گریس‌ها معمولاً به دلیل پایداری مناسب و عملکرد در گسترهٔ دمایی نسبتاً وسیع مورد استفاده قرار می‌گیرند.

### ۱۳.۴. سامانه‌های تهویه و کنترل رطوبت

برخی ترکیبات لیتیم مانند لیتیم کلرید و لیتیم برومید، به دلیل توانایی جذب رطوبت یا جذب بخار آب، در سامانه‌های صنعتی کنترل رطوبت و برخی چرخه‌های سرمایش جذبی کاربرد دارند.

### ۱۳.۵. صنایع پزشکی

برخی نمک‌های لیتیم، به‌ویژه کربنات لیتیم، در پزشکی برای درمان اختلال دوقطبی به کار می‌روند.

لیتیم در این کاربرد به‌عنوان یک داروی تثبیت‌کنندهٔ خلق شناخته می‌شود. بااین‌حال، سازوکار دقیق اثرگذاری آن بر دستگاه عصبی هنوز به‌طور کامل شناخته نشده است.

غلظت لیتیم در خون باید در درمان پزشکی به‌دقت پایش شود؛ زیرا فاصلهٔ میان غلظت درمانی و غلظت سمی آن می‌تواند کم باشد. بنابراین این ترکیبات فقط باید در چارچوب مراقبت پزشکی تخصصی استفاده شوند.

### ۱۳.۶. سامانه‌های هسته‌ای و پژوهش‌های نوین

ایزوتوپ‌های لیتیم، به‌ویژه لیتیم-۶ و لیتیم-۷، در برخی پژوهش‌های فیزیک هسته‌ای و فناوری‌های مرتبط با انرژی هسته‌ای اهمیت دارند.

برای مثال، برهم‌کنش هستهٔ لیتیم-۶ با نوترون‌ها در مطالعات هسته‌ای و برخی فناوری‌های همجوشی مورد توجه قرار می‌گیرد.

## ۱۴. نقش لیتیم در زیست‌شناسی و پزشکی

### ۱۴.۱. آیا لیتیم یک عنصر ضروری برای بدن است؟

برخلاف عناصری مانند کربن، اکسیژن، هیدروژن، نیتروژن، کلسیم و آهن، هنوز نقش زیستی ضروری و قطعی برای لیتیم در بدن انسان مشخص نشده است.

مقادیر بسیار اندکی از لیتیم می‌تواند در آب، خاک، مواد غذایی و بافت‌های زیستی وجود داشته باشد؛ اما حضور طبیعی یک عنصر در بدن الزاماً به معنای ضروری‌بودن آن برای فعالیت‌های زیستی نیست.

### ۱۴.۲. کاربرد دارویی لیتیم

برخی ترکیبات لیتیم در پزشکی برای کنترل و درمان اختلال دوقطبی استفاده می‌شوند.

لیتیم می‌تواند بر سامانه‌های پیام‌رسانی درون‌سلولی و برخی فرایندهای عصبی اثر بگذارد؛ اما سازوکار دقیق اثر درمانی آن پیچیده است و هنوز تمام جزئیات آن مشخص نشده‌اند.

### ۱۴.۳. سمیت لیتیم

لیتیم در مقدار و شرایط نامناسب می‌تواند سمی باشد. سمیت آن به نوع ترکیب، مقدار مواجهه، غلظت در بدن و وضعیت سلامت فرد وابسته است.

به همین دلیل، مصرف دارویی لیتیم مستلزم نظارت پزشکی و پایش منظم آزمایشگاهی است.

منابع: [DailyMed – Lithium Carbonate Prescribing Information](https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=803eab29-0d0a-4df0-b504-bcd85ec01ead) و [Royal Society of Chemistry](https://periodic-table.rsc.org/element/3/lithium).

## ۱۵. اهمیت اقتصادی و آیندهٔ لیتیم

لیتیم در سال‌های اخیر به یکی از مواد معدنی راهبردی در اقتصاد جهانی تبدیل شده است.

افزایش استفاده از خودروهای برقی، گسترش سامانه‌های ذخیره‌سازی انرژی و توسعهٔ تجهیزات الکترونیکی، تقاضا برای ترکیبات لیتیم را افزایش داده‌اند.

### ۱۵.۱. اهمیت در گذار انرژی

باتری‌های لیتیم‌یونی در ذخیره‌سازی انرژی الکتریکی نقش مهمی دارند. این باتری‌ها می‌توانند در خودروهای برقی و سامانه‌های ذخیره‌سازی متصل به شبکهٔ برق مورد استفاده قرار گیرند.

در سامانه‌های انرژی خورشیدی و بادی، تولید برق ممکن است با زمان مصرف آن هم‌زمان نباشد. ذخیره‌سازی انرژی در باتری‌ها می‌تواند به متعادل‌کردن این اختلاف زمانی کمک کند.

### ۱۵.۲. وضعیت تقاضای جهانی

بر اساس گزارش سال ۲۰۲۶ آژانس بین‌المللی انرژی (IEA)، در سناریوی سیاست‌های اعلام‌شده، تقاضای لیتیم در سال ۲۰۴۰ حدود ۳٫۵ برابر مقدار آن در سال ۲۰۲۵ برآورد شده است.

این سناریو پیش‌بینی قطعی آینده نیست؛ بلکه نتیجهٔ مدلی است که بر اساس فرض‌های مشخص دربارهٔ سیاست‌های انرژی، فناوری و رشد بازار ساخته شده است.

### ۱۵.۳. نقش بازیافت

با افزایش تعداد باتری‌های تولیدشده، حجم باتری‌های پایان‌عمر نیز در آینده افزایش خواهد یافت.

بازیافت باتری‌ها می‌تواند بخشی از لیتیم، نیکل، کبالت و دیگر مواد ارزشمند را دوباره وارد چرخهٔ تولید کند.

آژانس بین‌المللی انرژی در گزارش ۲۰۲۶ خود افزایش چشمگیر تولید ثانویهٔ لیتیم از بازیافت را در دهه‌های آینده پیش‌بینی می‌کند. این روند می‌تواند بخشی از فشار بر استخراج منابع اولیه را کاهش دهد.

### ۱۵.۴. چالش‌های زنجیرهٔ تأمین

تولید لیتیم تنها به وجود ذخایر زمین‌شناختی وابسته نیست. فرآوری، تولید مواد باتری، زیرساخت‌های حمل‌ونقل، فناوری بازیافت و دسترسی به تجهیزات صنعتی نیز در زنجیرهٔ تأمین نقش دارند.

تمرکز تولید و فرآوری در تعداد محدودی از کشورها می‌تواند زنجیرهٔ تأمین را در برابر اختلال‌های اقتصادی و سیاسی آسیب‌پذیر کند.

منابع: [IEA – Global Critical Minerals Outlook 2026](https://www.iea.org/reports/global-critical-minerals-outlook-2026) و [USGS – Mineral Commodity Summaries 2026](https://pubs.usgs.gov/publication/mcs2026).

## ۱۶. پیامدهای زیست‌محیطی استخراج لیتیم

استخراج لیتیم، با وجود نقش آن در توسعهٔ فناوری‌های ذخیره‌سازی انرژی، می‌تواند پیامدهای زیست‌محیطی مختلفی داشته باشد.

### ۱۶.۱. مصرف آب

در برخی روش‌های استخراج لیتیم از شورابه‌ها، مقدار زیادی آب از سامانه‌های طبیعی منطقه خارج می‌شود یا طی فرایندهای تبخیر از دست می‌رود.

این موضوع در مناطق خشک و نیمه‌خشک اهمیت زیادی دارد؛ زیرا منابع آب شیرین در این مناطق محدودند.

بااین‌حال، میزان اثرگذاری استخراج بر منابع آب در هر منطقه به شرایط زمین‌شناسی، ساختار آبخوان‌ها، میزان بارش، نوع استخراج و مدیریت منابع وابسته است.

### ۱۶.۲. تغییرات زیست‌بوم

استخراج مواد معدنی می‌تواند موجب تغییر کاربری زمین، ایجاد پسماند، تخریب زیستگاه‌ها و تغییر در شرایط طبیعی محیط شود.

این مسئله در مناطقی که زیست‌بوم‌های حساس دارند اهمیت بیشتری پیدا می‌کند.

### ۱۶.۳. مصرف انرژی و تولید پسماند

فرآوری سنگ‌های لیتیم‌دار ممکن است به انرژی زیادی نیاز داشته باشد. همچنین برخی فرایندهای شیمیایی، پسماندهای جامد و مایع تولید می‌کنند که باید به‌درستی مدیریت شوند.

### ۱۶.۴. آیا استخراج مستقیم لیتیم کاملاً پاک است؟

فناوری استخراج مستقیم لیتیم یا DLE با هدف کاهش برخی محدودیت‌های روش‌های سنتی توسعه یافته است.

بااین‌حال، پژوهش‌های منتشرشده نشان می‌دهند که این فناوری‌ها نیز می‌توانند به آب شیرین، انرژی و مواد شیمیایی نیاز داشته باشند و شورابهٔ مصرف‌شده تولید کنند.

بنابراین، مقایسهٔ زیست‌محیطی روش‌ها باید بر اساس تمام مراحل فرایند، از استخراج اولیه تا تولید محصول نهایی، انجام شود.

### ۱۶.۵. بازیافت به‌عنوان راهکار

بازیافت باتری‌های لیتیم‌یونی می‌تواند نیاز به استخراج مواد اولیه را کاهش دهد و از اتلاف مواد ارزشمند جلوگیری کند.

بااین‌حال، بازیافت نیز نیازمند انرژی، تجهیزات، مدیریت پسماند و فناوری‌های مناسب است.

در نتیجه، راهکار پایدار تنها افزایش استخراج یا تنها بازیافت نیست؛ بلکه ترکیبی از طراحی مناسب باتری، افزایش طول عمر، جمع‌آوری صحیح، بازیافت مؤثر و مدیریت مسئولانهٔ معادن است.

منابع: [Nature Reviews Earth & Environment – Environmental Impact of Direct Lithium Extraction](https://www.nature.com/articles/s43017-022-00387-5) و [Nature Communications – Future Water Constraints on Lithium Mining (2026)](https://www.nature.com/articles/s43247-026-03643-4).

## ۱۷. ایمنی و خطرهای لیتیم

لیتیم فلزی ماده‌ای واکنش‌پذیر است و تماس آن با برخی مواد، به‌ویژه آب و رطوبت، می‌تواند واکنش‌های شیمیایی گرمازا ایجاد کند.

مهم‌ترین نکات ایمنی مرتبط با لیتیم عبارت‌اند از:

۱. لیتیم فلزی می‌تواند با آب واکنش دهد و هیدروژن و لیتیم هیدروکسید تولید کند.

۲. لیتیم هیدروکسید خاصیت خورندگی دارد و می‌تواند به بافت‌های بدن آسیب برساند.

۳. برخی ترکیبات لیتیم دارای خطرهای شیمیایی و سمیت خاص خود هستند؛ بنابراین نمی‌توان ایمنی تمام ترکیبات لیتیم را یکسان در نظر گرفت.

۴. باتری‌های لیتیم‌یونی در صورت آسیب فیزیکی، نقص داخلی یا شرایط نامناسب ممکن است دچار فرار حرارتی (Thermal Runaway) شوند.

۵. باتری‌های آسیب‌دیده می‌توانند خطر آتش‌سوزی یا آزادشدن مواد زیان‌آور ایجاد کنند.

به همین دلیل، لیتیم فلزی و ترکیبات صنعتی آن باید فقط در چارچوب ضوابط ایمنی و تجهیزات مناسب صنعتی یا آزمایشگاهی مورد استفاده قرار گیرند. باتری‌ها نیز نباید باز یا دست‌کاری شوند و باید مطابق دستورالعمل‌های ایمنی و بازیافت مدیریت شوند.

---

## ۱۸. حقایق علمی جالب دربارهٔ لیتیم

۱. لیتیم سومین عنصر جدول تناوبی است و پس از هیدروژن و هلیوم قرار دارد.

۲. لیتیم سبک‌ترین فلز جدول تناوبی است.

۳. نام لیتیم از واژهٔ یونانی *Lithos* به معنای سنگ گرفته شده است.

۴. لیتیم در طبیعت به شکل فلز آزاد یافت نمی‌شود و عمدتاً در کانی‌ها و شورابه‌ها حضور دارد.

۵. دو ایزوتوپ پایدار طبیعی لیتیم، لیتیم-۶ و لیتیم-۷ هستند.

۶. لیتیم-۷ بسیار فراوان‌تر از لیتیم-۶ است و معمولاً بیش از ۹۰ درصد لیتیم طبیعی را تشکیل می‌دهد.

۷. لیتیم یکی از سه عنصر سبکی است که بخشی از هسته‌های آن در نخستین مراحل تاریخ کیهان شکل گرفتند.

۸. برخلاف هیدروژن و هلیوم، لیتیم در جهان فراوانی بسیار کمتری دارد؛ زیرا تولید کیهانی آن محدود بوده و در ستارگان نیز می‌تواند تخریب شود.

۹. لیتیم در آزمون شعله رنگ قرمز کارمینی ایجاد می‌کند.

۱۰. یون $\\mathrm{Li^+}$ به دلیل اندازهٔ کوچک خود، چگالی بار نسبتاً زیادی دارد و بر ویژگی‌های ترکیبات آن اثر می‌گذارد.

۱۱. باتری‌های لیتیم‌یونی معمولاً از حرکت یون‌های لیتیم میان دو الکترود استفاده می‌کنند، نه از مصرف مستقیم لیتیم به‌عنوان سوخت.

۱۲. با وجود اهمیت لیتیم در فناوری باتری، بخش بزرگی از پژوهش‌های آینده بر بازیافت و کاهش وابستگی به استخراج مواد اولیه متمرکز است.

---

## ۱۹. نتیجه‌گیری

لیتیم یکی از عناصر مهم و تأثیرگذار در شیمی، فیزیک، زمین‌شناسی و فناوری نوین است. ساختار اتمی ساده، جرم کم، چگالی بسیار پایین و تمایل شیمیایی آن به تشکیل یون مثبت، این عنصر را به ماده‌ای منحصربه‌فرد در میان فلزات قلیایی تبدیل کرده است.

از دیدگاه شیمی، لیتیم در تشکیل ترکیبات یونی و مواد صنعتی گوناگون نقش دارد. از دیدگاه فیزیک و اخترفیزیک، ایزوتوپ‌های آن برای بررسی تاریخ اولیهٔ کیهان و واکنش‌های هسته‌ای اهمیت دارند. از دیدگاه زمین‌شناسی، لیتیم در کانی‌های پگماتیتی و شورابه‌های طبیعی یافت می‌شود و استخراج آن به دانش معدن‌کاری، ژئوشیمی و مهندسی شیمی وابسته است.

بااین‌حال، اهمیت امروزی لیتیم بیش از هر چیز به نقش آن در باتری‌های قابل‌شارژ و ذخیره‌سازی انرژی مربوط می‌شود. باتری‌های لیتیم‌یونی به توسعهٔ تجهیزات الکترونیکی، خودروهای برقی و سامانه‌های ذخیره‌سازی برق کمک کرده‌اند.

افزایش تقاضا برای لیتیم، در کنار محدودیت منابع و پیامدهای زیست‌محیطی استخراج، ضرورت توسعهٔ فناوری‌های جدید، بازیافت مؤثر و مدیریت پایدار منابع را افزایش داده است.

در مجموع، لیتیم نمونه‌ای روشن از پیوند میان علوم پایه و فناوری‌های پیشرفته است؛ عنصری که از نخستین مراحل تحول کیهان تا یکی از مهم‌ترین فناوری‌های انرژی جهان امروز، نقش علمی و صنعتی قابل‌توجهی ایفا می‌کند.

## چکیده

بریلیوم با نماد شیمیایی $\\mathrm{Be}$ و عدد اتمی ۴، چهارمین عنصر جدول تناوبی و یکی از سبک‌ترین فلزات شناخته‌شده است. این عنصر در گروه دوم و دورهٔ دوم جدول تناوبی قرار دارد و به فلزات قلیایی خاکی تعلق دارد. اتم خنثی بریلیوم دارای چهار پروتون و چهار الکترون است و آرایش الکترونی آن به‌صورت $1s^2 2s^2$ نوشته می‌شود. بریلیوم در واکنش‌های شیمیایی معمولاً دو الکترون ظرفیت خود را از دست می‌دهد و یون دوظرفیتی $\\mathrm{Be^{2+}}$ تشکیل می‌دهد.

بریلیوم فلزی خاکستری متمایل به سفید، سبک، سخت و شکننده است که در مقایسه با بسیاری از فلزات، نسبت استحکام و سختی به جرم بسیار مطلوبی دارد. همچنین نقطهٔ ذوب بالا، پایداری ابعادی در گسترهٔ دمایی وسیع، شفافیت نسبی در برابر پرتوهای ایکس و ویژگی‌های نوترونی خاص، آن را به ماده‌ای ارزشمند در صنایع هوافضا، الکترونیک، تجهیزات پزشکی و فناوری هسته‌ای تبدیل کرده‌اند.

این عنصر در طبیعت به شکل آزاد یافت نمی‌شود و عمدتاً در کانی‌هایی مانند بریل و برتراندیت حضور دارد. بریل افزون بر اهمیت صنعتی، از نظر گوهرشناسی نیز ارزشمند است؛ زیرا سنگ‌های قیمتی زمرد و آکوامارین از گونه‌های شناخته‌شدهٔ آن هستند.

با وجود کاربردهای فناورانهٔ فراوان، بریلیوم و بسیاری از ترکیبات آن بسیار سمی‌اند. استنشاق ذرات و گردوغبار آن می‌تواند موجب حساس‌شدن دستگاه ایمنی و ابتلا به بیماری مزمن بریلیوم شود. همچنین بریلیوم و ترکیبات آن در گروه مواد سرطان‌زای انسانی قرار گرفته‌اند. به همین دلیل، کاربرد صنعتی این عنصر مستلزم کنترل دقیق مواجهه و رعایت استانداردهای ایمنی است.

**واژگان کلیدی:** بریلیوم، فلزات قلیایی خاکی، ساختار اتمی، ایزوتوپ، بریل، برتراندیت، آلیاژ بریلیوم-مس، پرتو ایکس، فیزیک هسته‌ای، سمیت بریلیوم.

## ۱. معرفی و مشخصات عمومی

بریلیوم چهارمین عنصر جدول تناوبی است و پس از هیدروژن، هلیوم و لیتیم قرار می‌گیرد. نماد شیمیایی آن $\\mathrm{Be}$ و عدد اتمی آن ۴ است.

نام Beryllium از واژهٔ یونانی *Beryllos* گرفته شده است که به کانی بریل اشاره دارد؛ کانی‌ای که بریلیوم نخستین بار از بررسی ترکیب آن شناسایی شد.

بریلیوم در شرایط معمول، فلزی جامد با رنگ خاکستری متمایل به سفید است. این عنصر چگالی نسبتاً کمی دارد، اما سختی، صلبیت و پایداری ابعادی قابل‌توجهی از خود نشان می‌دهد. ترکیب این ویژگی‌ها باعث شده است که بریلیوم برای کاربردهایی که کاهش جرم و حفظ استحکام اهمیت دارند، ماده‌ای ارزشمند باشد.

## ۲. تاریخچهٔ کشف بریلیوم

### ۲.۱. شناخت کانی بریل

کانی بریل از دوران باستان شناخته شده بود و به دلیل شفافیت و رنگ‌های زیبای برخی از نمونه‌های آن، در ساخت زیورآلات و اشیای تزئینی استفاده می‌شد.

بااین‌حال، تا اواخر قرن هجدهم مشخص نبود که این کانی حاوی عنصری شیمیایی است که پیش‌تر به‌طور مستقل شناسایی نشده بود.

در سال ۱۷۹۷، رنه ژوست اوی (René Just Haüy)، کانی‌شناس فرانسوی، به شباهت‌های میان خواص کانی بریل و زمرد توجه کرد و این موضوع را برای بررسی شیمیایی بیشتر مطرح کرد.

### ۲.۲. شناسایی عنصر توسط نیکولا لویی ووکلن

در سال ۱۷۹۸، شیمیدان فرانسوی نیکولا لویی ووکلن (Nicolas-Louis Vauquelin) با بررسی ترکیب شیمیایی بریل و زمرد دریافت که این کانی‌ها دارای عنصری ناشناخته هستند.

او موفق شد وجود یک اکسید جدید را در این مواد تشخیص دهد؛ اما در آن زمان هنوز نتوانسته بود فلز خالص را جدا کند.

ووکلن ابتدا نام Glucinium را برای عنصر جدید پیشنهاد کرد. این نام از واژهٔ یونانی *Glykys* به معنای شیرین گرفته شده بود؛ زیرا برخی ترکیبات بریلیوم در آن زمان دارای مزهٔ شیرین توصیف شده بودند. البته امروزه می‌دانیم ترکیبات بریلیوم سمی هستند و به هیچ عنوان نباید چشیده شوند.

نام بریلیوم که از کانی بریل گرفته شده بود، بعدها پذیرفته شد و امروزه نام رسمی این عنصر است.

### ۲.۳. جداسازی فلز بریلیوم

در سال ۱۸۲۸، فریدریش وهلر (Friedrich Wöhler) در آلمان و آنتوان بوسی (Antoine Bussy) در فرانسه، به‌طور مستقل موفق شدند فلز بریلیوم را از ترکیبات آن جدا کنند.

این دستاورد امکان بررسی مستقیم خواص فیزیکی و شیمیایی بریلیوم فلزی را فراهم کرد.

### ۲.۴. نقش بریلیوم در کشف نوترون

یکی از مهم‌ترین اتفاقات علمی مرتبط با بریلیوم در سال ۱۹۳۲ رخ داد.

جیمز چادویک (James Chadwick)، فیزیک‌دان بریتانیایی، در پژوهش‌های خود از تاباندن ذرات آلفا به بریلیوم استفاده کرد. تابش حاصل از این برخوردها ویژگی‌هایی داشت که با پرتوهای الکترومغناطیسی شناخته‌شده سازگار نبود.

چادویک با بررسی نتایج آزمایش‌ها نشان داد که این تابش از ذرات خنثی دارای جرم تقریباً مشابه پروتون تشکیل شده است. این ذرات بعدها نوترون نام گرفتند.

واکنش هسته‌ای اصلی این فرایند را می‌توان به‌صورت زیر نمایش داد:

$$^{9}_{4}\\mathrm{Be} + ^{4}_{2}\\mathrm{He} \\rightarrow ^{12}_{6}\\mathrm{C} + ^{1}_{0}\\mathrm{n}$$

این کشف یکی از نقاط عطف تاریخ فیزیک هسته‌ای بود؛ زیرا وجود نوترون، ساختار هستهٔ اتم را بسیار بهتر توضیح داد و زمینهٔ توسعهٔ نظریه‌ها و فناوری‌های هسته‌ای بعدی را فراهم کرد.

منابع: [RSC – Beryllium History](https://periodic-table.rsc.org/element/4/beryllium) و [PubChem – Beryllium](https://pubchem.ncbi.nlm.nih.gov/element/Beryllium).

## ۳. ساختار اتمی و ویژگی‌های کوانتومی

### ۳.۱. ساختار اتم بریلیوم

عدد اتمی بریلیوم برابر با ۴ است؛ بنابراین هستهٔ تمام اتم‌های آن دارای چهار پروتون است.

در اتم خنثی، چهار الکترون در اطراف هسته قرار دارند. تعداد نوترون‌ها به ایزوتوپ بستگی دارد؛ برای مثال، فراوان‌ترین و تنها ایزوتوپ پایدار طبیعی بریلیوم، بریلیوم-۹، دارای پنج نوترون است.

| ذره | تعداد در اتم بریلیوم-۹ | بار الکتریکی |
|---|---:|---|
| پروتون | ۴ | مثبت |
| نوترون | ۵ | خنثی |
| الکترون | ۴ | منفی |

### ۳.۲. آرایش الکترونی

چهار الکترون اتم بریلیوم در دو زیرلایهٔ نخست قرار می‌گیرند.

دو الکترون نخست در اوربیتال $1s$ و دو الکترون بعدی در اوربیتال $2s$ جای می‌گیرند.

بنابراین آرایش الکترونی بریلیوم به شکل زیر است:

$$1s^2 2s^2$$

نمایش فشردهٔ آن نیز چنین خواهد بود:

$$[\\mathrm{He}]2s^2$$

دو الکترون موجود در زیرلایهٔ $2s$، الکترون‌های ظرفیت بریلیوم هستند و در واکنش‌های شیمیایی این عنصر نقش اصلی را ایفا می‌کنند.

### ۳.۳. تشکیل یون بریلیوم

بریلیوم معمولاً با از دست دادن دو الکترون ظرفیت خود، یون مثبت دوظرفیتی تشکیل می‌دهد:

$$\\mathrm{Be \\rightarrow Be^{2+} + 2e^-}$$

یون حاصل دارای دو الکترون است و آرایش الکترونی آن با آرایش الکترونی هلیوم برابر می‌شود:

$$\\mathrm{Be^{2+}}: 1s^2$$

به همین دلیل، بریلیوم در بیشتر ترکیبات شیمیایی خود عدد اکسایش $+2$ دارد.

### ۳.۴. انرژی یونش

انرژی یونش نخست بریلیوم، انرژی موردنیاز برای جداکردن اولین الکترون از اتم خنثی آن است.

مقدار این انرژی تقریباً برابر با $9.3227\\ \\mathrm{eV}$ است.

$$\\mathrm{Be \\rightarrow Be^+ + e^-}$$

انرژی یونش دوم نیز برای جداکردن دومین الکترون لازم است و مقدار آن تقریباً برابر با $18.211\\ \\mathrm{eV}$ است.

افزایش انرژی یونش در مراحل بعدی به دلیل افزایش جاذبهٔ مؤثر هسته بر الکترون‌های باقی‌مانده رخ می‌دهد.

### ۳.۵. اندازهٔ کوچک یون بریلیوم

یون $\\mathrm{Be^{2+}}$ اندازهٔ بسیار کوچکی دارد و بار مثبت آن در حجم کوچکی متمرکز شده است.

در نتیجه، چگالی بار الکتریکی آن زیاد است و می‌تواند ابر الکترونی یون‌های منفی را به‌شدت قطبی کند.

این ویژگی سبب می‌شود بسیاری از ترکیبات بریلیوم برخلاف ترکیبات معمول دیگر فلزات قلیایی خاکی، ماهیت کووالانسی قابل‌توجهی داشته باشند.

این رفتار یکی از مهم‌ترین ویژگی‌های شیمیایی خاص بریلیوم است.

### ۳.۶. ساختار بلوری

بریلیوم فلزی در دمای اتاق دارای ساختار بلوری شش‌گوش فشرده (Hexagonal Close-Packed یا HCP) است.

در این ساختار، اتم‌ها در لایه‌هایی با آرایش مشخص قرار می‌گیرند. آرایش لایه‌ها به‌گونه‌ای است که هر اتم در یک شبکهٔ منظم با همسایگان خود قرار دارد.

ساختار بلوری و پیوندهای فلزی در تعیین ویژگی‌هایی مانند سختی، صلبیت و رفتار مکانیکی بریلیوم نقش دارند.

منابع: [RSC – Atomic Data](https://periodic-table.rsc.org/element/4/beryllium) و [NIST – Atomic Spectra Database](https://physics.nist.gov/asd).

## ۴. جایگاه بریلیوم در جدول تناوبی

بریلیوم در گروه دوم، دورهٔ دوم و بلوک s جدول تناوبی قرار دارد.

گروه دوم جدول تناوبی شامل عناصر زیر است:

$\\mathrm{Be}$، $\\mathrm{Mg}$، $\\mathrm{Ca}$، $\\mathrm{Sr}$، $\\mathrm{Ba}$ و $\\mathrm{Ra}$

این عناصر با نام فلزات قلیایی خاکی شناخته می‌شوند.

ویژگی مشترک اعضای این گروه، داشتن دو الکترون در لایهٔ ظرفیت و تمایل معمول آن‌ها به تشکیل یون‌های دوظرفیتی با بار $+2$ است.

بااین‌حال، بریلیوم در مقایسه با سایر اعضای گروه ویژگی‌های متفاوتی دارد:

۱. شعاع اتمی و یونی بسیار کوچکی دارد.

۲. انرژی یونش آن نسبتاً زیاد است.

۳. ترکیبات آن در مقایسه با بسیاری از ترکیبات سایر فلزات قلیایی خاکی، ماهیت کووالانسی بیشتری دارند.

۴. اکسید و هیدروکسید آن رفتار آمفوتری نشان می‌دهند؛ یعنی می‌توانند هم با اسیدها و هم با بازهای قوی واکنش دهند.

۵. برخلاف برخی عناصر سنگین‌تر گروه دوم، با آب سرد به‌راحتی واکنش نمی‌دهد.

### ۴.۱. رابطهٔ قطری بریلیوم و آلومینیوم

یکی از پدیده‌های جالب جدول تناوبی، شباهت برخی عناصر در امتداد قطر جدول تناوبی است.

بریلیوم در برخی ویژگی‌های شیمیایی با آلومینیوم ($\\mathrm{Al}$) شباهت دارد. این پدیده به نام رابطهٔ قطری (Diagonal Relationship) شناخته می‌شود.

دلایل این شباهت شامل چگالی بار نسبتاً زیاد یون‌های آن‌ها و توانایی قطبی‌کردن پیوندهای شیمیایی است.

از جمله شباهت‌های بریلیوم و آلومینیوم می‌توان به موارد زیر اشاره کرد:

- رفتار آمفوتری اکسیدها و هیدروکسیدها؛
- تمایل قابل‌توجه به تشکیل ترکیبات دارای پیوند کووالانسی؛
- تشکیل برخی ترکیبات کمپلکس؛
- ایجاد لایهٔ اکسیدی محافظ در سطح فلز.

### ۵.۱. ظاهر و حالت فیزیکی

بریلیوم در دمای اتاق جامدی فلزی با رنگ خاکستری متمایل به سفید است.

این فلز چگالی نسبتاً کمی دارد و از نظر جرم، در مقایسه با بسیاری از فلزات صنعتی سبک محسوب می‌شود.

چگالی آن حدود $1.85\\ \\mathrm{g/cm^3}$ است؛ یعنی تقریباً یک‌چهارم چگالی فولادهای معمولی.

### ۵.۲. نقطهٔ ذوب و جوش

یکی از ویژگی‌های مهم بریلیوم، نقطهٔ ذوب بسیار بالای آن در مقایسه با بسیاری از فلزات سبک است.

| ویژگی | مقدار تقریبی |
|---|---:|
| نقطهٔ ذوب | $1287\\ ^{\\circ}\\mathrm{C}$ |
| نقطهٔ ذوب بر حسب کلوین | $1560\\ \\mathrm{K}$ |
| نقطهٔ جوش | $2468\\ ^{\\circ}\\mathrm{C}$ |
| نقطهٔ جوش بر حسب کلوین | $2741\\ \\mathrm{K}$ |
| چگالی | $1.85\\ \\mathrm{g/cm^3}$ |
| ظرفیت گرمایی ویژه | حدود $1825\\ \\mathrm{J/(kg\\cdot K)}$ |

نقطهٔ ذوب بالای بریلیوم و پایداری آن در گسترهٔ دمایی وسیع، این فلز را برای برخی کاربردهای هوافضایی و مهندسی مناسب می‌کند.

### ۵.۳. نسبت صلبیت به جرم

یکی از مهم‌ترین ویژگی‌های مکانیکی بریلیوم، صلبیت ویژهٔ زیاد آن است.

صلبیت با مدول یانگ (Young's Modulus) مرتبط است. این کمیت میزان مقاومت یک ماده در برابر تغییر شکل الاستیک را توصیف می‌کند.

بریلیوم به ازای جرم خود، صلبیت بسیار زیادی دارد؛ به همین دلیل در سازه‌هایی که باید هم سبک باشند و هم در برابر تغییر شکل مقاومت کنند، کاربرد دارد.

این ویژگی برای قطعات دقیق ماهواره‌ها و تجهیزات اپتیکی اهمیت زیادی دارد.

### ۵.۴. تردی و رفتار مکانیکی

بریلیوم با وجود صلبیت زیاد، فلزی نسبتاً شکننده است. بنابراین نباید سختی یا صلبیت آن را با شکل‌پذیری بالا اشتباه گرفت.

یک ماده ممکن است در برابر تغییر شکل الاستیک بسیار مقاوم باشد، اما پیش از آنکه تغییر شکل پلاستیک قابل‌توجهی از خود نشان دهد، دچار شکست شود.

این ویژگی در طراحی قطعات مهندسی ساخته‌شده از بریلیوم اهمیت دارد.

### ۵.۵. رسانایی گرمایی و الکتریکی

بریلیوم فلزی رسانای گرما و برق است. همچنین اکسید آن، یعنی $\\mathrm{BeO}$، ویژگی متفاوتی دارد: رسانایی گرمایی بالا در کنار مقاومت الکتریکی زیاد.

این ترکیب از خواص، اکسید بریلیوم را برای ساخت برخی قطعات الکترونیکی و سامانه‌های دفع گرما ارزشمند می‌کند.

### ۵.۶. شفافیت در برابر پرتوهای ایکس

بریلیوم در مقایسه با بسیاری از فلزات، جذب نسبتاً کمی برای پرتوهای ایکس دارد.

به همین دلیل، ورقه‌های بسیار نازک آن در برخی پنجره‌های لوله‌های پرتو ایکس و تجهیزات تصویربرداری و پژوهشی استفاده می‌شوند.

این ویژگی به پرتوهای ایکس اجازه می‌دهد با تضعیف نسبتاً کم از پنجره عبور کنند.

منابع: [RSC – Beryllium](https://periodic-table.rsc.org/element/4/beryllium) و [USGS – Beryllium Statistics and Information](https://www.usgs.gov/centers/national-minerals-information-center/beryllium-statistics-and-information).

## ۶. خواص شیمیایی بریلیوم

### ۶.۱. عدد اکسایش و واکنش‌پذیری

بریلیوم در بیشتر ترکیبات شیمیایی خود عدد اکسایش $+2$ دارد.

این عنصر با از دست دادن دو الکترون ظرفیت خود به یون $\\mathrm{Be^{2+}}$ تبدیل می‌شود.

با وجود تمایل به واکنش‌پذیری، سطح بریلیوم فلزی در تماس با اکسیژن هوا می‌تواند با لایه‌ای نازک از اکسید پوشیده شود. این لایه تا اندازه‌ای از ادامهٔ واکنش سطح فلز با محیط جلوگیری می‌کند.

### ۶.۲. واکنش با اکسیژن

بریلیوم با اکسیژن واکنش داده و اکسید بریلیوم تشکیل می‌دهد:

$$\\mathrm{2Be + O_2 \\rightarrow 2BeO}$$

اکسید بریلیوم جامدی سفیدرنگ و دارای نقطهٔ ذوب بسیار بالا است.

### ۶.۳. واکنش با اسیدها

بریلیوم می‌تواند با اسیدهای مناسب واکنش دهد و نمک‌های بریلیوم همراه با گاز هیدروژن تشکیل دهد.

برای نمونه، معادلهٔ کلی واکنش آن با اسید کلریدریک به شکل زیر نمایش داده می‌شود:

$$\\mathrm{Be + 2HCl \\rightarrow BeCl_2 + H_2}$$

این واکنش از نظر شیمیایی نشان می‌دهد که بریلیوم می‌تواند در شرایط مناسب نقش کاهنده داشته باشد.

### ۶.۴. واکنش با آب

بریلیوم در شرایط معمول با آب سرد واکنش قابل‌توجهی ندارد. این رفتار تا اندازه‌ای به وجود لایهٔ محافظ اکسیدی روی سطح آن مرتبط است.

این ویژگی آن را از برخی فلزات قلیایی خاکی مانند کلسیم متمایز می‌کند.

### ۶.۵. تشکیل هالیدها

بریلیوم با هالوژن‌ها ترکیباتی مانند بریلیوم کلرید تشکیل می‌دهد.

برای نمونه:

$$\\mathrm{Be + Cl_2 \\rightarrow BeCl_2}$$

ترکیباتی مانند $\\mathrm{BeCl_2}$ برخلاف بسیاری از نمک‌های یونی ساده، ویژگی‌های کووالانسی قابل‌توجهی دارند.

### ۶.۶. آمفوتری اکسید و هیدروکسید بریلیوم

یکی از ویژگی‌های مهم شیمیایی بریلیوم، آمفوتری‌بودن اکسید و هیدروکسید آن است.

مادهٔ آمفوتر می‌تواند هم در برابر اسید و هم در برابر باز رفتار شیمیایی نشان دهد.

برای نمونه، هیدروکسید بریلیوم با اسید کلریدریک واکنش می‌دهد:

$$\\mathrm{Be(OH)_2 + 2HCl \\rightarrow BeCl_2 + 2H_2O}$$

در محیط قلیایی قوی نیز می‌تواند گونه‌های محلول هیدروکسو-بریلات تشکیل دهد.

این ویژگی یکی از شباهت‌های مهم شیمیایی بریلیوم با آلومینیوم است.

### ۶.۷. پیوندهای کووالانسی در ترکیبات بریلیوم

یون $\\mathrm{Be^{2+}}$ کوچک و دارای بار مثبت زیاد است. به همین دلیل، می‌تواند ابر الکترونی یون منفی را به‌شدت قطبی کند.

این پدیده سبب می‌شود بسیاری از ترکیبات بریلیوم، برخلاف نمک‌های معمولی فلزات قلیایی خاکی، ماهیت کووالانسی قابل‌توجهی داشته باشند.

بنابراین، رفتار شیمیایی بریلیوم صرفاً با دانستن جایگاه آن در گروه دوم قابل‌پیش‌بینی کامل نیست.

## ۷. ایزوتوپ‌های بریلیوم

ایزوتوپ‌ها اتم‌های یک عنصر هستند که تعداد پروتون‌های یکسان، اما تعداد نوترون‌های متفاوت دارند.

بریلیوم یک ایزوتوپ پایدار طبیعی دارد: بریلیوم-۹. سایر ایزوتوپ‌های شناخته‌شدهٔ آن پرتوزا هستند.

### ۷.۱. بریلیوم-۹

بریلیوم-۹ با نماد $^{9}_{4}\\mathrm{Be}$ شناخته می‌شود.

هستهٔ آن از چهار پروتون و پنج نوترون تشکیل شده است.

این ایزوتوپ تنها ایزوتوپ پایدار طبیعی بریلیوم است و تقریباً تمام بریلیوم طبیعی را تشکیل می‌دهد.

### ۷.۲. بریلیوم-۷

بریلیوم-۷ با نماد $^{7}_{4}\\mathrm{Be}$ شناخته می‌شود. این ایزوتوپ پرتوزاست و نیمه‌عمر آن حدود ۵۳٫۲۲ روز است.

بریلیوم-۷ عمدتاً از طریق فرایند جذب الکترون به لیتیم-۷ تبدیل می‌شود:

$$^{7}_{4}\\mathrm{Be} + ^{0}_{-1}\\mathrm{e} \\rightarrow ^{7}_{3}\\mathrm{Li} + \\nu_e$$

این ایزوتوپ در پژوهش‌های مرتبط با جو زمین، انتقال ذرات و بررسی فرایندهای کیهانی اهمیت دارد.

### ۷.۳. بریلیوم-۸

بریلیوم-۸ با نماد $^{8}_{4}\\mathrm{Be}$ ایزوتوپی بسیار ناپایدار است.

نیمه‌عمر آن در حدود $81.9$ آتوثانیه است؛ یعنی در مقیاس زمانی بسیار کوتاهی به دو هستهٔ هلیوم-۴ تجزیه می‌شود.

$$^{8}_{4}\\mathrm{Be} \\rightarrow 2\\ ^{4}_{2}\\mathrm{He}$$

این ناپایداری هسته‌ای در فهم فرایندهای همجوشی هسته‌ای درون ستارگان اهمیت فراوانی دارد.

### ۷.۴. بریلیوم-۱۰

بریلیوم-۱۰ با نماد $^{10}_{4}\\mathrm{Be}$ ایزوتوپی پرتوزاست که نیمه‌عمر آن حدود $1.387$ میلیون سال است.

این ایزوتوپ عمدتاً در اثر برخورد پرتوهای کیهانی با هسته‌های اتمی در جو و سنگ‌های سطحی زمین تولید می‌شود.

واپاشی آن از نوع بتای منفی است و به بور-۱۰ منجر می‌شود:

$$^{10}_{4}\\mathrm{Be} \\rightarrow ^{10}_{5}\\mathrm{B} + ^{0}_{-1}\\mathrm{e} + \\bar{\\nu}_e$$

از بریلیوم-۱۰ در پژوهش‌های زمین‌شناسی برای بررسی فرسایش سنگ‌ها، سرعت تشکیل خاک، قدمت برخی رسوبات و تحول سطح زمین استفاده می‌شود.

### ۷.۵. مقایسهٔ ایزوتوپ‌ها

| ویژگی | بریلیوم-۷ | بریلیوم-۸ | بریلیوم-۹ | بریلیوم-۱۰ |
|---|---:|---:|---:|---:|
| نماد | $^{7}_{4}\\mathrm{Be}$ | $^{8}_{4}\\mathrm{Be}$ | $^{9}_{4}\\mathrm{Be}$ | $^{10}_{4}\\mathrm{Be}$ |
| تعداد پروتون | ۴ | ۴ | ۴ | ۴ |
| تعداد نوترون | ۳ | ۴ | ۵ | ۶ |
| پایداری | پرتوزا | بسیار ناپایدار | پایدار | پرتوزا |
| نیمه‌عمر تقریبی | ۵۳٫۲۲ روز | ۸۱٫۹ آتوثانیه | پایدار | ۱٫۳۸۷ میلیون سال |
| اهمیت پژوهشی | مطالعات جوی و هسته‌ای | واکنش‌های هسته‌ای ستارگان | بریلیوم طبیعی | زمین‌شناسی و کیهان‌زاد |

## ۸. منشأ کیهانی بریلیوم

### ۸.۱. بریلیوم در جهان اولیه

بریلیوم از عناصر سبک جهان است؛ اما برخلاف هیدروژن و هلیوم، در جریان هسته‌زایی مهبانگ به مقدار بسیار ناچیزی تولید شد.

یکی از دلایل این موضوع، نبود هسته‌های پایدار با عدد جرمی ۵ و ۸ است. این مسئله باعث ایجاد موانعی در مسیر ساخت عناصر سنگین‌تر از هلیوم در جهان اولیه شد.

بریلیوم-۹ نیز به‌سادگی در شرایط اولیهٔ کیهان تولید نمی‌شد؛ بنابراین فراوانی آغازین آن بسیار کم بود.

### ۸.۲. تولید بریلیوم به کمک پرتوهای کیهانی

یکی از مهم‌ترین سازوکارهای تشکیل بریلیوم در کیهان، فرایندی به نام شکافت هسته‌ای بر اثر برخورد پرتوهای کیهانی (Cosmic-Ray Spallation) است.

در این فرایند، ذرات پرانرژی مانند پروتون‌ها و هسته‌های هلیوم با هسته‌های سنگین‌تری مانند کربن، نیتروژن و اکسیژن برخورد می‌کنند.

این برخوردها می‌توانند هسته‌های سنگین‌تر را به قطعات کوچک‌تر تقسیم کنند و هسته‌هایی مانند لیتیم، بریلیوم و بور به وجود آورند.

بنابراین، برخلاف عناصری مانند کربن و اکسیژن که بخش زیادی از آن‌ها درون ستارگان تولید می‌شود، بریلیوم کیهانی تا حد زیادی حاصل برخورد پرتوهای کیهانی است.

### ۸.۳. بریلیوم در ستارگان

بریلیوم در بسیاری از ستارگان در دماهای نسبتاً پایین‌تر از شرایط لازم برای تولید عناصر سنگین‌تر، می‌تواند تخریب شود.

به همین دلیل، اندازه‌گیری فراوانی بریلیوم در جو ستارگان می‌تواند اطلاعاتی دربارهٔ تاریخچهٔ حرارتی و تحول آن‌ها ارائه کند.

پژوهشگران از نسبت فراوانی بریلیوم در ستارگان برای مطالعهٔ تحول شیمیایی کهکشان‌ها و فرایندهای تولید عناصر سبک استفاده می‌کنند.

منابع: [NASA – Elemental Composition of the Universe](https://imagine.gsfc.nasa.gov/science/questions/composition.html) و [PubChem – Beryllium](https://pubchem.ncbi.nlm.nih.gov/element/Beryllium).

## ۹. بریلیوم در زمین و طبیعت

### ۹.۱. فراوانی در پوستهٔ زمین

بریلیوم در پوستهٔ زمین به مقدار نسبتاً کم یافت می‌شود و در ترکیب برخی سنگ‌ها و کانی‌ها حضور دارد.

این عنصر در طبیعت به شکل فلزی آزاد وجود ندارد؛ زیرا معمولاً به‌صورت ترکیبات معدنی پایدار دیده می‌شود.

### ۹.۲. کانی بریل

![نمونه‌ای از کانی بریل با رنگ سبزآبی؛ آکوامارین یکی از گونه‌های گوهرین بریل است.](https://media.snl.no/media/23481/standard_Grimsrudbukta__Hurum_Trond3438_n.jpg "بلور آکوامارین از خانوادهٔ بریل")

*بلور آکوامارین؛ این کانی از ترکیبات اصلی حاوی بریلیوم در طبیعت است.*

بریل یکی از مهم‌ترین کانی‌های بریلیوم‌دار است.

فرمول شیمیایی آن به‌صورت زیر نوشته می‌شود:

$$\\mathrm{Be_3Al_2Si_6O_{18}}$$

بریل معمولاً در پگماتیت‌های گرانیتی و برخی محیط‌های زمین‌شناختی دیگر تشکیل می‌شود.

برخی از گونه‌های گوهرین مهم آن عبارت‌اند از:

- **زمرد (Emerald):** نوع سبز بریل که رنگ آن معمولاً به حضور مقادیر اندکی از کروم یا وانادیم وابسته است.
- **آکوامارین (Aquamarine):** نوع آبی تا آبی‌سبز بریل که رنگ آن معمولاً با حضور آهن ارتباط دارد.
- **مورگانیت (Morganite):** نوع صورتی تا هلویی بریل.
- **هلیودور (Heliodor):** نوع زرد تا طلایی بریل.

### ۹.۳. کانی برتراندیت

برتراندیت (Bertrandite) یکی دیگر از منابع اقتصادی مهم بریلیوم است.

فرمول شیمیایی آن به شکل زیر است:

$$\\mathrm{Be_4Si_2O_7(OH)_2}$$

این کانی در برخی ذخایر زمین‌شناختی به‌عنوان مادهٔ اولیهٔ استخراج بریلیوم استفاده می‌شود.

### ۹.۴. سایر کانی‌های بریلیوم‌دار

بریلیوم در کانی‌های دیگری نیز وجود دارد؛ از جمله:

- فناکیت (Phenakite)؛
- کریزوبریل (Chrysoberyl)؛
- برخی کانی‌های پگماتیتی و سیلیکاتی.

بااین‌حال، بریل و برتراندیت از مهم‌ترین کانی‌های اقتصادی بریلیوم هستند.

منابع: [USGS – Critical Mineral Resources: Beryllium](https://pubs.usgs.gov/pp/1802/e/pp1802e.pdf) و [RSC – Beryllium](https://periodic-table.rsc.org/element/4/beryllium).

## ۱۰. استخراج و تولید صنعتی بریلیوم

بریلیوم به دلیل واکنش‌پذیری و سمیت ترکیبات آن، برای مصارف صنعتی به شکل کنترل‌شده از مواد معدنی استخراج و فرآوری می‌شود.

دو کانی مهم در این فرایند بریل و برتراندیت هستند.

### ۱۰.۱. استخراج از کانی‌های معدنی

در این مسیر، ابتدا سنگ معدن دارای بریلیوم استخراج و سپس برای جداسازی کانی‌های موردنظر فرآوری می‌شود.

پس از آن، فرایندهای شیمیایی صنعتی برای تبدیل ترکیبات معدنی به مواد میانی قابل‌فرآوری انجام می‌شوند.

یکی از محصولات میانی مهم، هیدروکسید بریلیوم با فرمول $\\mathrm{Be(OH)_2}$ است.

### ۱۰.۲. تولید بریلیوم فلزی

برای تولید فلز بریلیوم، ترکیبات خالص‌تری از این عنصر در فرایندهای صنعتی ویژه به مواد مناسب برای جداسازی فلز تبدیل می‌شوند.

روش‌های تولید صنعتی بریلیوم فلزی شامل فرایندهای احیایی یا الکترولیتی است.

این عملیات به دلیل سمیت شدید گردوغبار و ترکیبات بریلیوم، صرفاً در تأسیسات تخصصی و تحت کنترل‌های سخت‌گیرانهٔ صنعتی انجام می‌شوند.

### ۱۰.۳. تولید اکسید بریلیوم

اکسید بریلیوم، $\\mathrm{BeO}$، یکی از محصولات مهم فرآوری بریلیوم است.

این ترکیب به علت رسانایی گرمایی زیاد و عایق‌بودن الکتریکی، در برخی قطعات الکترونیکی و سرامیک‌های مهندسی کاربرد دارد.

### ۱۰.۴. تولید آلیاژهای بریلیوم

یکی از مسیرهای مهم مصرف صنعتی بریلیوم، تولید آلیاژهای آن با فلزاتی مانند مس، آلومینیوم و نیکل است.

این آلیاژها می‌توانند ترکیبی از استحکام، سختی، رسانایی الکتریکی، رسانایی گرمایی و مقاومت به خستگی را فراهم کنند.

---

## ۱۱. ترکیبات مهم بریلیوم

بریلیوم ترکیبات متنوعی با عناصر دیگر تشکیل می‌دهد. برخی از این ترکیبات در طبیعت یافت می‌شوند و برخی دیگر در صنایع شیمیایی و مهندسی کاربرد دارند.

| نام ترکیب | فرمول شیمیایی | ویژگی یا کاربرد |
|---|---|---|
| اکسید بریلیوم | $\\mathrm{BeO}$ | سرامیک‌های الکترونیکی و انتقال گرما |
| هیدروکسید بریلیوم | $\\mathrm{Be(OH)_2}$ | مادهٔ میانی در فرآوری بریلیوم |
| بریلیوم کلرید | $\\mathrm{BeCl_2}$ | ترکیب شیمیایی کووالانسی قابل‌توجه |
| بریلیوم فلورید | $\\mathrm{BeF_2}$ | کاربردهای ویژهٔ شیمیایی و هسته‌ای |
| بریلیوم سولفات | $\\mathrm{BeSO_4}$ | ترکیب معدنی محلول |
| بریلیوم کاربید | $\\mathrm{Be_2C}$ | ترکیب سرامیکی و معدنی |
| بریلیوم نیترید | $\\mathrm{Be_3N_2}$ | ترکیب معدنی بریلیوم و نیتروژن |
| بریل | $\\mathrm{Be_3Al_2Si_6O_{18}}$ | کانی طبیعی و گوهرسنگ |
| برتراندیت | $\\mathrm{Be_4Si_2O_7(OH)_2}$ | کانی مهم اقتصادی بریلیوم |

### ۱۱.۱. اکسید بریلیوم

اکسید بریلیوم که با نام بریلیا نیز شناخته می‌شود، ترکیبی سرامیکی با ویژگی‌های منحصربه‌فرد است.

این ماده رسانایی گرمایی بالایی دارد؛ درحالی‌که از نظر الکتریکی عایق است.

همین ترکیب ویژگی‌ها باعث شده است که در برخی قطعات الکترونیکی حساس، تجهیزات ارتباطی و سامانه‌های مدیریت حرارت استفاده شود.

### ۱۱.۲. هیدروکسید بریلیوم

هیدروکسید بریلیوم با فرمول $\\mathrm{Be(OH)_2}$ شناخته می‌شود.

این ترکیب آمفوتر است و می‌تواند در شرایط مناسب با اسیدها و بازهای قوی واکنش دهد.

### ۱۱.۳. بریلیوم فلورید

بریلیوم فلورید با فرمول $\\mathrm{BeF_2}$ شناخته می‌شود.

این ترکیب در برخی زمینه‌های پژوهش شیمی معدنی و فناوری هسته‌ای اهمیت دارد و یکی از مواد بررسی‌شده در سامانه‌های نمک مذاب است.

## ۱۲. کاربردهای بریلیوم

![نمونه‌ای از پنجره‌ها و اجزای صنعتی دارای پنجرهٔ بریلیومی برای سامانه‌های پرتو ایکس](https://images.squarespace-cdn.com/content/v1/5ff9ca36c1ead434c21a0760/21325cd6-e8ba-4bb9-81be-37ea3897ba8f/2018330152945464.jpg "پنجره‌های بریلیومی در تجهیزات پرتو ایکس")

*نمونه‌هایی از مجموعه‌های صنعتی دارای پنجره‌های بریلیومی؛ این قطعات برای عبور پرتوهای ایکس در سامانه‌های تخصصی طراحی می‌شوند.*

### ۱۲.۱. صنایع هوافضا

بریلیوم به دلیل چگالی کم، صلبیت ویژهٔ زیاد و پایداری ابعادی در گسترهٔ دمایی وسیع، در برخی قطعات هواپیماها و فضاپیماها کاربرد دارد.

در این صنایع، کاهش جرم سازه اهمیت بسیار زیادی دارد؛ زیرا کاهش جرم می‌تواند عملکرد پروازی، ظرفیت حمل محموله و مصرف انرژی را بهبود دهد.

### ۱۲.۲. آینه‌های تلسکوپی و تجهیزات اپتیکی

بریلیوم در برخی سامانه‌های اپتیکی و فضایی برای ساخت اجزای سبک و پایدار استفاده می‌شود.

پایداری ابعادی آن در تغییرات دما اهمیت زیادی دارد؛ زیرا تغییر شکل بسیار کوچک آینه یا سازهٔ نگهدارنده می‌تواند عملکرد سامانهٔ اپتیکی را تحت تأثیر قرار دهد.

### ۱۲.۳. پنجره‌های پرتو ایکس

بریلیوم به دلیل جذب نسبتاً کم پرتوهای ایکس، در ساخت پنجره‌های مخصوص برخی لوله‌های پرتو ایکس و تجهیزات پژوهشی کاربرد دارد.

این پنجره‌ها باید بتوانند ضمن حفظ شرایط فیزیکی داخل دستگاه، اجازه دهند پرتوهای ایکس با تضعیف نسبتاً کم از آن‌ها عبور کنند.

### ۱۲.۴. آلیاژ بریلیوم-مس

یکی از مهم‌ترین کاربردهای صنعتی بریلیوم، تولید آلیاژ بریلیوم-مس است.

این آلیاژ می‌تواند ترکیبی از ویژگی‌های زیر را ارائه دهد:

- استحکام و سختی بالا؛
- رسانایی الکتریکی و گرمایی مناسب؛
- مقاومت به خستگی؛
- مقاومت مناسب به خوردگی؛
- ویژگی‌های غیرمغناطیسی؛
- امکان استفاده در برخی ابزارهای صنعتی غیرجرقه‌زا.

آلیاژهای بریلیوم-مس در ساخت فنرها، اتصالات الکتریکی، برخی قطعات دقیق، یاتاقان‌ها و اجزای الکترونیکی استفاده می‌شوند.

### ۱۲.۵. صنعت الکترونیک

اکسید بریلیوم به دلیل رسانایی گرمایی بالا و عایق‌بودن الکتریکی، برای برخی قطعات الکترونیکی و تجهیزات نیازمند مدیریت حرارتی مناسب کاربرد دارد.

در چنین قطعاتی، انتقال سریع گرما اهمیت دارد؛ اما هم‌زمان باید از عبور جریان الکتریکی از مسیرهای ناخواسته جلوگیری شود.

### ۱۲.۶. فناوری هسته‌ای

بریلیوم در برخی سامانه‌های هسته‌ای به‌عنوان بازتاب‌دهنده یا کندکنندهٔ نوترون مورد استفاده قرار گرفته است.

ویژگی‌های هسته‌ای این عنصر باعث می‌شود در برخی طراحی‌های راکتوری، نقش مهمی در مدیریت نوترون‌ها داشته باشد.

البته انتخاب مواد در سامانه‌های هسته‌ای به نوع راکتور، انرژی نوترون‌ها، شرایط حرارتی و الزامات ایمنی وابسته است.

### ۱۲.۷. صنایع ارتباطی

بریلیوم و آلیاژهای آن در برخی تجهیزات مخابراتی و الکترونیکی حساس استفاده می‌شوند.

ویژگی‌هایی مانند پایداری ابعادی، رسانایی و مقاومت مکانیکی در برخی از این کاربردها اهمیت دارند.

### ۱۲.۸. کاربرد در پژوهش‌های علمی

بریلیوم در تجهیزات پژوهشی فیزیک، اپتیک، پرتو ایکس و فناوری هسته‌ای کاربرد دارد.

استفاده از آن در این زمینه‌ها نتیجهٔ ترکیب ویژگی‌های فیزیکی، مکانیکی و هسته‌ای خاص این عنصر است.

منابع: [USGS – Beryllium Statistics](https://www.usgs.gov/centers/national-minerals-information-center/beryllium-statistics-and-information) و [OSHA – Beryllium Overview](https://www.osha.gov/beryllium/).
