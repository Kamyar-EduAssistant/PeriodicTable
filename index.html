<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول تناوبی تعاملی عناصر</title>
    <script src="https://cdn.tailwindcss.com"></script>
<!-- فونت فارسی وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css"/>
<!-- کتابخانه KaTeX برای فرمول‌نویسی ریاضی -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" xintegrity="sha384-n8MVd4RsNIU0KOVEMckDpbCjaWr2Ugeh4/EGactnsCJO8e2i7gqY+2eJV6gwUqML" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" xintegrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" xintegrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js"></script>
    <link rel="stylesheet" href="libraries\tailwind-offline\tailwind.css">
    <link rel="stylesheet" href="libraries\katex\katex.min.css" xintegrity="sha384-n8MVd4RsNIU0KOVEMckDpbCjaWr2Ugeh4/EGactnsCJO8e2i7gqY+2eJV6gwUqML" crossorigin="anonymous">
    <script src="libraries\katex\katex.min.js" xintegrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script src="libraries\katex\auto-render.min.js" xintegrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --accent: #2563eb;
            --header-bg: rgba(255, 255, 255, 0.9);
            --drawer-bg: #ffffff;
            --info-bg: #f9fafb;
            --hover-shadow: rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-main: #ffffff;
                --text-secondary: #aaaaaa;
                --border-color: #333;
                --accent: #3b82f6;
                --header-bg: rgba(30, 30, 30, 0.9);
                --drawer-bg: #18181b;
                --info-bg: #27272a;
                --hover-shadow: rgba(255,255,255,0.1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 15px !important;
            font-weight: 900 !important;
            font-size: 1.65em !important;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        .text-white {
            color: #ffffff !important;
        }
        ol {list-style-type: persian !important;}
        ul, ol {
            margin: 0.5em 0 !important;
            padding: revert !important;
            list-style: revert !important;
        }
        /* بولت‌ها و شماره‌ها */
        ul li::marker, ol li::marker {
            color: #15803d; /* سبز تیره */
            font-weight: bold;
        }
        /* فاصله و padding بین آیتم‌ها */
        ul li, ol li {
            margin-bottom: 0.3em;
            padding-right: 0.5rem;
        }
        /* لیست‌های تو در تو */
        ul li ul, ol li ol {
            margin-top: 0.3em;
            margin-bottom: 0.3em;
        }
        .table-wrapper {
            border-radius: 18px;
            margin-top: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.125);
        }
        .ai-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .ai-table thead { background: linear-gradient(-45deg, #2b8b40, #009d3c); color: #fff; }
        .ai-table th, .ai-table td { border-bottom: 1px solid #d1d5db; border-left: 1px solid #d1d5db; padding: 0.75rem; text-align: center; }
        .ai-table th:last-child, .ai-table td:last-child { border-left: none; }
        .ai-table tr:last-child td { border-bottom: none; }
        .ai-table th { font-weight: bold; }
        .ai-table tbody tr:nth-child(odd) { background-color: #ffffff; }
        .ai-table tbody tr:nth-child(even) { background-color: #f7f7f7; }
        .ai-table tbody tr:hover { background-color: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.149); transform: translateY(-1px); transition: all .15s ease; }
        .ai-table th:first-child {border-top-right-radius: 18px;}
        .ai-table th:last-child {border-top-left-radius: 18px;}
        .ai-table tr:last-child {border-bottom-right-radius: 18px;border-bottom-left-radius: 18px;}
        .ai-table tr:last-child td:first-child {border-bottom-right-radius: 18px;}
        .ai-table tr:last-child td:last-child {border-bottom-left-radius: 18px;}

        .inline-link {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1px;
            transition: opacity 0.15s ease;
            word-break: break-word;
        }
        .inline-link:hover {
            opacity: 0.75;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-mode {
            background: var(--card-bg);
            font-family: 'Vazirmatn', sans-serif;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-mode:hover, .btn-mode.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .table-scroll-container {
            width: 100%;
            overflow-x: auto;
            padding: 20px;
            display: flex;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: 30px repeat(18, 70px); 
            grid-template-rows: 30px repeat(9, 70px);
            gap: 6px;
            margin: 0 auto;
            position: relative;
        }

        .periodic-table.highlight-mode .element {
            opacity: 0.5 !important;
            filter: grayscale(0.8);
            transition: all 0.1s ease-in-out;
        }

        .periodic-table.highlight-mode .element.highlight {
            opacity: 1 !important;
            filter: grayscale(0);
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--hover-shadow);
            z-index: 50;
            transition: all 0.1s ease-in-out;
        }

        .legend-item {
            transition: all 0.2s ease;
            padding: 6px 12px;
        }

        .legend-item:hover {
            background: var(--info-bg);
            transform: translateY(-2px);
        }

        /* استایل شماره‌های گروه و دوره */
        .grid-header {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .element {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            overflow: hidden;
            user-select: none;
            color: var(--text-main);
        }

        .element:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 0 15px var(--hover-shadow);
            border-color: var(--accent);
        }

        .bohr-element:hover {
            transform: scale(2.1);
        }
        .image-element:hover {
            transform: scale(1.5);
        }

        .element .radioactive {
            position: absolute;
            bottom: 1.25px;
            right: 1.25px;
            font-size: 0.675rem;
            color: #f43f5e; /* سرخابی یا قرمز */
        }

        .radioactive-big {
            position: absolute;
            bottom: 6px;
            right: 9px;
            font-size: 1.8rem;
            color: #f43f5e;
        }

        .atomic-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.65rem;
            color: var(--text-secondary);
        }
        .symbol {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 2px;
        }
        .name {
            font-size: 0.6rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
            margin-top: -5px;
        }
        .mass {
            font-size: 0.55rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .img-symbol {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        

        /* استایل‌های محتوای حالت‌های مختلف */
        .bohr-view, .image-view {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .orbital-view {
            font-size: 0.6rem;
            text-align: center;
            line-height: 1.2;
            padding: 2px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        .orbital-view strong {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        /* Drawer Styles */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(2px);
            z-index: 199;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .drawer-overlay.active { opacity: 1; visibility: visible; }

        .drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 86.5vh;
            background: var(--drawer-bg);
            border-top: 1px solid var(--border-color);
            border-radius: 30px 30px 0 0;
            z-index: 200;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            color: var(--text-main);
        }
        .drawer.active { transform: translateY(0); box-shadow: 0 -5px 30px rgba(0,0,0,0.7); }

        .drawer-header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .drawer-close {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }
        .drawer-content {
            padding: 25px;
            overflow-y: auto;
            gap: 30px;
            align-content: flex-start;
        }

        .drawer-top-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .element-big-card {
            width: 260px;
            height: 280px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            flex-shrink: 0;
        }
        .big-number {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.5rem;
            opacity: 0.8;
            font-weight: bold;
        }
        .big-symbol {
            font-size: 6rem;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .big-name { font-size: 2rem; margin-top: -10px; }

        .details-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--border-color);
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-section { flex: 1; min-width: 300px; }

        /* استایل اختصاصی برای بخش مدل بور و اطلاعات مداری */
        .bohr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--info-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 260px;
            margin-top: 25px;
            margin-bottom: 25px;
            flex-shrink: 0;
        }
        .bohr-canvas {
            max-width: 100%;
            height: auto;
        }
        #bohrCanvas {
            max-width: 100%;
            height: auto;
        }
        #orbitInfo {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            direction: rtl;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .info-item {
            background: var(--info-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .info-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 5px;
        }
        .info-value { font-size: 1rem; overflow-x: auto; overflow-y: hidden; }
        
        .katex-display { margin-left: auto; margin-right: auto; direction: ltr; }
        span.katex { direction: ltr; display: inline-block; }

        .description-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.8;
            font-size: 0.95rem;
            padding: 25px;
            text-align: justify;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            padding: 10px;
            max-width: 1200px;
            margin: 10px auto;
        }
        .legend-item {
            display: flex;
            justify-content: space-between;
            flex-direction: row-reverse;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            column-gap: 6px;
        }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; margin-left: 6px; }

        @media (max-width: 600px) {
            .drawer-content { align-items: center; flex-wrap: wrap; }
            .info-section { width: 100%; }
            .element-big-card { width: 100%; }
            .bohr-container { width: 100%; }
        }
        @media (min-width: 600px) {
            .drawer-content { display: flex; }
        }
        @media (prefers-color-scheme: dark) {
            .ai-table th, .ai-table td { 
                border-bottom: 1px solid #5f7959;
                border-left: 1px solid #75956e;
            }
            .ai-table thead { background: linear-gradient(-45deg, #299100, #008f5a); }
            .ai-table tbody tr:nth-child(even) { 
            	background-color: #effffc1c; 
            }
            .ai-table tbody tr:nth-child(odd) { 
            	background-color: #484c4d26; /* یا رنگ اصلی بدنه */
            }
            .ai-table tbody tr:hover { background-color: #ccedc336; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.302); }
        }
    </style>
</head>
<body>

    <header>
        <h1>جدول تناوبی تعاملی عناصر</h1>
        <div class="controls">
            <button class="btn-mode active" onclick="setMode('standard')">استاندارد</button>
            <button class="btn-mode" onclick="setMode('block')">بلوک</button>
            <button class="btn-mode" onclick="setMode('bohr')">مدل بور</button>
            <button class="btn-mode" onclick="setMode('orbital')">آرایش اوربیتالی</button>
            <button class="btn-mode" onclick="setMode('phase')">حالت ماده</button>
            <button class="btn-mode" onclick="setMode('image')">تصویری</button>
        </div>
    </header>

    <div class="table-scroll-container">
        <div class="periodic-table" id="periodicTable" dir="ltr"></div>
    </div>

    <div class="legend" id="legend"></div>

    <!-- پنل کشویی (Drawer) -->
    <div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h2 id="drawerTitle">جزئیات عنصر</h2>
            <button class="drawer-close" onclick="closeDrawer()">✕</button>
        </div>
        <div style="overflow-y: auto;" id="drawerContent"></div>
    </div>

    <script>
        const colorPalette = {
            'alkali-metal': '#ff0c0c',      // قرمز
            'alkaline-earth': '#f97316',    // نارنجی
            'transition-metal': '#eab308',  // زرد
            'post-transition': '#84cc16',   // سبز لیمویی
            'metalloid': '#10b981',         // سبز
            'non-metal': '#00b1db',         // فیروزه‌ای
            'halogen': '#326aed',           // آبی
            'noble-gas': '#8b5cf6',         // بنفش
            'lanthanide': '#d946ef',        // صورتی
            'actinide': '#ff314b',          // سرخابی
        };
        const blockColors = {
            's': '#ef4444',
            'p': '#eab308',
            'd': '#3b82f6',
            'f': '#10b981'
        };

        const categoryNames = {
            'alkali-metal': 'فلزات قلیایی',
            'alkaline-earth': 'فلزات قلیایی خاکی',
            'transition-metal': 'فلزات واسطه',
            'post-transition': 'فلزات پس‌واسطه',
            'metalloid': 'شبه‌فلزات',
            'non-metal': 'نافلزات',
            'halogen': 'هالوژن‌ها',
            'noble-gas': 'گازهای نجیب',
            'lanthanide': 'لانتانیدها',
            'actinide': 'آکتینیدها',
        };

        // --- الگوریتم دقیق آرایش الکترونی (Aufbau Principle) ---
        // Order: 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p, 6s, 4f, 5d, 6p, 7s, 5f, 6d, 7p
        const aufbauOrder = [
            {n:1, t:'s', c:2}, {n:2, t:'s', c:2}, {n:2, t:'p', c:6},
            {n:3, t:'s', c:2}, {n:3, t:'p', c:6}, {n:4, t:'s', c:2},
            {n:3, t:'d', c:10}, {n:4, t:'p', c:6}, {n:5, t:'s', c:2},
            {n:4, t:'d', c:10}, {n:5, t:'p', c:6}, {n:6, t:'s', c:2},
            {n:4, t:'f', c:14}, {n:5, t:'d', c:10}, {n:6, t:'p', c:6},
            {n:7, t:'s', c:2}, {n:5, t:'f', c:14}, {n:6, t:'d', c:10}, {n:7, t:'p', c:6}
        ];

        const orbitalTypeOrder = { s: 0, p: 1, d: 2, f: 3 };

        function byShell(a, b) {
            return a.n - b.n || orbitalTypeOrder[a.type] - orbitalTypeOrder[b.type];
        }

        function sortedByShell(config) {
            return [...config].sort(byShell);
        }

        function calculateElectronConfig(Z) {
            const exceptions = {
                24: "1s2 2s2 2p6 3s2 3p6 4s1 3d5",
                29: "1s2 2s2 2p6 3s2 3p6 4s1 3d10",
                41: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d4",
                42: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d5",
                44: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d7",
                45: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d8",
                46: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 4d10",
                47: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d10",
                78: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p6 6s1 4f14 5d9",
                79: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p6 6s1 4f14 5d10"
            };

## چکیده

هیدروژن با نماد شیمیایی $\\mathrm{H}$ و عدد اتمی ۱، ساده‌ترین و سبک‌ترین عنصر جدول تناوبی و فراوان‌ترین عنصر در جهان است. اتم معمولی هیدروژن از یک پروتون در هسته و یک الکترون در اطراف آن تشکیل شده است. این عنصر در شرایط معمول زمین عمدتاً به شکل مولکول دواتمی $\\mathrm{H_2}$ وجود دارد؛ گازی بی‌رنگ، بی‌بو، بسیار سبک و به‌شدت اشتعال‌پذیر که در بسیاری از فرایندهای شیمیایی و صنعتی نقشی اساسی دارد.

هیدروژن از نخستین مراحل تحول کیهان در جهان حضور داشته و سوخت اصلی بسیاری از ستارگان، از جمله خورشید، به شمار می‌رود. این عنصر در ساختار آب، مواد آلی و تقریباً تمام سامانه‌های زیستی نقش دارد. همچنین در تولید آمونیاک، پالایش نفت، صنایع شیمیایی، فناوری پیل‌های سوختی، ذخیره‌سازی انرژی و پژوهش‌های همجوشی هسته‌ای کاربرد دارد. با وجود ظرفیت فراوان آن در فناوری‌های انرژی، شیوهٔ تولید، انتقال و ذخیره‌سازی هیدروژن و پیامدهای زیست‌محیطی آن همچنان از موضوعات مهم پژوهش علمی و مهندسی هستند.

**واژگان کلیدی:** هیدروژن، اتم، مولکول دواتمی، ایزوتوپ، همجوشی هسته‌ای، الکترولیز، پیل سوختی، سوخت هیدروژنی، شیمی، اخترفیزیک.

## ۱. معرفی و مشخصات عمومی

هیدروژن نخستین عنصر جدول تناوبی است و ساده‌ترین ساختار اتمی را در میان عناصر دارد. واژهٔ Hydrogen از واژه‌های یونانی *Hydro* به معنای آب و *Genes* به معنای زاینده یا پدیدآورنده گرفته شده است؛ بنابراین معنای آن تقریباً «آب‌ساز» است. این نام به تشکیل آب در واکنش هیدروژن با اکسیژن اشاره دارد.

هیدروژن در شرایط معمول دما و فشار، به‌صورت گاز دواتمی $\\mathrm{H_2}$ پایدار است. هر مولکول آن از دو اتم هیدروژن تشکیل می‌شود که با یک پیوند کووالانسی به یکدیگر متصل شده‌اند.

## ۲. تاریخچهٔ کشف هیدروژن

آگاهی انسان از گاز هیدروژن به چند قرن پیش از شناسایی رسمی آن بازمی‌گردد. در اوایل قرن شانزدهم، پاراسلسوس، کیمیاگر و پزشک سوئیسی، متوجه شد که واکنش براده‌های آهن با اسید سولفوریک گازی تولید می‌کند که قابلیت اشتعال دارد. رابرت بویل نیز در سال ۱۶۷۱ پدیده‌ای مشابه را مشاهده کرد؛ با این حال، هیچ‌یک از این دانشمندان ماهیت واقعی گاز را به‌طور کامل مشخص نکردند.

### ۲.۱. هنری کاوندیش و شناسایی هیدروژن

در سال ۱۷۶۶، شیمیدان و فیزیک‌دان انگلیسی، هنری کاوندیش، گازی را که از واکنش فلزات با اسیدها آزاد می‌شد جمع‌آوری و بررسی کرد. او نشان داد که این گاز ماده‌ای مستقل و متفاوت از گازهای شناخته‌شدهٔ آن زمان است. کاوندیش همچنین دریافت که احتراق این گاز در حضور هوا یا اکسیژن به تشکیل آب منجر می‌شود.

این کشف اهمیت زیادی داشت؛ زیرا در آن دوران هنوز آب در میان برخی دانشمندان به‌عنوان یک عنصر در نظر گرفته می‌شد.

### ۲.۲. نام‌گذاری توسط لاوازیه

آنتوان لاوازیه، شیمیدان فرانسوی، با انجام پژوهش‌های بیشتر دربارهٔ ترکیب آب، نشان داد که آب از هیدروژن و اکسیژن تشکیل شده است. او نام Hydrogen را برای این عنصر انتخاب کرد؛ نامی که به معنای «آب‌ساز» است.

### ۲.۳. کشف دوتریم

در سال ۱۹۳۱، هارولد یوری و همکارانش موفق شدند نوع سنگین‌تری از هیدروژن را شناسایی کنند که هستهٔ آن علاوه بر یک پروتون، یک نوترون نیز داشت. این ایزوتوپ دوتریم نام گرفت و کشف آن گامی مهم در توسعهٔ پژوهش‌های هسته‌ای و شناخت ایزوتوپ‌ها بود.

منبع: [Royal Society of Chemistry – Hydrogen History](https://periodic-table.rsc.org/element/1/Hydrogen).

## ۳. ساختار اتمی و ویژگی‌های کوانتومی

### ۳.۱. ساختار اتم هیدروژن

اتم معمولی هیدروژن، که ایزوتوپ پروتیوم نام دارد، ساده‌ترین ساختار اتمی را دارد. هستهٔ آن تنها از یک پروتون تشکیل شده و یک الکترون در اطراف هسته قرار دارد.

از آنجا که تعداد پروتون‌های هسته و الکترون‌های اتم خنثی برابر است، بار الکتریکی کل اتم صفر خواهد بود.

| ذره | تعداد در اتم معمولی هیدروژن | بار الکتریکی |
|---|---:|---|
| پروتون | ۱ | مثبت |
| نوترون | ۰ | خنثی |
| الکترون | ۱ | منفی |

### ۳.۲. آرایش الکترونی

عدد اتمی هیدروژن برابر با یک است؛ بنابراین اتم خنثی آن تنها یک الکترون دارد. این الکترون در حالت پایه در اوربیتال $1s$ قرار می‌گیرد.

آرایش الکترونی هیدروژن به‌صورت زیر است:

$$1s^1$$

اوربیتال $1s$ نخستین و کم‌انرژی‌ترین اوربیتال اتمی است. هیدروژن تنها یک الکترون دارد و از این جهت با عناصر قلیایی گروه اول شباهت پیدا می‌کند.

### ۳.۳. انرژی یونش

انرژی یونش نخست هیدروژن، انرژی لازم برای جداکردن الکترون از اتم خنثی آن در حالت پایه است. مقدار این انرژی تقریباً برابر با $13.5984$ الکترون‌ولت است.

فرایند یونش به شکل زیر نوشته می‌شود:

$$\\mathrm{H \\rightarrow H^+ + e^-}$$

یون حاصل، یعنی $\\mathrm{H^+}$، در واقع یک پروتون است؛ زیرا هستهٔ معمولی هیدروژن تنها یک پروتون دارد.

### ۳.۴. اسپین و ماهیت کوانتومی

الکترون هیدروژن دارای عدد کوانتومی اسپین $\\frac{1}{2}$ است. همچنین پروتون هستهٔ آن نیز اسپین هسته‌ای $\\frac{1}{2}$ دارد.

برهم‌کنش الکترون و پروتون موجب ایجاد ساختار فوق‌ریز (Hyperfine Structure) در ترازهای انرژی اتم هیدروژن می‌شود. یکی از گذارهای فوق‌ریز شناخته‌شدهٔ هیدروژن، تابش رادیویی با طول موج حدود ۲۱ سانتی‌متر است که در اخترشناسی رادیویی برای مطالعهٔ گاز هیدروژن میان‌ستاره‌ای اهمیت بسیار زیادی دارد.

### ۳.۵. طیف اتمی هیدروژن

اتم هیدروژن تنها یک الکترون دارد؛ با این حال، ترازهای انرژی آن به‌صورت گسسته تعریف می‌شوند. هنگامی که الکترون از یک تراز انرژی بالاتر به تراز پایین‌تر منتقل می‌شود، فوتونی با انرژی مشخص گسیل می‌شود.

رابطهٔ انرژی فوتون گسیل‌شده یا جذب‌شده چنین است:

$$\\Delta E = E_2-E_1 = h\\nu$$

در این رابطه:

- $\\Delta E$ اختلاف انرژی دو تراز است.
- $h$ ثابت پلانک است.
- $\\nu$ بسامد تابش الکترومغناطیسی است.

طیف اتم هیدروژن شامل چندین سری طیفی مهم است:

- **سری لایمن:** گذارهای الکترونی به تراز نخست؛ تابش‌های این سری عمدتاً در ناحیهٔ فرابنفش قرار دارند.
- **سری بالمر:** گذارهای الکترونی به تراز دوم؛ برخی از خطوط این سری در ناحیهٔ مرئی طیف قرار دارند.
- **سری پاشن:** گذارهای الکترونی به تراز سوم؛ خطوط آن در ناحیهٔ فروسرخ قرار دارند.

خطوط طیفی هیدروژن در اخترفیزیک بسیار مهم هستند؛ زیرا دانشمندان با بررسی آن‌ها می‌توانند اطلاعاتی دربارهٔ دما، ترکیب شیمیایی، حرکت و شرایط فیزیکی اجرام آسمانی به دست آورند.

منابع: [NIST Atomic Spectra Database](https://physics.nist.gov/asd) و [NIST Atomic Data for Hydrogen](https://physics.nist.gov/cgi-bin/Ionization/atom.php?element=H).

## ۴. جایگاه هیدروژن در جدول تناوبی

هیدروژن در گروه نخست و دورهٔ نخست جدول تناوبی قرار دارد و به بلوک s تعلق دارد؛ اما برخلاف فلزات قلیایی، یک نافلز است.

قرارگیری هیدروژن در بالای گروه اول بیشتر به دلیل آرایش الکترونی $1s^1$ آن است. این آرایش نشان می‌دهد که هیدروژن یک الکترون در لایهٔ ظرفیت خود دارد و می‌تواند در بسیاری از ترکیبات، یون مثبت تشکیل دهد.

با این حال، هیدروژن ویژگی‌هایی دارد که آن را از فلزات قلیایی متمایز می‌کند:

۱. در شرایط معمول گاز است.

۲. نافلز است و رسانایی الکتریکی و فلزی معمول عناصر قلیایی را ندارد.

۳. می‌تواند علاوه بر حالت اکسایش $+1$، حالت اکسایش $-1$ نیز داشته باشد.

۴. در بسیاری از ترکیبات پیوند کووالانسی تشکیل می‌دهد.

هیدروژن از برخی جهات به هالوژن‌ها نیز شباهت دارد؛ زیرا برای تکمیل لایهٔ اول الکترونی خود تنها به یک الکترون دیگر نیاز دارد. بنابراین جایگاه آن در جدول تناوبی از نظر شیمیایی تا اندازه‌ای منحصربه‌فرد است.

## ۵. خواص فیزیکی هیدروژن

### ۵.۱. حالت فیزیکی و ظاهر

هیدروژن در دما و فشار معمول، گازی بی‌رنگ، بی‌بو و بی‌مزه است. این گاز کمترین چگالی را در میان گازهای عناصر شیمیایی دارد.

چگالی هیدروژن مولکولی در دمای اتاق و فشار یک اتمسفر تقریباً برابر با $0.084\\,\\mathrm{kg/m^3}$ است؛ در حالی که چگالی هوا در همین شرایط حدود $1.2\\,\\mathrm{kg/m^3}$ است. به همین علت، هیدروژن به‌طور قابل‌توجهی از هوا سبک‌تر است.

### ۵.۲. نقطهٔ ذوب و جوش

هیدروژن در دماهای بسیار پایین به مایع و سپس جامد تبدیل می‌شود.

| ویژگی | مقدار تقریبی |
|---|---:|
| نقطهٔ ذوب هیدروژن معمولی | $13.99\\,\\mathrm{K}$ |
| نقطهٔ جوش هیدروژن معمولی | $20.37\\,\\mathrm{K}$ |
| دمای بحرانی | $33.145\\,\\mathrm{K}$ |
| فشار بحرانی | $1.2964\\,\\mathrm{MPa}$ |

دمای بحرانی، بالاترین دمایی است که در آن می‌توان گاز را صرفاً با افزایش فشار به مایع تبدیل کرد. بالاتر از این دما، مرز مشخصی میان فاز مایع و گاز وجود ندارد.

نکتهٔ قابل‌توجه آن است که مقدار نقطهٔ جوش هیدروژن به ترکیب دو شکل اسپینی آن، یعنی ارتوهیدروژن و پاراهیدروژن، وابسته است. به همین دلیل ممکن است در منابع مختلف، مقادیر اندکی متفاوت مشاهده شود.

منابع: [RSC](https://periodic-table.rsc.org/element/1/Hydrogen) و [NIST – Hydrogen Thermophysical Properties](https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=832374).

### ۵.۳. مایع‌سازی هیدروژن

برای تبدیل هیدروژن گازی به مایع، باید دمای آن تا نزدیکی نقطهٔ جوش بسیار پایینش کاهش یابد. هیدروژن مایع به دلیل چگالی بیشتر نسبت به گاز، در برخی سامانه‌های ذخیره‌سازی انرژی و کاربردهای فضایی استفاده می‌شود.

مایع‌سازی هیدروژن یک فرایند مهندسی پیچیده است؛ زیرا دمای بسیار پایین موردنیاز، عایق‌کاری حرارتی دقیق و مدیریت تغییرات حالت ماده را ضروری می‌کند.

### ۵.۴. ارتوهیدروژن و پاراهیدروژن

مولکول $\\mathrm{H_2}$ دو پروتون دارد. جهت‌گیری نسبی اسپین هسته‌ای این دو پروتون موجب پدیدآمدن دو شکل اسپینی از مولکول هیدروژن می‌شود:

- **ارتوهیدروژن (Ortho-hydrogen):** اسپین‌های هسته‌ای دو پروتون هم‌جهت‌اند.
- **پاراهیدروژن (Para-hydrogen):** اسپین‌های هسته‌ای دو پروتون خلاف‌جهت‌اند.

در دمای اتاق، هیدروژن معمولی تقریباً شامل ۷۵ درصد ارتوهیدروژن و ۲۵ درصد پاراهیدروژن است. با کاهش دما، سهم پاراهیدروژن در حالت تعادل افزایش می‌یابد.

این تفاوت از نظر مهندسی اهمیت دارد؛ زیرا تبدیل ارتوهیدروژن به پاراهیدروژن فرایندی همراه با آزادشدن انرژی است و در ذخیره‌سازی هیدروژن مایع باید مورد توجه قرار گیرد.

منبع: [NIST Technical Note 2126](https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=935736).

## ۶. خواص شیمیایی هیدروژن

### ۶.۱. پیوند شیمیایی در مولکول هیدروژن

دو اتم هیدروژن در مولکول $\\mathrm{H_2}$ با اشتراک‌گذاری یک جفت الکترون، پیوند کووالانسی ساده تشکیل می‌دهند.

$$\\mathrm{H + H \\rightarrow H_2}$$

این پیوند از نوع سیگما و حاصل هم‌پوشانی اوربیتال‌های $1s$ دو اتم است. انرژی پیوند هیدروژن-هیدروژن تقریباً $436\\,\\mathrm{kJ/mol}$ است؛ ازاین‌رو شکستن آن به انرژی نیاز دارد.

### ۶.۲. واکنش با اکسیژن و احتراق

یکی از شناخته‌شده‌ترین واکنش‌های هیدروژن، واکنش آن با اکسیژن است. در این واکنش آب تشکیل می‌شود و مقدار قابل‌توجهی انرژی آزاد می‌گردد.

$$\\mathrm{2H_2 + O_2 \\rightarrow 2H_2O}$$

این واکنش گرمازا است؛ یعنی انرژی محصولات از انرژی واکنش‌دهنده‌ها کمتر است و اختلاف انرژی به شکل گرما و در شرایط مناسب نور آزاد می‌شود.

در صورت استفاده از هوای معمولی به جای اکسیژن خالص، ممکن است در دماهای بالا اکسیدهای نیتروژن نیز تشکیل شوند؛ بنابراین نباید تصور کرد که احتراق هیدروژن در تمام شرایط هیچ آلاینده‌ای تولید نمی‌کند.

### ۶.۳. عدد اکسایش هیدروژن

هیدروژن در ترکیبات مختلف می‌تواند دو عدد اکسایش رایج داشته باشد:

- عدد اکسایش $+1$ در بیشتر ترکیبات با نافلزها؛ مانند آب و آمونیاک.
- عدد اکسایش $-1$ در برخی هیدریدهای فلزی؛ مانند هیدرید سدیم.

در مولکول آزاد $\\mathrm{H_2}$ نیز عدد اکسایش هیدروژن صفر است.

### ۶.۴. واکنش با هالوژن‌ها

هیدروژن می‌تواند با هالوژن‌ها ترکیبات دوتایی تشکیل دهد. برای نمونه، واکنش هیدروژن با کلر منجر به تشکیل هیدروژن کلرید می‌شود:

$$\\mathrm{H_2 + Cl_2 \\rightarrow 2HCl}$$

هیدروژن کلرید در آب حل شده و محلولی اسیدی به نام اسید هیدروکلریک تشکیل می‌دهد.

### ۶.۵. تشکیل هیدریدها

هیدریدها ترکیباتی هستند که در آن‌ها هیدروژن با عنصر یا عناصر دیگر پیوند دارد. این ترکیبات از نظر نوع پیوند و خواص شیمیایی بسیار متنوع‌اند.

سه گروه کلی از هیدریدها عبارت‌اند از:

۱. **هیدریدهای یونی:** مانند $\\mathrm{NaH}$ که در آن‌ها هیدروژن به شکل یون هیدرید $\\mathrm{H^-}$ حضور دارد.

۲. **هیدریدهای کووالانسی:** مانند $\\mathrm{CH_4}$، $\\mathrm{NH_3}$ و $\\mathrm{H_2O}$ که در آن‌ها هیدروژن با اتم‌های دیگر پیوند کووالانسی تشکیل می‌دهد.

۳. **هیدریدهای فلزی یا بین‌نشینی:** در برخی از آن‌ها اتم‌های هیدروژن در جایگاه‌های میان‌نشینی شبکهٔ بلوری فلزات قرار می‌گیرند.

### ۶.۶. پیوند هیدروژنی

پیوند هیدروژنی نوعی برهم‌کنش بین‌مولکولی یا درون‌مولکولی است که معمولاً هنگامی اهمیت پیدا می‌کند که اتم هیدروژن به اتمی با الکترونگاتیویتهٔ زیاد، مانند اکسیژن، نیتروژن یا فلوئور، متصل شده باشد.

این برهم‌کنش در بسیاری از خواص مواد و مولکول‌های زیستی نقش اساسی دارد؛ از جمله:

- ویژگی‌های غیرمعمول آب؛
- پایداری ساختارهای پروتئینی؛
- اتصال دو رشتهٔ مولکول دنا؛
- ساختار و خواص بسیاری از ترکیبات زیستی.

بنابراین، هیدروژن تنها یک مادهٔ سوختی نیست؛ بلکه یکی از عناصر اصلی تعیین‌کنندهٔ ساختار مولکول‌های زیستی نیز محسوب می‌شود.

## ۷. ایزوتوپ‌های هیدروژن

ایزوتوپ‌ها اتم‌های یک عنصر هستند که تعداد پروتون‌های برابر، اما تعداد نوترون‌های متفاوت دارند. هیدروژن سه ایزوتوپ شناخته‌شده و مهم دارد.

### ۷.۱. پروتیوم (Protium)

پروتیوم با نماد $^{1}\\mathrm{H}$ فراوان‌ترین ایزوتوپ هیدروژن است. هستهٔ آن تنها یک پروتون دارد و هیچ نوترونی در آن وجود ندارد.

بیش از ۹۹٫۹ درصد هیدروژن طبیعی از این ایزوتوپ تشکیل شده است.

### ۷.۲. دوتریم (Deuterium)

دوتریم با نماد $^{2}\\mathrm{H}$ یا $\\mathrm{D}$ شناخته می‌شود. هستهٔ آن از یک پروتون و یک نوترون تشکیل شده است.

جرم آن تقریباً دو برابر جرم پروتیوم است و برخلاف پروتیوم، در هستهٔ خود نوترون دارد.

دوتریم در پژوهش‌های هسته‌ای، مطالعات واکنش‌های شیمیایی و به‌عنوان یکی از سوخت‌های بالقوهٔ همجوشی هسته‌ای اهمیت دارد. آب سنگین نیز آبی است که در آن بخشی یا تمام اتم‌های هیدروژن معمولی با دوتریم جایگزین شده‌اند.

### ۷.۳. تریتیوم (Tritium)

تریتیوم با نماد $^{3}\\mathrm{H}$ یا $\\mathrm{T}$ شناخته می‌شود. هستهٔ آن از یک پروتون و دو نوترون تشکیل شده است.

تریتیوم برخلاف دو ایزوتوپ دیگر پرتوزاست و با واپاشی بتای منفی به هلیوم-۳ تبدیل می‌شود.

$$^{3}_{1}\\mathrm{H} \\rightarrow ^{3}_{2}\\mathrm{He} + ^{0}_{-1}\\mathrm{e} + \\bar{\\nu}_e$$

نیمه‌عمر تریتیوم حدود ۱۲٫۳۲ سال است؛ یعنی پس از این مدت، تقریباً نیمی از تعداد هسته‌های پرتوزای اولیهٔ آن واپاشی می‌کنند.

### ۷.۴. مقایسهٔ ایزوتوپ‌ها

| ویژگی | پروتیوم | دوتریم | تریتیوم |
|---|---:|---:|---:|
| نماد | $^{1}\\mathrm{H}$ | $^{2}\\mathrm{H}$ یا $\\mathrm{D}$ | $^{3}\\mathrm{H}$ یا $\\mathrm{T}$ |
| تعداد پروتون | ۱ | ۱ | ۱ |
| تعداد نوترون | ۰ | ۱ | ۲ |
| عدد جرمی | ۱ | ۲ | ۳ |
| پایداری هسته‌ای | پایدار | پایدار | پرتوزا |
| فراوانی طبیعی | بسیار زیاد | بسیار کم | بسیار ناچیز |
| نیمه‌عمر | پایدار | پایدار | حدود ۱۲٫۳۲ سال |

منابع: [NIST – Isotopic Compositions of Hydrogen](https://physics.nist.gov/cgi-bin/Compositions/stand_alone.pl?ascii=ascii&ele=H) و [آژانس بین‌المللی انرژی اتمی (IAEA)](https://www.iaea.org/).

## ۸. فراوانی و منشأ کیهانی هیدروژن

### ۸.۱. هیدروژن در جهان اولیه

هیدروژن از نخستین عناصر تشکیل‌شده در تاریخ کیهان است. در دقایق نخست پس از مهبانگ (Big Bang)، شرایط دما و چگالی جهان به‌گونه‌ای بود که واکنش‌های هسته‌ای اولیه توانستند هسته‌های عناصر سبک، به‌ویژه هیدروژن و هلیوم، را تولید کنند.

این فرایند که هسته‌زایی مهبانگ (Big Bang Nucleosynthesis) نام دارد، منشأ بخش عمدهٔ هسته‌های هیدروژن، هلیوم و مقدار اندکی از برخی عناصر سبک دیگر است.

پس از انبساط و سردشدن بیشتر جهان، حدود ۳۸۰ هزار سال پس از مهبانگ، الکترون‌ها توانستند با هسته‌ها ترکیب شوند و اتم‌های خنثی پایدار تشکیل دهند. بخش بزرگی از مادهٔ معمولی جهان در نهایت به شکل هیدروژن و هلیوم باقی ماند.

### ۸.۲. فراوان‌ترین عنصر جهان

هیدروژن فراوان‌ترین عنصر کیهان است و تقریباً ۷۵ درصد جرم مادهٔ معمولی جهان را تشکیل می‌دهد. هلیوم حدود یک‌چهارم جرم مادهٔ معمولی را شامل می‌شود و سهم عناصر سنگین‌تر بسیار کمتر است.

این فراوانی به آن معناست که هیدروژن در ساختار ستارگان، سحابی‌ها، ابرهای میان‌ستاره‌ای و بسیاری از اجرام کیهانی حضور گسترده‌ای دارد.

### ۸.۳. هیدروژن در ستارگان

هیدروژن سوخت اصلی بسیاری از ستارگان است. در بخش مرکزی ستاره‌ها، دما و فشار بسیار زیاد می‌تواند شرایط لازم برای همجوشی هسته‌های هیدروژن و تشکیل هسته‌های هلیوم را فراهم کند.

در ستارگانی مانند خورشید، زنجیرهٔ پروتون-پروتون (Proton-Proton Chain) از مهم‌ترین مسیرهای تولید انرژی است.

به‌طور کلی، واکنش خالص این زنجیره را می‌توان چنین نمایش داد:

$$4\\ ^{1}_{1}\\mathrm{H} \\rightarrow ^{4}_{2}\\mathrm{He} + 2\\mathrm{e^+} + 2\\nu_e + \\text{energy}$$

در این واکنش، چهار هستهٔ هیدروژن در نهایت به یک هستهٔ هلیوم-۴ تبدیل می‌شوند. جرم محصولات اندکی کمتر از جرم اولیهٔ واکنش‌دهنده‌ها است و اختلاف جرم به انرژی تبدیل می‌شود.

این انرژی منبع اصلی تابش ستارگان رشتهٔ اصلی، از جمله خورشید، است.

منبع: [NASA – Evolution of Elemental Composition of the Universe](https://imagine.gsfc.nasa.gov/science/questions/composition.html).

## ۹. هیدروژن در زمین و طبیعت

### ۹.۱. هیدروژن آزاد و ترکیبی

اگرچه هیدروژن فراوان‌ترین عنصر جهان است، در سطح زمین معمولاً به شکل آزاد و مولکولی فراوان نیست. علت اصلی این موضوع واکنش‌پذیری آن، تشکیل ترکیبات پایدار و جرم بسیار کم آن است.

هیدروژن در زمین عمدتاً به شکل ترکیبی یافت می‌شود؛ مانند:

- آب در اقیانوس‌ها، دریاها، رودخانه‌ها و یخچال‌ها؛
- هیدروکربن‌ها و سوخت‌های فسیلی؛
- مواد آلی موجود در گیاهان، جانوران و میکروارگانیسم‌ها؛
- کانی‌ها و برخی ترکیبات معدنی.

### ۹.۲. حضور در جو زمین

مقدار هیدروژن مولکولی آزاد در جو زمین بسیار ناچیز است. به دلیل جرم مولکولی کم، بخشی از هیدروژن موجود در لایه‌های بالایی جو می‌تواند در گذر زمان از میدان گرانشی زمین بگریزد.

### ۹.۳. تولید طبیعی هیدروژن

هیدروژن طبیعی می‌تواند از راه فرایندهای مختلف زمین‌شناختی و شیمیایی تولید شود؛ از جمله:

- واکنش آب با برخی سنگ‌ها و کانی‌های غنی از آهن؛
- فعالیت‌های زمین‌گرمایی و فرایندهای آب‌گرمایی؛
- برخی واکنش‌های شیمیایی در پوستهٔ زمین؛
- فعالیت میکروارگانیسم‌ها و فرایندهای زیستی.

هیدروژن زمین‌زاد (Geologic Hydrogen) در سال‌های اخیر به موضوعی پژوهشی تبدیل شده است؛ زیرا امکان دارد در برخی مناطق زمین منابع طبیعی قابل‌توجهی از آن وجود داشته باشد. بااین‌حال، میزان ذخایر قابل‌بهره‌برداری، روش‌های اکتشاف و پایداری استخراج آن همچنان نیازمند بررسی‌های دقیق علمی و اقتصادی است.

---

## ۱۰. روش‌های تولید صنعتی هیدروژن

هیدروژن یکی از عناصر فراوان طبیعت است، اما برای استفادهٔ صنعتی معمولاً باید آن را از ترکیباتی مانند آب، گاز طبیعی یا سایر مواد هیدروژن‌دار جدا کرد.

روش تولید هیدروژن تأثیر مستقیمی بر هزینه، مصرف انرژی و میزان انتشار گازهای گلخانه‌ای دارد.

### ۱۰.۱. اصلاح بخار متان (Steam Methane Reforming)

اصلاح بخار متان یکی از رایج‌ترین روش‌های صنعتی تولید هیدروژن است. در این فرایند، متان موجود در گاز طبیعی با بخار آب در دمای بالا و در حضور کاتالیزگر واکنش می‌دهد.

واکنش اصلی:

$$\\mathrm{CH_4 + H_2O + heat \\rightarrow CO + 3H_2}$$

سپس مونوکسید کربن با بخار آب واکنش می‌دهد و هیدروژن بیشتری تولید می‌کند:

$$\\mathrm{CO + H_2O \\rightarrow CO_2 + H_2}$$

در نتیجهٔ ترکیب این دو واکنش، واکنش کلی به شکل زیر خواهد بود:

$$\\mathrm{CH_4 + 2H_2O \\rightarrow CO_2 + 4H_2}$$

یکی از چالش‌های مهم این روش، تولید دی‌اکسید کربن است. اگر کربن‌دی‌اکسید حاصل و انتشارهای زنجیرهٔ تأمین گاز طبیعی مدیریت نشوند، این روش می‌تواند آثار زیست‌محیطی قابل‌توجهی داشته باشد.

### ۱۰.۲. الکترولیز آب (Water Electrolysis)

در الکترولیز، با استفاده از انرژی الکتریکی، مولکول‌های آب به هیدروژن و اکسیژن تجزیه می‌شوند.

$$\\mathrm{2H_2O \\rightarrow 2H_2 + O_2}$$

الکترولیز در دستگاهی به نام الکترولایزر انجام می‌شود. این دستگاه دارای دو الکترود آند و کاتد و یک الکترولیت یا غشای جداکننده است.

فناوری‌های اصلی الکترولیز عبارت‌اند از:

- الکترولیز قلیایی؛
- الکترولیز غشای تبادل پروتون (PEM)؛
- الکترولیز اکسید جامد (SOEC)؛
- الکترولیز غشای تبادل آنیون (AEM).

مزیت مهم الکترولیز این است که می‌توان انرژی موردنیاز آن را از منابع تجدیدپذیر مانند انرژی خورشیدی و بادی تأمین کرد. البته پاک‌بودن واقعی هیدروژن تولیدشده به منبع برق، ساخت تجهیزات، مصرف آب و کل چرخهٔ عمر سامانه وابسته است.

### ۱۰.۳. گازی‌سازی زغال‌سنگ و زیست‌توده

در روش گازی‌سازی، مواد کربن‌دار در شرایط کنترل‌شده به مخلوطی از گازها، از جمله هیدروژن و مونوکسید کربن، تبدیل می‌شوند.

این روش می‌تواند از زغال‌سنگ یا زیست‌توده به‌عنوان مادهٔ اولیه استفاده کند. میزان انتشار آلاینده‌ها به نوع مادهٔ اولیه و فناوری‌های کنترل انتشار بستگی دارد.

### ۱۰.۴. پیرولیز متان

در پیرولیز متان، متان بدون حضور اکسیژن به هیدروژن و کربن جامد تجزیه می‌شود:

$$\\mathrm{CH_4 \\rightarrow C + 2H_2}$$

این فناوری می‌تواند از تولید مستقیم دی‌اکسید کربن در واکنش اصلی جلوگیری کند؛ اما پیامد زیست‌محیطی آن به منبع انرژی فرایند، نوع کربن تولیدشده و نحوهٔ مدیریت آن وابسته است.

### ۱۰.۵. روش‌های زیستی و فوتوشیمیایی

برخی میکروارگانیسم‌ها می‌توانند در شرایط مشخص هیدروژن تولید کنند. همچنین پژوهش‌هایی دربارهٔ استفاده از نور خورشید و سامانه‌های فوتوالکتروشیمیایی برای تجزیهٔ آب در حال انجام است.

این روش‌ها از نظر علمی جذاب‌اند، اما برای بسیاری از آن‌ها هنوز چالش‌هایی در زمینهٔ بازده، پایداری، هزینه و مقیاس‌پذیری وجود دارد.

منابع: [وزارت انرژی آمریکا – Electrolysis](https://www.energy.gov/cmei/fuels/hydrogen-production-electrolysis) و [وزارت انرژی آمریکا – Natural Gas Reforming](https://www.energy.gov/cmei/fuels/hydrogen-production-natural-gas-reforming).

## ۱۱. دسته‌بندی هیدروژن بر اساس روش تولید

در صنعت انرژی، برای توصیف مسیرهای مختلف تولید هیدروژن از اصطلاحاتی مانند هیدروژن خاکستری، آبی و سبز استفاده می‌شود. این نام‌ها بیانگر رنگ واقعی گاز نیستند؛ بلکه به روش تولید و پیامدهای زیست‌محیطی آن اشاره دارند.

| اصطلاح | روش تولید | ویژگی اصلی |
|---|---|---|
| هیدروژن خاکستری | سوخت‌های فسیلی، معمولاً بدون جذب کربن | همراه با انتشار قابل‌توجه دی‌اکسید کربن |
| هیدروژن آبی | سوخت‌های فسیلی همراه با جذب و ذخیره‌سازی بخشی از کربن | انتشار کمتر از مسیر بدون جذب، اما نه لزوماً صفر |
| هیدروژن سبز | الکترولیز آب با برق تجدیدپذیر | انتشار عملیاتی کم در تولید |
| هیدروژن صورتی | الکترولیز با برق هسته‌ای | وابسته به چرخهٔ عمر و منبع انرژی هسته‌ای |
| هیدروژن فیروزه‌ای | پیرولیز متان و تولید کربن جامد | وابسته به انرژی مصرفی و مدیریت کربن جامد |

نکتهٔ مهم آن است که دسته‌بندی رنگی در همهٔ کشورها تعریف قانونی و یکسانی ندارد. برای مقایسهٔ دقیق مسیرهای تولید، بهتر است شدت انتشار گازهای گلخانه‌ای در کل چرخهٔ عمر محاسبه شود.

## ۱۲. کاربردهای هیدروژن

هیدروژن به دلیل ویژگی‌های شیمیایی و فیزیکی خاص خود، کاربردهای گسترده‌ای در صنعت، انرژی، حمل‌ونقل، پژوهش‌های علمی و فناوری فضایی دارد.

### ۱۲.۱. تولید آمونیاک

یکی از مهم‌ترین کاربردهای صنعتی هیدروژن، تولید آمونیاک است. آمونیاک مادهٔ اولیهٔ بسیاری از کودهای شیمیایی و ترکیبات نیتروژن‌دار محسوب می‌شود.

در فرایند هابر–بوش، هیدروژن با نیتروژن واکنش می‌دهد:

$$\\mathrm{N_2 + 3H_2 \\rightleftharpoons 2NH_3}$$

این فرایند نقشی اساسی در تأمین کودهای شیمیایی و در نتیجه تولید محصولات کشاورزی در جهان دارد.

### ۱۲.۲. صنایع نفت و پالایشگاه‌ها

هیدروژن در پالایش نفت برای انجام فرایندهایی مانند هیدروگوگردزدایی (Hydrodesulfurization) و هیدروکراکینگ استفاده می‌شود.

در این فرایندها، ترکیبات گوگرددار و برخی مولکول‌های سنگین هیدروکربنی تغییر می‌کنند تا سوخت‌هایی با ویژگی‌های مطلوب‌تر تولید شوند.

### ۱۲.۳. تولید متانول و مواد شیمیایی

هیدروژن یکی از مواد اولیهٔ مهم در تولید متانول و برخی ترکیبات شیمیایی دیگر است.

برای نمونه، واکنش مونوکسید کربن و هیدروژن می‌تواند به تولید متانول منجر شود:

$$\\mathrm{CO + 2H_2 \\rightarrow CH_3OH}$$

متانول در تولید مواد شیمیایی، حلال‌ها و برخی سوخت‌ها کاربرد دارد.

### ۱۲.۴. صنایع غذایی

در برخی فرایندهای صنعتی، هیدروژن برای هیدروژنه‌کردن روغن‌های گیاهی به کار می‌رود. این فرایند می‌تواند میزان غیراشباع‌بودن چربی‌ها را تغییر دهد و ویژگی‌های فیزیکی آن‌ها را دگرگون کند.

### ۱۲.۵. صنایع الکترونیک و نیمه‌رساناها

هیدروژن در برخی مراحل ساخت قطعات الکترونیکی و نیمه‌رساناها کاربرد دارد. از آن برای ایجاد محیط‌های فرایندی خاص، کاهش برخی اکسیدها و کنترل واکنش‌های شیمیایی سطحی استفاده می‌شود.

### ۱۲.۶. صنایع فلزی و فولادسازی

یکی از کاربردهای مورد توجه هیدروژن، استفاده از آن به‌عنوان عامل کاهنده در تولید آهن از سنگ‌آهن است.

در مسیرهای مبتنی بر احیای مستقیم با هیدروژن، می‌توان به جای کربن مونوکسید، از هیدروژن برای جداکردن اکسیژن از اکسیدهای آهن استفاده کرد. در واکنش ایدئال، آب محصول اصلی واکنش است.

این فناوری می‌تواند به کاهش انتشار کربن در صنعت فولاد کمک کند؛ البته میزان کاهش واقعی به شیوهٔ تولید هیدروژن و انرژی مصرفی کارخانه بستگی دارد.

### ۱۲.۷. بالن‌ها و وسایل پروازی

چگالی بسیار کم هیدروژن باعث شده است که در گذشته برای پرکردن بالن‌ها و کشتی‌های هوایی از آن استفاده شود. بااین‌حال، به دلیل اشتعال‌پذیری زیاد، استفاده از هیدروژن در بسیاری از کاربردهای پروازی با خطرهای جدی همراه است و امروزه گاز هلیوم برای برخی از این کاربردها ترجیح داده می‌شود.

### ۱۲.۸. فناوری فضایی

هیدروژن مایع در برخی موتورهای موشکی به‌عنوان سوخت و اکسیژن مایع به‌عنوان اکسیدکننده استفاده می‌شوند. واکنش این دو ماده انرژی بسیار زیادی آزاد می‌کند.

به دلیل چگالی کم هیدروژن، ذخیره‌سازی آن در مخازن فضایی به طراحی ویژه و عایق‌کاری حرارتی نیاز دارد.

### ۱۲.۹. کاربرد در پژوهش‌های هسته‌ای

ایزوتوپ‌های هیدروژن، به‌ویژه دوتریم و تریتیوم، در پژوهش‌های همجوشی هسته‌ای اهمیت فراوانی دارند. این دو ایزوتوپ از سوخت‌های مورد مطالعه برای راکتورهای آزمایشی همجوشی هستند.

---

## ۱۳. هیدروژن به‌عنوان حامل و ذخیره‌ساز انرژی

هیدروژن در بسیاری از پژوهش‌های جدید انرژی، نه به‌عنوان یک منبع اولیهٔ انرژی، بلکه به‌عنوان یک **حامل انرژی** مطرح است.

منابع اولیهٔ انرژی مانند خورشید، باد، زغال‌سنگ، گاز طبیعی و انرژی هسته‌ای می‌توانند برای تولید هیدروژن به کار روند. سپس هیدروژن تولیدشده در مکان یا زمان دیگری مصرف شود.

### ۱۳.۱. چگالی انرژی

هیدروژن از نظر انرژی قابل‌دسترس به ازای هر واحد جرم، مقدار بسیار زیادی انرژی دارد. ارزش حرارتی پایین آن تقریباً $120\\,\\mathrm{MJ/kg}$ است.

بااین‌حال، چگالی حجمی هیدروژن گازی بسیار کم است. بنابراین برای ذخیره‌سازی مقدار زیادی انرژی در حجم محدود، باید هیدروژن فشرده، مایع یا به شکل حامل‌های شیمیایی ذخیره شود.

### ۱۳.۲. روش‌های ذخیره‌سازی

روش‌های کلی ذخیره‌سازی هیدروژن عبارت‌اند از:

- **ذخیره‌سازی گازی فشرده:** هیدروژن در مخازن ویژه و تحت فشار بالا نگهداری می‌شود.
- **ذخیره‌سازی مایع:** هیدروژن در دمای بسیار پایین، نزدیک به نقطهٔ جوش خود، مایع می‌شود.
- **ذخیره‌سازی در مواد جامد:** برخی مواد مانند هیدریدهای فلزی قادرند هیدروژن را در ساختار خود جذب یا آزاد کنند.
- **حامل‌های شیمیایی:** موادی مانند آمونیاک و برخی مایعات آلی می‌توانند در زنجیره‌های انتقال و ذخیره‌سازی هیدروژن نقش داشته باشند.

هر یک از این روش‌ها مزایا و محدودیت‌های خاص خود را دارند و انتخاب روش مناسب به هزینه، ایمنی، ظرفیت ذخیره‌سازی، سرعت انتقال و کاربرد نهایی وابسته است.

---

## ۱۴. پیل سوختی هیدروژنی

پیل سوختی (Fuel Cell) دستگاهی الکتروشیمیایی است که انرژی شیمیایی یک سوخت را مستقیماً به انرژی الکتریکی تبدیل می‌کند.

در پیل سوختی هیدروژنی، هیدروژن در آند و اکسیژن در کاتد شرکت می‌کنند. در یک پیل سوختی با غشای تبادل پروتون، واکنش‌های اصلی چنین‌اند:

واکنش آند:

$$\\mathrm{H_2 \\rightarrow 2H^+ + 2e^-}$$

واکنش کاتد:

$$\\mathrm{\\frac{1}{2}O_2 + 2H^+ + 2e^- \\rightarrow H_2O}$$

واکنش کلی:

$$\\mathrm{H_2 + \\frac{1}{2}O_2 \\rightarrow H_2O}$$

الکترون‌ها از مسیر مدار خارجی عبور می‌کنند و جریان الکتریکی به وجود می‌آورند؛ درحالی‌که پروتون‌ها از غشای الکترولیت عبور می‌کنند و در کاتد با اکسیژن ترکیب می‌شوند.

### مزایای پیل سوختی

۱. تبدیل مستقیم انرژی شیمیایی به انرژی الکتریکی؛

۲. بازده بالقوهٔ بیشتر نسبت به بسیاری از سامانه‌های احتراق؛

۳. تولید آب و گرما در محل استفاده، در صورت مصرف هیدروژن خالص؛

۴. امکان استفاده در خودروها، سامانه‌های برق پشتیبان و کاربردهای صنعتی.

### محدودیت‌های پیل سوختی

۱. هزینهٔ تولید و ساخت برخی اجزای پیل؛

۲. نیاز به زیرساخت تأمین و توزیع هیدروژن؛

۳. دشواری ذخیره‌سازی و حمل‌ونقل؛

۴. وابستگی اثر زیست‌محیطی به روش تولید هیدروژن.

منبع: [وزارت انرژی آمریکا – Fuel Cell Animation](https://www.energy.gov/cmei/fuels/fuel-cell-animation-text-version).

## ۱۵. هیدروژن و همجوشی هسته‌ای

همجوشی هسته‌ای فرایندی است که در آن هسته‌های سبک با یکدیگر ترکیب می‌شوند و هسته‌ای سنگین‌تر تشکیل می‌دهند. در این فرایند، بخشی از جرم اولیه به انرژی تبدیل می‌شود.

همجوشی هسته‌های هیدروژن و ایزوتوپ‌های آن، منبع انرژی ستارگان است.

### ۱۵.۱. همجوشی دوتریم و تریتیوم

یکی از واکنش‌های مهم مورد مطالعه در پژوهش‌های همجوشی، واکنش دوتریم و تریتیوم است:

$$^{2}_{1}\\mathrm{H} + ^{3}_{1}\\mathrm{H} \\rightarrow ^{4}_{2}\\mathrm{He} + ^{1}_{0}\\mathrm{n} + 17.6\\,\\mathrm{MeV}$$

در این واکنش، هستهٔ دوتریم و هستهٔ تریتیوم با یکدیگر ترکیب می‌شوند و هلیوم-۴، یک نوترون و انرژی آزاد می‌شود.

### ۱۵.۲. چرا همجوشی دشوار است؟

هسته‌های اتمی دارای بار مثبت هستند و یکدیگر را به دلیل نیروی الکتریکی دافعه دفع می‌کنند. برای نزدیک‌شدن آن‌ها به فاصله‌ای که نیروی هسته‌ای قوی بتواند بر این دافعه غلبه کند، شرایط فیزیکی بسیار ویژه‌ای لازم است.

در ستارگان، گرانش عظیم و دما و فشار مرکزی شرایط لازم برای همجوشی را فراهم می‌کنند. در سامانه‌های آزمایشگاهی، پژوهشگران باید با روش‌های فنی پیچیده، ماده را در حالت پلاسما نگه دارند و شرایط مناسب را فراهم کنند.

### ۱۵.۳. تفاوت همجوشی و شکافت هسته‌ای

| ویژگی | همجوشی هسته‌ای | شکافت هسته‌ای |
|---|---|---|
| ماهیت فرایند | ترکیب هسته‌های سبک | تقسیم هسته‌های سنگین |
| سوخت‌های نمونه | دوتریم و تریتیوم | اورانیوم-۲۳۵ و پلوتونیوم-۲۳۹ |
| محصول نمونه | هلیوم و نوترون | هسته‌های سبک‌تر و نوترون‌ها |
| منبع انرژی ستارگان | بله | خیر، نه به‌عنوان فرایند اصلی ستارگان |
| چالش اصلی | دستیابی و حفظ شرایط همجوشی | مدیریت واکنش زنجیره‌ای و پسماندهای پرتوزا |

همجوشی هسته‌ای یکی از حوزه‌های مهم پژوهش برای دستیابی به منابع انرژی آینده است؛ اما تبدیل آن به فناوری گسترده و اقتصادی همچنان با چالش‌های علمی و مهندسی همراه است.

---

## ۱۶. نقش هیدروژن در زیست‌شناسی

هیدروژن یکی از عناصر اصلی سازندهٔ مواد زنده است. این عنصر در آب، کربوهیدرات‌ها، چربی‌ها، پروتئین‌ها و اسیدهای نوکلئیک حضور دارد.

### ۱۶.۱. هیدروژن در آب

آب با فرمول $\\mathrm{H_2O}$ از دو اتم هیدروژن و یک اتم اکسیژن تشکیل شده است. پیوندهای کووالانسی میان هیدروژن و اکسیژن، ساختار مولکولی آب را به وجود می‌آورند.

قطبی‌بودن مولکول آب و برهم‌کنش‌های هیدروژنی میان مولکول‌ها، به بسیاری از ویژگی‌های منحصربه‌فرد آب منجر می‌شود.

### ۱۶.۲. هیدروژن در مواد آلی

تقریباً تمام مولکول‌های زیستی اصلی دارای اتم هیدروژن هستند. برای مثال:

- کربوهیدرات‌ها از کربن، هیدروژن و اکسیژن تشکیل شده‌اند.
- چربی‌ها حاوی مقادیر زیادی کربن و هیدروژن هستند.
- پروتئین‌ها علاوه بر کربن، هیدروژن و اکسیژن، معمولاً نیتروژن و گاهی گوگرد نیز دارند.
- دنا و رنا نیز دارای اتم‌های هیدروژن در ساختار نوکلئوتیدهای خود هستند.

### ۱۶.۳. نقش در انتقال انرژی زیستی

یون‌های هیدروژن یا پروتون‌ها در بسیاری از فرایندهای زیستی نقش دارند. برای نمونه، در زنجیرهٔ انتقال الکترون میتوکندری و فتوسنتز، اختلاف غلظت پروتون‌ها در دو سوی یک غشا می‌تواند نیروی محرکهٔ تولید آدنوزین‌تری‌فسفات (ATP) را فراهم کند.

بنابراین، هیدروژن علاوه بر نقش ساختاری، در فرایندهای انتقال انرژی در سلول‌ها نیز اهمیت دارد.

---

## ۱۷. هیدروژن و محیط زیست

هیدروژن در صورت مصرف در پیل سوختی، هنگامی که سوخت آن هیدروژن خالص باشد، در محل استفاده محصول اصلی‌اش آب است. همچنین احتراق خالص آن دی‌اکسید کربن تولید نمی‌کند.

بااین‌حال، این ویژگی به‌تنهایی به معنای کاملاً پاک‌بودن چرخهٔ استفاده از هیدروژن نیست.

### ۱۷.۱. انتشارهای ناشی از تولید

اگر هیدروژن از گاز طبیعی یا زغال‌سنگ و بدون مدیریت انتشار کربن تولید شود، فرایند تولید آن می‌تواند مقدار زیادی گاز گلخانه‌ای وارد جو کند.

در مقابل، تولید هیدروژن از الکترولیز آب با برق کم‌کربن می‌تواند انتشارهای چرخهٔ عمر را کاهش دهد؛ البته ساخت تجهیزات، تأمین برق و مصرف منابع نیز باید در ارزیابی لحاظ شوند.

### ۱۷.۲. اثر غیرمستقیم هیدروژن بر اقلیم

هیدروژن خود یک گاز گلخانه‌ای مستقیم به معنای متعارف نیست؛ اما ورود آن به جو می‌تواند از طریق تغییر در واکنش‌های شیمیایی اتمسفر، بر غلظت برخی گازهای گلخانه‌ای دیگر اثر بگذارد.

از جمله این سازوکارها می‌توان به موارد زیر اشاره کرد:

- افزایش عمر جوی متان از طریق اثر بر رادیکال‌های هیدروکسیل؛
- تأثیر بر تشکیل ازن در تروپوسفر؛
- تغییر مقدار بخار آب در استراتوسفر.

یک مقالهٔ مروری منتشرشده در سال ۲۰۲۶ در مجلهٔ *Nature Reviews Earth & Environment*، برآوردی حدود $12 \\pm 6$ برای پتانسیل گرمایش جهانی غیرمستقیم هیدروژن طی بازهٔ صدساله گزارش کرده است. این مقدار باید به‌عنوان برآوردی از اثرات غیرمستقیم شیمیایی جو در نظر گرفته شود، نه به‌عنوان اثر مستقیم یک گاز گلخانه‌ای مانند دی‌اکسید کربن.

### ۱۷.۳. نشت هیدروژن

نشت هیدروژن در مراحل تولید، ذخیره‌سازی و انتقال می‌تواند هم از نظر ایمنی و هم از نظر زیست‌محیطی اهمیت داشته باشد. به همین دلیل، توسعهٔ زیرساخت‌های هیدروژنی باید همراه با سامانه‌های مناسب پایش و کنترل انتشار باشد.

منابع: [وزارت انرژی آمریکا – Hydrogen Safety](https://www.energy.gov/cmei/fuels/hydrogen-safe) و [Nature Reviews Earth & Environment – Climate Impacts of Hydrogen Emissions (2026)](https://www.nature.com/articles/s43017-026-00792-0).

---

## ۱۸. ایمنی و خطرهای هیدروژن

هیدروژن از نظر شیمیایی گازی غیرسمی است؛ اما این موضوع به معنای بی‌خطر بودن آن نیست.

مهم‌ترین ویژگی خطرآفرین هیدروژن، اشتعال‌پذیری زیاد آن است. در مخلوط با هوا، در گسترهٔ نسبتاً وسیعی از غلظت‌ها قابلیت اشتعال دارد.

چند ویژگی مهم ایمنی هیدروژن عبارت‌اند از:

۱. بی‌رنگ و بی‌بو بودن آن، تشخیص نشت را بدون تجهیزات مناسب دشوار می‌کند.

۲. در صورت نشت در فضای بسته، می‌تواند با جابه‌جاکردن اکسیژن محیط، خطر کمبود اکسیژن ایجاد کند.

۳. به دلیل اشتعال‌پذیری زیاد، حضور آن در شرایط نامناسب می‌تواند خطر آتش‌سوزی ایجاد کند.

۴. برخی فلزات در تماس طولانی‌مدت با هیدروژن ممکن است دچار تردی هیدروژنی شوند؛ پدیده‌ای که می‌تواند خواص مکانیکی آن‌ها را تغییر دهد.

۵. نگهداری هیدروژن مایع به دلیل دمای بسیار پایین آن به تجهیزات و مواد سازگار با شرایط برودتی نیاز دارد.

در صنایع، ایمنی سامانه‌های هیدروژنی با استانداردهای مهندسی، تجهیزات مناسب، پایش نشت و طراحی دقیق مخازن و خطوط انتقال مدیریت می‌شود.

منبع: [U.S. Department of Energy – Is Hydrogen Safe?](https://www.energy.gov/cmei/fuels/hydrogen-safe).

---

## ۱۹. وضعیت کنونی و آیندهٔ فناوری هیدروژن

هیدروژن در حال حاضر به‌طور گسترده در صنایع پالایش نفت، تولید آمونیاک و ساخت مواد شیمیایی استفاده می‌شود. بااین‌حال، بخش بزرگی از هیدروژن مصرفی جهان همچنان از سوخت‌های فسیلی تولید می‌شود.

بر اساس گزارش سال ۲۰۲۶ آژانس بین‌المللی انرژی (IEA)، تولید هیدروژن کم‌انتشار در سال ۲۰۲۵ به نزدیک یک میلیون تن رسیده است. همچنین ظرفیت نصب‌شدهٔ الکترولیز آب در همان سال از چهار گیگاوات فراتر رفته است. با وجود این رشد، تولید هیدروژن در سطح جهان همچنان عمدتاً متکی بر سوخت‌های فسیلی بدون کاهش کافی انتشار کربن است.

این آمار نشان می‌دهد که فناوری هیدروژن با وجود ظرفیت قابل‌توجه، هنوز در مرحلهٔ گذار قرار دارد.

### ۱۹.۱. حوزه‌های مهم توسعه

پژوهش‌های آینده در زمینهٔ هیدروژن عمدتاً بر این موضوعات تمرکز دارند:

- کاهش هزینهٔ تولید هیدروژن کم‌انتشار؛
- افزایش بازده و طول عمر الکترولایزرها؛
- توسعهٔ مواد مناسب برای ذخیره‌سازی هیدروژن؛
- کاهش هزینهٔ انتقال و توزیع؛
- افزایش دوام و بازده پیل‌های سوختی؛
- توسعهٔ روش‌های کم‌انتشار در صنعت فولاد، پالایش و تولید مواد شیمیایی؛
- ارزیابی دقیق پیامدهای زیست‌محیطی در کل چرخهٔ عمر.

### ۱۹.۲. آیا هیدروژن سوخت آینده است؟

هیدروژن می‌تواند در بخش‌هایی از اقتصاد که برق‌رسانی مستقیم دشوار است، نقش مهمی داشته باشد؛ از جمله برخی صنایع سنگین، تولید مواد شیمیایی و ذخیره‌سازی بلندمدت انرژی.

بااین‌حال، در تمام کاربردها بهترین گزینه نیست. تبدیل برق به هیدروژن و سپس بازگرداندن آن به برق با اتلاف انرژی همراه است. بنابراین در بسیاری از موارد، استفادهٔ مستقیم از برق می‌تواند کارآمدتر باشد.

آیندهٔ هیدروژن به این بستگی دارد که در کدام کاربردها مزیت فنی و اقتصادی واقعی داشته باشد و چگونه بتوان تولید و مصرف آن را با حداقل پیامدهای زیست‌محیطی گسترش داد.

منبع: [International Energy Agency – Global Hydrogen Review 2026](https://www.iea.org/reports/global-hydrogen-review-2026/production).

## ۲۰. حقایق علمی جالب دربارهٔ هیدروژن

۱. هیدروژن ساده‌ترین عنصر جدول تناوبی و دارای تنها یک پروتون در هستهٔ اتم معمولی خود است.

۲. بخش عمدهٔ مادهٔ معمولی جهان از هیدروژن و هلیوم تشکیل شده است.

۳. خورشید و بسیاری از ستارگان انرژی خود را از همجوشی هسته‌های هیدروژن به دست می‌آورند.

۴. آب، یکی از فراوان‌ترین و حیاتی‌ترین ترکیبات زمین، از هیدروژن و اکسیژن ساخته شده است.

۵. هیدروژن به‌صورت طبیعی در شرایط معمول زمین بیشتر به شکل مولکول دواتمی $\\mathrm{H_2}$ وجود دارد.

۶. هیدروژن تنها عنصری است که ایزوتوپ‌های پایدار آن نام‌های اختصاصی و رایج پروتیوم و دوتریم دارند؛ ایزوتوپ پرتوزای مهم آن نیز تریتیوم نامیده می‌شود.

۷. طیف هیدروژن یکی از مهم‌ترین ابزارهای اخترشناسان برای مطالعهٔ ستارگان و ابرهای میان‌ستاره‌ای است.

۸. تابش رادیویی معروف به خط ۲۱ سانتی‌متری هیدروژن خنثی، در نقشه‌برداری از ساختار کهکشان‌ها و بررسی گاز میان‌ستاره‌ای کاربرد دارد.

۹. هیدروژن از نظر انرژی به ازای واحد جرم، سوختی بسیار پرانرژی است؛ اما چگالی حجمی کم آن ذخیره‌سازی را دشوار می‌کند.

۱۰. یون $\\mathrm{H^+}$ در شیمی محلول‌ها معمولاً به‌صورت پروتون آزاد و مستقل در آب حضور ندارد، بلکه با مولکول‌های آب برهم‌کنش می‌کند و ساختارهایی مانند یون هیدرونیوم $\\mathrm{H_3O^+}$ تشکیل می‌دهد.

## ۲۱. نتیجه‌گیری

هیدروژن عنصری بنیادی در ساختار ماده و تحول جهان است. سادگی ساختار اتمی آن، فراوانی کیهانی، نقش محوری در تولید انرژی ستارگان، حضور گسترده در ترکیبات زیستی و کاربردهای متنوع صنعتی، این عنصر را به یکی از مهم‌ترین موضوعات پژوهش در علوم پایه و فناوری تبدیل کرده است.

از دیدگاه فیزیک، هیدروژن نمونه‌ای اساسی برای مطالعهٔ ساختار اتمی، مکانیک کوانتومی، طیف‌سنجی و واکنش‌های هسته‌ای است. از دیدگاه شیمی، در تشکیل آب، هیدریدها، ترکیبات آلی و بسیاری از واکنش‌های صنعتی نقش دارد. از دیدگاه اخترفیزیک، سوخت اصلی ستارگان و یکی از مهم‌ترین عناصر برای مطالعهٔ تاریخ کیهان محسوب می‌شود. از دیدگاه فناوری نیز تولید هیدروژن کم‌انتشار، ذخیره‌سازی آن و استفاده از آن در پیل‌های سوختی و صنایع سنگین از موضوعات مهم توسعهٔ انرژی هستند.

با وجود ظرفیت‌های چشمگیر، استفادهٔ گسترده از هیدروژن به حل چالش‌هایی مانند هزینهٔ تولید، بازده تبدیل انرژی، ذخیره‌سازی، انتقال، ایمنی و کاهش انتشارهای چرخهٔ عمر وابسته است.

در مجموع، هیدروژن تنها نخستین عنصر جدول تناوبی نیست؛ بلکه عنصری است که از نخستین لحظات شکل‌گیری کیهان تا فناوری‌های پیشرفتهٔ انرژی در آینده، جایگاهی بنیادی در فهم جهان و توسعهٔ تمدن انسانی دارد.

## چکیده

هلیم (Helium) با نماد شیمیایی He و عدد اتمی ۲، دومین عنصر جدول تناوبی و سبک‌ترین عضو گروه گازهای نجیب است. این عنصر گازی بی‌رنگ، بی‌بو، بی‌مزه و از نظر شیمیایی بسیار کم‌واکنش است که به دلیل ساختار الکترونی پایدار، چگالی بسیار پایین و ویژگی‌های فیزیکی منحصربه‌فرد، جایگاه ویژه‌ای در علوم پایه و فناوری‌های پیشرفته دارد. هلیم پس از هیدروژن، فراوان‌ترین عنصر در جهان است و بخش عمده‌ای از آن در نخستین دقایق پس از مهبانگ (Big Bang) پدید آمده است. این عنصر همچنین در درون ستارگان، از طریق همجوشی هسته‌ای، به‌طور پیوسته تولید می‌شود.

هلیم برخلاف بسیاری از گازها، در دماهای بسیار پایین ویژگی‌های کوانتومی شگفت‌انگیزی از خود نشان می‌دهد؛ به‌ویژه ایزوتوپ هلیم-۴ در دماهای پایین‌تر از حدود ۲٫۱۷ کلوین به حالت ابرشارگی (Superfluidity) می‌رسد. این ویژگی‌ها، در کنار قابلیت تبدیل شدن به مایعی در دمای نزدیک به صفر مطلق، آن را به ماده‌ای اساسی در فناوری سرمایش برودتی، آهنرباهای ابررسانا، تصویربرداری تشدید مغناطیسی (MRI) و شتاب‌دهنده‌های ذرات تبدیل کرده‌اند.

در این مقاله، ساختار اتمی، ویژگی‌های فیزیکی و شیمیایی، ایزوتوپ‌ها، منشأ کیهانی و زمینی، روش‌های استخراج، کاربردهای صنعتی و علمی، رفتارهای کوانتومی، ملاحظات ایمنی و اهمیت راهبردی منابع هلیم بررسی می‌شوند.

**واژگان کلیدی:** هلیم، گازهای نجیب، ساختار اتمی، ایزوتوپ، همجوشی هسته‌ای، ابرشارگی، ابررسانایی، کرایوژنیک، اخترفیزیک.

# ۱. آشنایی با عنصر هلیم

هلیم عنصری شیمیایی با نماد **He** و عدد اتمی **۲** است که در گروه ۱۸ و تناوب نخست جدول تناوبی قرار دارد. این عنصر پس از هیدروژن، کوچک‌ترین و سبک‌ترین اتم خنثی در شرایط معمول به شمار می‌رود و از خانوادهٔ گازهای نجیب (Noble Gases) محسوب می‌شود.

هلیم در دمای اتاق و فشار معمول، به شکل گاز تک‌اتمی وجود دارد؛ یعنی برخلاف اکسیژن و نیتروژن، مولکول‌های دواتمی تشکیل نمی‌دهد و هر ذرهٔ گاز هلیم معمولاً یک اتم منفرد است.

از مهم‌ترین ویژگی‌های هلیم می‌توان به موارد زیر اشاره کرد:

- بی‌رنگ، بی‌بو و بی‌مزه بودن؛
- نداشتن قابلیت اشتعال و پشتیبانی نکردن از احتراق؛
- چگالی بسیار پایین و سبک‌تر بودن از هوا؛
- واکنش‌پذیری شیمیایی بسیار اندک؛
- داشتن پایین‌ترین نقطهٔ جوش در میان عناصر؛
- امکان تشکیل فاز ابرشاره در دماهای بسیار پایین؛
- کاربرد گسترده در تجهیزات علمی، پزشکی و صنعتی.

# ۲. تاریخچهٔ کشف هلیم

یکی از جالب‌ترین ویژگی‌های تاریخی هلیم این است که برخلاف تقریباً تمام عناصر شناخته‌شده، ابتدا در یک جرم آسمانی شناسایی شد و سال‌ها بعد وجود آن روی زمین به اثبات رسید.

## ۲.۱. کشف هلیم در خورشید

در سال ۱۸۶۸ میلادی، اخترشناس فرانسوی **پیر ژول سزار یانسن (Pierre Jules César Janssen)** برای بررسی طیف نور خورشید در جریان یک خورشیدگرفتگی کامل به هند سفر کرد.

او هنگام مطالعهٔ طیف خورشید، خط طیفی زردرنگی را مشاهده کرد که با خطوط شناخته‌شدهٔ عناصر موجود در آن زمان تطابق نداشت.

در همان سال، اخترشناس انگلیسی **نورمن لاکیر (Norman Lockyer)** نیز به‌طور مستقل همین خط طیفی را بررسی کرد و نتیجه گرفت که احتمالاً با عنصری ناشناخته روبه‌رو است.

لاکیر به همراه شیمی‌دان انگلیسی، ادوارد فرانکلند، نام Helium را برای این عنصر پیشنهاد کرد. این نام از واژهٔ یونانی Helios به معنای خورشید گرفته شده است.

بنابراین، هلیم نخستین عنصری بود که پیش از شناسایی روی زمین، از طریق بررسی طیف یک جرم آسمانی کشف شد.

## ۲.۲. شناسایی هلیم روی زمین

حدود ۲۷ سال پس از کشف طیفی هلیم، در سال ۱۸۹۵ میلادی، شیمی‌دان اسکاتلندی **ویلیام رامزی (William Ramsay)** هنگام بررسی یک کانی به نام کلیویت (Cleveite)، گازی را جدا کرد که طیف آن با عنصر پیش‌بینی‌شده در خورشید مطابقت داشت.

در همان سال، دو دانشمند سوئدی به نام‌های پر تئودور کِلِوِه (Per Teodor Cleve) و آبراهام لانگلِت (Nils Abraham Langlet) نیز به‌طور مستقل موفق به شناسایی هلیم شدند.

به این ترتیب، وجود هلیم هم در خورشید و هم در زمین به اثبات رسید.

# ۳. ساختار اتمی و آرایش الکترونی هلیم

برای درک ویژگی‌های شیمیایی و فیزیکی هلیم، ابتدا باید ساختار اتمی آن را بررسی کرد.

عدد اتمی هلیم برابر با ۲ است؛ بنابراین هستهٔ هر اتم هلیم دارای دو پروتون است. در حالت خنثی نیز دو الکترون در اطراف هسته قرار دارند.

در فراوان‌ترین ایزوتوپ آن، یعنی هلیم-۴، هسته علاوه بر دو پروتون، شامل دو نوترون نیز هست.

ساختار اتمی هلیم-۴ را می‌توان به صورت زیر نمایش داد:

- تعداد پروتون‌ها: ۲
- تعداد نوترون‌ها: ۲
- تعداد الکترون‌ها: ۲

## ۳.۱. آرایش الکترونی

آرایش الکترونی هلیم به صورت زیر است:

$$\\boxed{1s^2}$$

این آرایش نشان می‌دهد که هر دو الکترون هلیم در زیرلایهٔ 1s قرار گرفته‌اند.

زیرلایهٔ s حداکثر ظرفیت دو الکترون دارد؛ بنابراین نخستین و تنها لایهٔ الکترونی هلیم کاملاً پر شده است.

این موضوع اهمیت بسیار زیادی دارد؛ زیرا پر بودن لایهٔ الکترونی باعث ایجاد پایداری الکترونی ویژه‌ای می‌شود.

## ۳.۲. علت پایداری شیمیایی هلیم

اتم‌ها معمولاً تمایل دارند به آرایش‌های الکترونی پایدارتر برسند. در بسیاری از عناصر، این پایداری با گرفتن، از دست دادن یا به‌اشتراک‌گذاری الکترون‌ها حاصل می‌شود.

اما هلیم از ابتدا آرایش الکترونی کامل دارد.

به همین دلیل:

1. تمایل بسیار اندکی به گرفتن الکترون دارد.
2. جدا کردن الکترون از آن به انرژی بسیار زیادی نیاز دارد.
3. تشکیل پیوند شیمیایی با سایر اتم‌ها در شرایط معمول برای آن نامطلوب است.

این ویژگی‌ها سبب شده‌اند هلیم یکی از کم‌واکنش‌ترین عناصر جدول تناوبی باشد.

# ۴. جایگاه هلیم در جدول تناوبی

هلیم در گروه ۱۸ جدول تناوبی قرار دارد؛ گروهی که به خانوادهٔ گازهای نجیب معروف است.

اعضای شناخته‌شدهٔ این خانواده عبارت‌اند از:

- هلیم (He)
- نئون (Ne)
- آرگون (Ar)
- کریپتون (Kr)
- زنون (Xe)
- رادون (Rn)
- اوگانسون (Og)

با وجود آنکه آرایش الکترونی هلیم به بلوک s تعلق دارد، این عنصر در گروه ۱۸ قرار گرفته است؛ زیرا ویژگی شیمیایی آن، به‌ویژه تکمیل بودن لایهٔ ظرفیت و واکنش‌پذیری بسیار اندک، با گازهای نجیب سازگار است.

هلیم از یک جهت با سایر عناصر گروه خود تفاوت مهمی دارد: در اتم هلیم، لایهٔ ظرفیت فقط دو الکترون ظرفیت دارد، در حالی که در گازهای نجیب سنگین‌تر، لایهٔ ظرفیت معمولاً با هشت الکترون تکمیل می‌شود.

# ۵. ویژگی‌های فیزیکی هلیم

هلیم از نظر فیزیکی یکی از خاص‌ترین عناصر طبیعت است. برخی از ویژگی‌های آن در هیچ عنصر دیگری به همین شکل مشاهده نمی‌شوند.

## ۵.۱. حالت فیزیکی و چگالی

هلیم در شرایط استاندارد محیطی به حالت گاز وجود دارد.

چگالی آن در دمای ۲۰ درجهٔ سانتی‌گراد و فشار یک اتمسفر تقریباً برابر با:

$$\\rho \\approx 0.164\\ \\mathrm{kg/m^3}$$

است.

برای مقایسه، چگالی هوای خشک در همین شرایط تقریباً ۱٫۲۰ کیلوگرم بر متر مکعب است.

بنابراین هلیم به‌مراتب سبک‌تر از هواست و در صورت آزاد شدن در محیط، تمایل دارد به سمت بالا حرکت کند.

همین ویژگی علت اصلی استفاده از آن در بالن‌ها و بالن‌های هواشناسی است.

## ۵.۲. نقطهٔ جوش بسیار پایین

نقطهٔ جوش هلیم در فشار یک اتمسفر تقریباً برابر با:

$$T_b = 4.222\\ \\mathrm{K}$$

است.

با توجه به رابطهٔ تبدیل کلوین به سلسیوس:

$$T(^{\\circ}\\mathrm{C})=T(\\mathrm{K})-273.15$$

خواهیم داشت:

$$T_b\\approx -268.93^{\\circ}\\mathrm{C}$$

این دما به صفر مطلق بسیار نزدیک است.

صفر مطلق برابر با صفر کلوین یا ۲۷۳٫۱۵ درجهٔ سلسیوس زیر صفر است و کمترین دمای حدی در ترمودینامیک محسوب می‌شود.

## ۵.۳. چرا هلیم در فشار معمول جامد نمی‌شود؟

یکی از عجیب‌ترین ویژگی‌های هلیم این است که حتی با سرد کردن آن تا دماهای بسیار نزدیک به صفر مطلق، در فشار یک اتمسفر به جامد تبدیل نمی‌شود.

علت این رفتار را باید در ماهیت کوانتومی اتم‌های هلیم جست‌وجو کرد.

اتم‌های هلیم سبک هستند و حتی در دماهای بسیار پایین نیز انرژی جنبشی نقطهٔ صفر (Zero-point Energy) قابل توجهی دارند.

این انرژی از مکانیک کوانتومی ناشی می‌شود و اجازه نمی‌دهد اتم‌ها به‌آسانی در یک شبکهٔ بلوری پایدار و منظم قرار بگیرند.

برای جامد کردن هلیم-۴ باید فشار خارجی بسیار زیادی، در حدود ۲۵ اتمسفر یا بیشتر، به آن وارد کرد.

بنابراین، برخلاف بیشتر عناصر، صرفاً کاهش دما برای جامد کردن هلیم در فشار معمول کافی نیست.

## ۵.۴. ویژگی‌های دیگر

از ویژگی‌های فیزیکی مهم دیگر هلیم می‌توان به موارد زیر اشاره کرد:

- رسانایی گرمایی نسبتاً زیاد در میان گازها؛
- ویسکوزیتهٔ پایین؛
- ضریب نفوذ بالا؛
- قابلیت انتشار از شکاف‌های بسیار کوچک؛
- سرعت صوت بالا در آن نسبت به هوا؛
- انحلال‌پذیری اندک در آب.

ترکیب این ویژگی‌ها باعث شده است هلیم در صنایع دقیق و تجهیزات آزمایشگاهی کاربرد داشته باشد.

# ۶. ویژگی‌های شیمیایی هلیم

هلیم از نظر شیمیایی عنصری بسیار کم‌واکنش است.

این موضوع در درجهٔ نخست به آرایش الکترونی کامل آن مربوط می‌شود.

در شرایط معمول، هلیم:

- با اکسیژن واکنش نمی‌دهد؛
- نمی‌سوزد؛
- از احتراق پشتیبانی نمی‌کند؛
- به‌آسانی با سایر عناصر ترکیب نمی‌شود؛
- ترکیب‌های شیمیایی پایدار معمولی تشکیل نمی‌دهد.

## ۶.۱. آیا هلیم کاملاً بی‌اثر است؟

اگرچه هلیم در شیمی معمولی عنصری تقریباً بی‌اثر محسوب می‌شود، نباید تصور کرد که تشکیل هر نوع گونهٔ شیمیایی حاوی هلیم تحت تمام شرایط غیرممکن است.

برای مثال، یون مولکولی هیدرید هلیم:

$$\\mathrm{HeH^+}$$

شناخته شده است.

این یون در محیط‌های اخترفیزیکی، از جمله سحابی سیاره‌نمای NGC 7027، شناسایی شده است.

همچنین در پژوهشی که در سال ۲۰۱۷ در مجلهٔ Nature Chemistry منتشر شد، ترکیبی غیرمعمول از سدیم و هلیم با فرمول:

$$\\mathrm{Na_2He}$$

در فشارهای بالاتر از حدود ۱۱۳ گیگاپاسکال ساخته شد.

این نتیجه نشان می‌دهد که بی‌اثری شیمیایی هلیم مطلق نیست، بلکه به شرایط محیطی و انرژی سامانه بستگی دارد.

البته چنین ترکیباتی با ترکیبات شیمیایی معمولی که در دما و فشار محیط تشکیل می‌شوند، تفاوت اساسی دارند.

# ۷. ایزوتوپ‌های هلیم

ایزوتوپ‌ها اتم‌های یک عنصر هستند که تعداد پروتون‌های یکسان، اما تعداد نوترون‌های متفاوت دارند.

هلیم در طبیعت عمدتاً با دو ایزوتوپ پایدار وجود دارد:

1. هلیم-۳
2. هلیم-۴

## ۷.۱. هلیم-۳

هلیم-۳ با نماد زیر نمایش داده می‌شود:

$$^{3}\\mathrm{He}$$

این ایزوتوپ دارای دو پروتون و یک نوترون است.

جرم اتمی آن تقریباً برابر با:

$$m \\approx 3.016029\\ \\mathrm{u}$$

است.

هلیم-۳ در طبیعت بسیار کمیاب است و نسبت به هلیم-۴ فراوانی بسیار کمتری دارد.

از کاربردهای مهم آن می‌توان به موارد زیر اشاره کرد:

- آشکارسازی نوترون‌ها؛
- استفاده در یخچال‌های رقیق‌سازی برای رسیدن به دماهای فوق‌العاده پایین؛
- پژوهش‌های فیزیک مادهٔ چگال؛
- تحقیقات مربوط به همجوشی هسته‌ای؛
- مطالعهٔ پدیده‌های کوانتومی.

## ۷.۲. هلیم-۴

هلیم-۴ با نماد زیر نمایش داده می‌شود:

$$^{4}\\mathrm{He}$$

این ایزوتوپ دارای دو پروتون و دو نوترون است.

جرم اتمی آن تقریباً برابر با:

$$m \\approx 4.002603\\ \\mathrm{u}$$

است.

هلیم-۴ فراوان‌ترین ایزوتوپ هلیم در طبیعت است و تقریباً تمام هلیم طبیعی را تشکیل می‌دهد.

بخش بزرگی از هلیم-۴ موجود در زمین نیز حاصل واپاشی پرتوزای عناصر سنگینی مانند اورانیوم و توریم است.
