## ۱۳. بریلیوم و فیزیک هسته‌ای

بریلیوم علاوه بر خواص مکانیکی و شیمیایی، از نظر فیزیک هسته‌ای نیز عنصر مهمی است.

### ۱۳.۱. تولید نوترون

همان‌طور که در تاریخچهٔ کشف بریلیوم اشاره شد، برخورد ذرات آلفا با هستهٔ بریلیوم-۹ می‌تواند به آزادشدن نوترون منجر شود.

واکنش هسته‌ای آن چنین است:

$$^{9}_{4}\\mathrm{Be} + ^{4}_{2}\\mathrm{He} \\rightarrow ^{12}_{6}\\mathrm{C} + ^{1}_{0}\\mathrm{n}$$

این واکنش در تاریخ شناخت نوترون نقش اساسی داشت.

### ۱۳.۲. برهم‌کنش با نوترون‌ها

بریلیوم به دلیل ویژگی‌های هسته‌ای خاص خود، در برخی سامانه‌ها برای پراکندگی و بازتاب نوترون‌ها بررسی و استفاده می‌شود.

بازتاب نوترون می‌تواند احتمال بازگشت برخی نوترون‌ها به ناحیهٔ موردنظر را افزایش دهد.

این ویژگی در طراحی برخی سامانه‌های هسته‌ای اهمیت دارد.

### ۱۳.۳. نقش در پژوهش‌های همجوشی هسته‌ای

در برخی طرح‌های مربوط به فناوری همجوشی، بریلیوم به‌عنوان یکی از مواد مورد مطالعه برای افزایش تعداد نوترون‌ها در پوشش پیرامونی راکتور مطرح شده است.

نوترون‌های حاصل از واکنش همجوشی می‌توانند با هسته‌های مواد پیرامونی برهم‌کنش داشته باشند و واکنش‌های هسته‌ای دیگری ایجاد کنند.

بنابراین، بریلیوم در برخی مفاهیم طراحی سامانه‌های آیندهٔ همجوشی نیز مورد بررسی قرار گرفته است.

---

## ۱۴. نقش بریلیوم در زیست‌شناسی و پزشکی

### ۱۴.۱. آیا بریلیوم برای بدن ضروری است؟

در حال حاضر هیچ نقش زیستی ضروری و قطعی برای بریلیوم در بدن انسان شناخته نشده است.

این عنصر برخلاف عناصری مانند آهن، روی، کلسیم و منیزیم، جزء عناصر ضروری شناخته‌شده برای فعالیت طبیعی بدن محسوب نمی‌شود.

### ۱۴.۲. سمیت بریلیوم

بریلیوم و ترکیبات آن می‌توانند برای انسان خطرناک باشند.

مهم‌ترین مسیر مواجههٔ شغلی با بریلیوم، استنشاق ذرات و گردوغبار حاصل از فعالیت‌های معدنی، فرآوری، ساخت آلیاژها و عملیات صنعتی است.

تماس با برخی شکل‌های بریلیوم می‌تواند موجب حساس‌شدن دستگاه ایمنی شود؛ یعنی بدن در برابر این عنصر پاسخ ایمنی غیرطبیعی ایجاد کند.

### ۱۴.۳. بیماری مزمن بریلیوم

بیماری مزمن بریلیوم (Chronic Beryllium Disease یا CBD) نوعی بیماری التهابی ریه است که در اثر پاسخ ایمنی به بریلیوم ایجاد می‌شود.

در این بیماری، بافت ریه می‌تواند دچار التهاب و تشکیل گرانولوم شود. این وضعیت ممکن است عملکرد تنفسی را مختل کند و در موارد پیشرفته به آسیب پایدار ریه منجر شود.

### ۱۴.۴. سرطان‌زایی

آژانس بین‌المللی پژوهش دربارهٔ سرطان (IARC)، بریلیوم و ترکیبات آن را در گروه ۱ مواد سرطان‌زا برای انسان طبقه‌بندی کرده است.

شواهد علمی، به‌ویژه در محیط‌های شغلی دارای مواجهه با بریلیوم، ارتباط میان این عنصر و افزایش خطر سرطان ریه را نشان می‌دهند.

بنابراین، بریلیوم نمونه‌ای از عناصری است که با وجود کاربردهای فناورانهٔ مهم، می‌تواند خطرهای جدی برای سلامت انسان ایجاد کند.

منابع: [CDC – ATSDR: Beryllium Toxicity](https://wwwn.cdc.gov/TSp/ToxFAQs/ToxFAQsDetails.aspx?faqid=184&toxid=33)، [NIOSH – Pocket Guide](https://www.cdc.gov/niosh/npg/npgd0054.html) و [OSHA – Health Effects](https://www.osha.gov/beryllium/health-effects).

---

## ۱۵. ایمنی و خطرهای بریلیوم

بریلیوم از نظر صنعتی یک مادهٔ ارزشمند، اما از نظر بهداشتی ماده‌ای بسیار پرخطر است.

نکتهٔ مهم در ارزیابی خطر بریلیوم آن است که شکل فیزیکی و مسیر مواجهه اهمیت زیادی دارند. برای مثال، تماس شغلی با ذرات معلق و گردوغبار بریلیوم می‌تواند خطرناک باشد؛ زیرا این ذرات ممکن است وارد دستگاه تنفسی شوند.

مهم‌ترین خطرهای شناخته‌شده عبارت‌اند از:

۱. **حساس‌شدن دستگاه ایمنی:** در برخی افراد، تماس با بریلیوم می‌تواند پاسخ ایمنی اختصاصی ایجاد کند.

۲. **بیماری مزمن بریلیوم:** این بیماری می‌تواند موجب التهاب پایدار بافت ریه و اختلال عملکرد تنفسی شود.

۳. **سرطان‌زایی:** بریلیوم و ترکیبات آن در طبقه‌بندی IARC در گروه ۱ سرطان‌زا قرار دارند.

۴. **آسیب پوستی و چشمی:** تماس با برخی ترکیبات و ذرات بریلیوم می‌تواند موجب تحریک، التهاب یا حساسیت پوستی شود.

۵. **خطرات محیط کار:** فعالیت‌هایی که ممکن است ذرات بریلیوم را در هوا منتشر کنند، نیازمند کنترل‌های صنعتی و پایش بهداشتی تخصصی هستند.

به همین دلیل، بریلیوم فلزی و ترکیبات آن نباید به‌عنوان مواد معمولی یا بی‌خطر در نظر گرفته شوند. نمونه‌های این عنصر نیز صرفاً باید در چارچوب مقررات و شرایط ایمنی مناسب نگهداری و بررسی شوند.

منابع: [CDC – ATSDR](https://wwwn.cdc.gov/TSp/ToxFAQs/ToxFAQsDetails.aspx?faqid=184&toxid=33) و [OSHA – Beryllium](https://www.osha.gov/beryllium/).

## ۱۶. اهمیت اقتصادی و وضعیت صنعت بریلیوم

بریلیوم از نظر اقتصادی عنصری نسبتاً کمیاب و راهبردی محسوب می‌شود. با وجود آنکه مقدار مصرف آن در مقایسه با فلزاتی مانند آهن، آلومینیوم و مس بسیار کمتر است، ویژگی‌های منحصربه‌فرد آن باعث شده است که در صنایع حساس و پیشرفته اهمیت زیادی داشته باشد.

### ۱۶.۱. کاربردهای صنعتی در آمار سال ۲۰۲۵

بر اساس گزارش سال ۲۰۲۶ سازمان زمین‌شناسی ایالات متحده (USGS)، مصرف ظاهری بریلیوم در ایالات متحده در سال ۲۰۲۵ حدود ۲۳۰ تن برآورد شده است.

این گزارش، توزیع تقریبی ارزش فروش محصولات بریلیومی در ایالات متحده را به شکل زیر ارائه می‌کند:

| حوزهٔ مصرف | سهم تقریبی از ارزش فروش |
|---|---:|
| تجهیزات الکترونیکی مصرفی | ۲۹٪ |
| هوافضا و صنایع دفاعی | ۲۴٪ |
| قطعات صنعتی | ۱۷٪ |
| الکترونیک خودرو | ۹٪ |
| کاربردهای انرژی | ۸٪ |
| نیمه‌رساناها | ۲٪ |
| سایر کاربردها | ۱۱٪ |

**توجه:** این درصدها مربوط به سهم حوزه‌های مصرف از ارزش فروش محصولات بریلیومی در ایالات متحده هستند؛ نه سهم وزنی مصرف جهانی یا میزان تولید کل جهان.

### ۱۶.۲. تمرکز تولید و فرآوری

استخراج و فرآوری بریلیوم در جهان در تعداد محدودی از کشورها انجام می‌شود.

بر اساس گزارش USGS، ایالات متحده یکی از کشورهای مهم در زنجیرهٔ تولید و فرآوری بریلیوم است. این کشور از ذخایر برتراندیت خود و همچنین بریل وارداتی برای تولید محصولات بریلیومی استفاده می‌کند.

### ۱۶.۳. چرا بریلیوم یک مادهٔ راهبردی است؟

اهمیت راهبردی بریلیوم از آنجا ناشی می‌شود که جایگزینی آن در برخی کاربردهای تخصصی آسان نیست.

برای نمونه، ترکیب چگالی کم، صلبیت زیاد، پایداری حرارتی و شفافیت نسبی در برابر پرتوهای ایکس در یک ماده، مجموعه‌ای از ویژگی‌های نسبتاً خاص ایجاد می‌کند.

بنابراین، حتی با وجود حجم مصرف کمتر، اختلال در زنجیرهٔ تأمین بریلیوم می‌تواند بر برخی صنایع پیشرفته تأثیر بگذارد.

منبع: [USGS – Mineral Commodity Summaries 2026: Beryllium](https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-beryllium.pdf).

---

## ۱۷. پیامدهای زیست‌محیطی استخراج و استفاده از بریلیوم

استخراج و فرآوری بریلیوم می‌تواند پیامدهای محیط‌زیستی مختلفی داشته باشد.

### ۱۷.۱. تغییرات ناشی از معدن‌کاری

مانند سایر فعالیت‌های معدنی، استخراج کانی‌های بریلیوم‌دار می‌تواند موجب تغییر سطح زمین، تخریب زیستگاه‌ها، تولید باطله و تغییر در شرایط طبیعی منطقه شود.

میزان این اثرات به نوع ذخیره، روش معدن‌کاری و نحوهٔ مدیریت پسماندها بستگی دارد.

### ۱۷.۲. انتشار ذرات حاوی بریلیوم

برخی فعالیت‌های صنعتی می‌توانند موجب آزادشدن ذرات ریز حاوی بریلیوم در هوا شوند.

این ذرات می‌توانند برای کارکنان و در صورت مدیریت نامناسب، برای محیط اطراف نیز خطر ایجاد کنند.

### ۱۷.۳. مدیریت پسماندهای صنعتی

پسماندهای حاصل از استخراج و فرآوری بریلیوم باید به‌گونه‌ای مدیریت شوند که از پراکنده‌شدن ترکیبات آن در محیط جلوگیری شود.

این موضوع به‌ویژه به دلیل سمیت و سرطان‌زایی ترکیبات بریلیوم اهمیت دارد.

### ۱۷.۴. بازیافت بریلیوم

بخشی از بریلیوم می‌تواند از ضایعات صنعتی و قطعات پایان‌عمر بازیابی شود.

بازیافت مناسب می‌تواند نیاز به استخراج مواد اولیه را کاهش دهد و بخشی از مواد ارزشمند را دوباره وارد چرخهٔ تولید کند.

بااین‌حال، بازیافت بریلیوم نیز باید در تأسیسات تخصصی و تحت کنترل مواجهه انجام شود؛ زیرا برخی مراحل فرآوری می‌توانند ذرات خطرناک تولید کنند.

---

## ۱۸. حقایق علمی جالب دربارهٔ بریلیوم

۱. بریلیوم چهارمین عنصر جدول تناوبی است و عدد اتمی آن ۴ است.

۲. این عنصر سبک‌ترین عضو گروه فلزات قلیایی خاکی است.

۳. بریلیوم یکی از سبک‌ترین فلزات با نقطهٔ ذوب بسیار بالا محسوب می‌شود.

۴. نام بریلیوم از نام کانی بریل گرفته شده است.

۵. زمرد و آکوامارین دو گونهٔ گوهرین شناخته‌شده از خانوادهٔ کانی بریل هستند.

۶. تنها ایزوتوپ پایدار طبیعی بریلیوم، بریلیوم-۹ است.

۷. ایزوتوپ بریلیوم-۸ به‌شدت ناپایدار است و در مدت‌زمانی بسیار کوتاه به دو هستهٔ هلیوم-۴ تبدیل می‌شود.

۸. بریلیوم در سال ۱۹۳۲ نقش مهمی در کشف نوترون توسط جیمز چادویک داشت.

۹. بریلیوم در برابر پرتوهای ایکس شفافیت نسبی دارد و به همین دلیل در برخی تجهیزات تصویربرداری و پژوهشی به کار می‌رود.

۱۰. اکسید بریلیوم می‌تواند هم‌زمان رسانایی گرمایی بالا و مقاومت الکتریکی زیاد داشته باشد؛ ترکیبی از خواص که در قطعات الکترونیکی بسیار ارزشمند است.

۱۱. بریلیوم و آلیاژهای آن در برخی اجزای تلسکوپ‌ها و تجهیزات فضایی استفاده می‌شوند؛ زیرا پایداری ابعادی در آن‌ها اهمیت زیادی دارد.

۱۲. با وجود ارزش صنعتی بریلیوم، گردوغبار و ترکیبات آن می‌توانند موجب بیماری‌های جدی ریوی و سرطان شوند.

---

## ۱۹. نتیجه‌گیری

بریلیوم یکی از عناصر منحصربه‌فرد جدول تناوبی است که ویژگی‌های شیمیایی، فیزیکی و هسته‌ای آن را به ماده‌ای ارزشمند در فناوری‌های پیشرفته تبدیل کرده‌اند.

از دیدگاه شیمی، بریلیوم به دلیل اندازهٔ کوچک یون دوظرفیتی خود رفتار متفاوتی نسبت به بسیاری از عناصر گروه دوم نشان می‌دهد. ترکیبات آن می‌توانند ماهیت کووالانسی قابل‌توجهی داشته باشند و اکسید و هیدروکسید آن از ویژگی آمفوتری برخوردارند.

از دیدگاه فیزیک، چگالی نسبتاً کم، صلبیت ویژهٔ زیاد، نقطهٔ ذوب بالا و شفافیت نسبی در برابر پرتوهای ایکس، این فلز را برای کاربردهای تخصصی در صنایع هوافضا، تجهیزات اپتیکی، الکترونیک و فناوری هسته‌ای مناسب کرده است.

از دیدگاه زمین‌شناسی، بریلیوم در کانی‌هایی مانند بریل و برتراندیت یافت می‌شود و برخی از زیباترین سنگ‌های قیمتی جهان، از جمله زمرد و آکوامارین، در خانوادهٔ کانی‌های حاوی این عنصر قرار می‌گیرند.

از دیدگاه فیزیک هسته‌ای نیز بریلیوم نقشی تاریخی در کشف نوترون داشته و ایزوتوپ‌های پرتوزای آن در اخترفیزیک و مطالعات زمین‌شناسی کاربرد دارند.

بااین‌حال، سمیت و سرطان‌زایی بریلیوم از مهم‌ترین محدودیت‌های استفاده از آن هستند. بنابراین، ارزش فناورانهٔ این عنصر تنها زمانی قابل بهره‌برداری پایدار است که استخراج، فرآوری و کاربرد آن با کنترل‌های دقیق بهداشتی و زیست‌محیطی همراه باشد.

در مجموع، بریلیوم نمونه‌ای روشن از عنصری است که مقدار مصرف محدود آن مانع اهمیت علمی و صنعتی گسترده‌اش نشده است؛ عنصری که از کشف نوترون تا ساخت تجهیزات فضایی و الکترونیکی پیشرفته، جایگاهی ویژه در تاریخ علم و فناوری دارد.

        // تولید کامل لیست عناصر
        let elementsData = [];
        
        function initData() {
            // نگاشت داده‌های دستی
            let manualData = {};
            baseElements.forEach(e => manualData[e.n] = e);

            const tableMap = [
                {n:1, r:1, c:1}, {n:2, r:1, c:18},
                {n:3, r:2, c:1}, {n:4, r:2, c:2}, {n:5, r:2, c:13}, {n:6, r:2, c:14}, {n:7, r:2, c:15}, {n:8, r:2, c:16}, {n:9, r:2, c:17}, {n:10, r:2, c:18},
                {n:11, r:3, c:1}, {n:12, r:3, c:2}, {n:13, r:3, c:13}, {n:14, r:3, c:14}, {n:15, r:3, c:15}, {n:16, r:3, c:16}, {n:17, r:3, c:17}, {n:18, r:3, c:18}
            ];
            
            let count = 19;
            for(let c=1; c<=18; c++) tableMap.push({n:count++, r:4, c:c});
            for(let c=1; c<=18; c++) tableMap.push({n:count++, r:5, c:c});
            
            tableMap.push({n:55, r:6, c:1}); tableMap.push({n:56, r:6, c:2});
            count = 72; for(let c=4; c<=18; c++) tableMap.push({n:count++, r:6, c:c});
            
            tableMap.push({n:87, r:7, c:1}); tableMap.push({n:88, r:7, c:2});
            count = 104; for(let c=4; c<=18; c++) tableMap.push({n:count++, r:7, c:c});
            
            count = 57; for(let c=4; c<=18; c++) { tableMap.push({n:count++, r:8, c:c-1}); }
            count = 89; for(let c=4; c<=18; c++) { tableMap.push({n:count++, r:9, c:c-1}); }

            function isLaAc(Z) {
                if (57 <= Z && Z <= 71 || 89 <= Z && Z <= 103) {
                    return true;
                } else {
                    return false;
                }
            }

            tableMap.forEach(pos => {
                let manual = manualData[pos.n];
                let config = calculateElectronConfig(pos.n);
                // Shells calculation
                let shells = {};
                config.forEach(c => { shells[c.n] = (shells[c.n] || 0) + c.count; });
                let shellsArr = Object.values(shells);

                elementsData.push({
                    number: pos.n,
                    row: pos.r,
                    col: pos.c,
                    period: isLaAc(pos.n) ? (pos.r)-2 : pos.r,
                    group: isLaAc(pos.n) ? '-' : pos.c,
                    symbol: manual.s,
                    name: manual.name,
                    nameEng: manual.nameEng,
                    mass: manual.m,
                    cat: manual.c,
                    block: manual.block,
                    state: manual.st,
                    configList: config,
                    shells: shellsArr,
                    density: manual.density,
                    mp: manual.mp,
                    bp: manual.bp,
                    isotopes: manual.istops,
                    radiusAtm: manual.RAtm,
                    radiusVDW: manual.RvdW,
                    electronegativity: manual.elctrNeg,
                    oxidationNum: manual.OxN,
                    allotropes: manual.alotrops,
                    discover: manual.discvrr,
                    discoverDate: manual.discvrDate,
                    naming: manual.naming,
                    ra: manual ? manual.ra : false,
                    img: manual.ra ? 'https://ana.ir/media/2050a599ZTp3ZWJwfGY6L2ZpbGVzL2ZhL25ld3MvMTQwMi8xMS8zLzQ0MzI3M18xMjAucG5nfGZ1aTo0MzQ0NTR8bDpmYXx2OjE.webp' : manual.img,
                    desc: manual.d,
                });
            });
        }

        initData();

        function getPeriodStartZ(period) {
            switch(period) {
                case 1: return 1;
                case 2: return 3;
                case 3: return 11;
                case 4: return 19;
                case 5: return 37;
                case 6: return 55;
                case 7: return 87;
                case 8: return 55;
                case 9: return 87;
                default: return 1;
            }
        }

        // --- رابط کاربری ---

        let currentMode = 'standard';
        const table = document.getElementById('periodicTable');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');
        const drawerTitle = document.getElementById('drawerTitle');
        const drawerContent = document.getElementById('drawerContent');

        // ساخت راهنما
        const legendContainer = document.getElementById('legend');
        legendContainer.innerHTML = '';
        Object.entries(categoryNames).forEach(([key, value]) => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.style.cursor = 'pointer';
            item.innerHTML = `
                <span>${value}</span>
                <div class="legend-color" style="background: ${colorPalette[key]}"></div>
            `;
            legendContainer.appendChild(item);
        });

        function renderTable() {
            table.innerHTML = '';
            // --- اضافه کردن هدرها به گرید ---
            // 1. گوشه خالی (0,0)
            let corner = document.createElement('div');
            corner.className = 'grid-header';
            corner.style.gridRow = "1"; 
            corner.style.gridColumn = "1";
            table.appendChild(corner);

            // 2. شماره گروه‌ها (1 تا 18) در سطر 1
            for (let i = 1; i <= 18; i++) {
                let h = document.createElement('div');
                h.className = 'grid-header';
                h.textContent = i;
                h.style.gridRow = "1";
                h.style.gridColumn = i + 1; // ستون 1 رزرو شده برای شماره دوره
                table.appendChild(h);
            }

            // 3. شماره دوره‌ها (1 تا 7) در ستون 1
            for (let i = 1; i <= 7; i++) {
                let h = document.createElement('div');
                h.className = 'grid-header';
                h.textContent = i;
                h.style.gridRow = i + 1; // سطر 1 رزرو شده برای شماره گروه
                h.style.gridColumn = "1";
                table.appendChild(h);
            }

            // --- رندر عناصر ---
            elementsData.forEach(el => {
                const div = document.createElement('div');
                div.className = 'element';
                let gridR = el.row + 1; // +1 بخاطر هدر
                if (el.row >= 9) {
                     gridR = el.row + 1;
                     gridR = el.row + 1; 
                }
                div.style.gridRow = gridR;
                div.style.gridColumn = el.col + 1; // +1 بخاطر هدر ستون
                // تعیین رنگ
                let color;
                if (currentMode === 'block') {
                    color = blockColors[el.block];
                } else {
                    color = colorPalette[el.cat];
                }
                div.style.borderBottom = `3px solid ${color}`;
                div.style.color = 'var(--text-main)'; // Reset color
                div.setAttribute('data-cat', el.cat);
                div.setAttribute('data-catb', el.block);
                if (currentMode === 'bohr') {
                    div.onmouseenter = () => {
                        div.style.border = `1px solid ${color}`
                    };
                } else {
                    div.onmouseenter = () => {
                        div.style.background = currentMode === 'block' ? `${color}33` : `${color}33`;
                        div.style.border = `1px solid ${color}`
                    };
                }
                div.onmouseleave = () => {
                    div.style.background = 'var(--card-bg)';
                    div.style.borderColor = 'var(--border-color)';
                    div.style.borderBottom = `3px solid ${color}`;
                };
                div.onclick = () => openDrawer(el, color);

                let content = '';
                if (currentMode === 'standard' || currentMode === 'block') {
                    content = `
                        <div class="atomic-number">${el.number}</div>
                        <div class="symbol" style="color:${color}">${el.symbol}</div>
                        <div class="name">${el.name}</div>
                        <div class="mass">${el.mass}</div>
                    `;
                } else if (currentMode === 'bohr') {
                    content = `
                        <div class="bohr-view">
                            <canvas class="bohr-canvas" id="bohrCanvas${el.number}" width="380" height="380"></canvas>
                        </div>
                    `;
                    div.classList.add('bohr-element');
                } else if (currentMode === 'orbital') {
                    content = `
                        <div class="orbital-view">
                            <div class="atomic-number" style="position: absolute; top: 4px; left: 4px; font-size: 0.5rem; color: var(--text-secondary);">${el.number}</div>
                            <div class="symbol" style="color:${color}">${el.symbol}</div>
                            <div class="orb" dir="ltr" style="font-size:0.65rem; opacity:0.9">$${orbitalTable(el.number)}$</div>
                        </div>
                    `;
                } else if (currentMode === 'phase') {
                    let icon = '❓';
                    if (el.state === 'solid') icon = '🟫';
                    if (el.state === 'liquid') icon = '💧';
                    if (el.state === 'gas') icon = '☁️';
                    content = `
                        <div class="image-view">
                            <span style="font-size:1.8rem; opacity:0.9;">${icon}</span>
                            <span class="symbol" style="font-size:0.8rem; position:absolute; bottom:2px;">${el.symbol}</span>
                        </div>
                    `;
                } else if (currentMode === 'image') {
                    content = `
                        <div class="image-view">
                            <div class="atomic-number">${el.number}</div>
                            <div class="img-symbol" style="color: ${color};">${el.symbol}</div>
                            <img src="${el.img}" alt="${el.name}" style="max-width:100%; max-height: 36px; border-radius:5px;"/>
                            <div class="name" style="position:absolute; bottom:2px;">${el.name}</div>
                        </div>
                    `;
                    div.onmouseenter = () => {
                        div.style.background = `${color}`;
                        div.style.borderColor = color;
                        div.querySelectorAll('.img-symbol, .atomic-number, .name').forEach(elm => {
                            elm.classList.add('text-white');
                        });
                    };
                    div.onmouseleave = () => {
                        div.style.background = 'var(--card-bg)';
                        div.querySelectorAll('.img-symbol, .atomic-number, .name').forEach(elm => {
                            elm.classList.remove('text-white');
                        });
                        div.style.border = 'none';
                        div.style.borderBottom = `3px solid ${color}`;
                        div.querySelectorAll('.img-symbol').forEach(elm => {
                            elm.style.color = `${color}`;
                        });
                    };
                    div.style.background = 'var(--card-bg)';
                    div.style.border = 'none';
                    div.style.borderBottom = `3px solid ${color}`;
                    div.classList.add('image-element');
                }

                div.innerHTML = content;
                if (el.ra && currentMode !== 'image') div.innerHTML += `<span class="radioactive">☢</span>`;
                table.appendChild(div);
                if (window.renderMathInElement) { renderMathInElement(div, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] }); }
            });
            updateLegend();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.btn-mode').forEach(btn => {
                btn.classList.remove('active');
                if(btn.textContent.includes(getModeName(mode))) btn.classList.add('active');
            });
            renderTable();
            if (mode === 'bohr') {
                elementsData.forEach(el => {
                    const color = colorPalette[el.cat];
                    if(el.shells && el.shells.length > 0) {
                        startBohr(document.getElementById('bohrCanvas' + el.number), el.symbol, el.shells, el.number, getPeriodStartZ(el.row), color);
                    }
                });
            }
        }

        function getModeName(mode) {
            if(mode === 'standard') return 'استاندارد';
            if(mode === 'block') return 'بلوک';
            if(mode === 'bohr') return 'بور';
            if(mode === 'orbital') return 'اوربیتالی';
            if(mode === 'phase') return 'حالت';
            if(mode === 'image') return 'تصویر';
            return '';
        }

        function updateLegend() {
            legendContainer.innerHTML = '';
            let source = currentMode === 'block' ? blockColors : colorPalette;
            let names = currentMode === 'block' ? {'s':'دسته s', 'p':'دسته p', 'd':'دسته d', 'f':'دسته f'} : categoryNames;

            for (const [key, hex] of Object.entries(source)) {
                const item = document.createElement('div');

        function getStateName(state) {
            if(state === 'solid') return 'جامد';
            if(state === 'liquid') return 'مایع';
            if(state === 'gas') return 'گاز';
            return 'ناشناخته';

        function closeDrawer() {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
            // توقف انیمیشن برای جلوگیری از مصرف منابع
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        // --- انیمیشن مدل بور ---
        function drawBohr(shells) {
            const canvas = document.getElementById("bohrCanvas");
            if(!canvas) return;
            const padding = 40;
            const maxRadius = 35 + (shells.length - 1) * 25;
            const size = maxRadius * 2 + padding;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            const cx = canvas.width/2, cy = canvas.height/2;
            let angle = 0;

            // نمایش اطلاعات مداری در زیر کانواس
            const orbitNames = ['اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم'];
            document.getElementById("orbitInfo").innerHTML =
                shells.map((n, i) => `<span>مدار ${orbitNames[i] || i+1}: <b>${n}</b></span>`).join(" | ");

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // هسته اتم
                ctx.fillStyle = "#f87171";
                ctx.beginPath();
                ctx.arc(cx, cy, 10, 0, Math.PI*2);
                ctx.fill();
                
                // درخشش هسته
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#f87171";
                ctx.fill();
                ctx.shadowBlur = 0;

                shells.forEach((count, i) => {
                    const r = 35 + i * 25; // شعاع مدار

                    // رسم مدار
                    ctx.strokeStyle = "rgba(128,128,128,0.3)";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI*2);
                    ctx.stroke();

                    // رسم الکترون‌ها
                    for(let e = 0; e < count; e++) {
                        const speed = 0.005 + (1 / (i + 1)) * 0.01; 
                        const a = angle * (i % 2 === 0 ? 1 : -1) * (2/(i+1)) + e * (2 * Math.PI / count); // چرخش معکوس یکی در میان
                        
                        const ex = cx + r * Math.cos(a);
                        const ey = cy + r * Math.sin(a);

                        ctx.fillStyle = "#38bdf8";
                        ctx.beginPath();
                        ctx.arc(ex, ey, 3.5, 0, Math.PI*2);
                        ctx.fill();
                    }
                });

                angle += 0.015;
                animationFrameId = requestAnimationFrame(animate);
            }
            
            // اگر انیمیشن قبلی در جریان است متوقف شود
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            animate();
        }

        const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;

        function startBohr(canvas, symbol, shells, Z, periodStartZ, color) {
            const ctx = canvas.getContext("2d");
            const cx = canvas.width/2, cy = canvas.height/2;
            let t = 0;

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // symbol
                ctx.fillStyle = isDarkMode ? '#ffffff' : '#000000';
                ctx.font = "22px Vazirmatn";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(symbol, cx, cy);

                shells.forEach((count, i) => {
                    let shrinkFactor;
                    if (72 <= Z && Z <= 86 || 104 <= Z && Z <= 118) {
                        shrinkFactor = 1 - (Z - 4 - periodStartZ) * 0.01;
                    } else {
                        shrinkFactor = 1 - (Z - periodStartZ) * 0.011;
                    }
                    const baseRadius = 35 + i * 25;
                    const r = baseRadius * shrinkFactor;

                    // رسم مدار
                    ctx.strokeStyle = "rgba(128,128,128,0.3)";
                    ctx.lineWidth = 4.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI*2);
                    ctx.stroke();

                    // رسم الکترون‌ها
                    for(let e = 0; e < count; e++) {
                        const dir = i % 2 === 0 ? 1 : -1;
                        const speed = 0.005 + (2 / (i + 1)) * 0.01; 
                        const a = t * (dir) * (speed)  + e * (2 * Math.PI / count); // چرخش معکوس یکی در میان
                        
                        const ex = cx + r * Math.cos(a);
                        const ey = cy + r * Math.sin(a);

                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.arc(ex, ey, 5.5, 0, Math.PI*2);
                        ctx.fill();
                    }
                });

                t++;
                requestAnimationFrame(animate);
            }
            animate();
        }

        function escapeHtml(s) {
            return s
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function renderLink(match, text, rawUrl) {
            const url = rawUrl.trim();

            // فقط پروتکل‌های امن را بپذیر (جلوگیری از javascript: و data:)
            if (!/^(https?:\/\/|mailto:|tel:|\/|#|\.\.?\/)/i.test(url)) {
                return match; // همان [متن](آدرس) را دست‌نخورده برگردان
            }

            // چون متن قبلاً توسط escapeHtml پردازش شده، فقط کوتیشن‌ها را خنثی کن
            // (escapeHtml علامت‌های & و < و > را قبلاً به entity تبدیل کرده)
            const safeUrl = url.replace(/"/g, '&quot;').replace(/'/g, '&#39;');

            const isExternal = /^https?:\/\//i.test(url);
            const attrs = isExternal ? ' target="_blank" rel="noopener noreferrer"' : '';

            return `<a href="${safeUrl}" class="inline-link"${attrs}>${text}</a>`;
        }

        /**
         * تابع اصلی پردازش متن
         */
        function parseAndStyleResponse(text) {
            let html = text;

            // 1. استخراج و پردازش بلوک‌کوتیشن‌ها
            // این تابع هم بلوک‌کوتیشن‌ها را پردازش می‌کند و هم متن‌های عادی را از لیست تبدیل می‌کند
            html = processBlockquotesAndNormalLists(html);

            // 2. پردازش جداول (Tables)
            html = processTables(html);

            // 3. پردازش هدرها، بولد، ایتالیک، تصاویر، خط افقی و کد
            html = html
                .replace(/^# (.*$)\n/gm, '<h2 class="text-3xl font-bold my-3">$1</h2>')
                .replace(/^## (.*$)\n/gm, '<h3 class="text-2xl font-semibold mt-4 mb-2">$1</h3>')
                .replace(/^### (.*$)\n/gm, '<h4 class="text-xl font-semibold mt-4 mb-2">$1</h4>')
                .replace(/^#### (.*$)\n/gm, '<h5 class="text-lg font-semibold mt-4 mb-2">$1</h5>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<i>$1</i>')
                .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" class="my-2 rounded-lg shadow-md mx-auto max-w-full h-auto"><p class="text-sm text-center">$1</p>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, text, url) => renderLink(m, text, url))
                .replace(/(?:^|\n)---(?:\r?\n|<br>|\n)(?:^|\n)/g, '<hr class="my-6 border-t-0 border-b border-[#e5ebe6] dark:border-[#353936]">')
                .replace(/`([^`\n]+)`/g, (m, inlineCode) => {
                    const escaped = inlineCode.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    return `<code class="inline-code px-1 rounded cursor-pointer" data-code="${escaped}">${escaped}</code>`;
                });

            // 4. تبدیل خطوط جدید به <br>
            html = html.replace(/\n/g, '<br>');

            // 5. پاکسازی نهایی (حذف <br> اضافی بعد از تگ‌های خاص)
            html = html
                .replace(/(<\/h3>)<br>/g, '$1')
                .replace(/(<\/h2>)<br>/g, '$1')
                .replace(/(<\/h4>)<br>/g, '$1')
                .replace(/(<\/h5>)<br>/g, '$1')
                .replace(/(<\/div>)<br>/g, '$1')
                .replace(/(<\/blockquote>)<br><br>/g, '$1')
                .replace(/(<\/blockquote>)<br>/g, '$1')
                .replace(/(<\/hr>)<br>/g, '$1')
                .replace(/<br><br>/g, '<br>')
                .replace(/<\/ul><br>/g, '</ul>')
                .replace(/<\/ol><br>/g, '</ol>');

            return html;
        }

        /**
         * تابع جدید: پردازش همزمان بلوک‌کوتیشن‌ها و لیست‌های عادی
         */
        function processBlockquotesAndNormalLists(text) {
            // Regex برای پیدا کردن بلوک‌کوتیشن‌ها
            const bqRegex = /(?:^|\n)>[^\n]*(?:\n>[^\n]*)*/g;
            
            let lastIndex = 0;
            let result = '';
            let match;

            // حلقه برای پیدا کردن تمام بلوک‌کوتیشن‌ها
            while ((match = bqRegex.exec(text)) !== null) {
                // 1. متن قبل از این بلوک‌کوتیشن (متن عادی)
                const normalTextBefore = text.slice(lastIndex, match.index);
                
                // پردازش لیست‌ها در متن عادی قبل از بلوک‌کوتیشن
                if (normalTextBefore) {
                    result += parseMarkdownLists(normalTextBefore);
                }

                // 2. پردازش محتوای بلوک‌کوتیشن
                let bqContent = match[0].replace(/^(\n)?/, ''); // حذف newline ابتدایی
                const cleanedBqLines = bqContent.split('\n').map(line => line.replace(/^>\s?/, ''));
                const rawBqContent = cleanedBqLines.join('\n');
                
                // پردازش لیست‌ها و استایل‌های داخل بلوک‌کوتیشن
                let processedBqContent = parseMarkdownLists(rawBqContent);
                processedBqContent = processedBqContent
                    .replace(/^# (.*$)\n/gm, '<h2 class="text-3xl font-bold my-3">$1</h2>')
                    .replace(/^## (.*$)\n/gm, '<h3 class="text-2xl font-semibold mt-4 mb-2">$1</h3>')
                    .replace(/^### (.*$)\n/gm, '<h4 class="text-xl font-semibold mt-4 mb-2">$1</h4>')
                    .replace(/^#### (.*$)\n/gm, '<h5 class="text-lg font-semibold mt-4 mb-2">$1</h5>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<i>$1</i>')
                    .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" class="my-2 rounded-lg shadow-md mx-auto max-w-full h-auto"><p class="text-sm text-center">$1</p>')
                    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, text, url) => renderLink(m, text, url))
                    .replace(/`([^`\n]+)`/g, (m, inlineCode) => {
                        const escaped = inlineCode.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        return `<code class="inline-code px-1 rounded cursor-pointer" data-code="${escaped}">${escaped}</code>`;
                    })
                    .replace(/\n/g, '<br>');

                // پاکسازی <br> در داخل بلوک
                processedBqContent = processedBqContent
                    .replace(/(<\/h3>)<br>/g, '$1')
                    .replace(/(<\/h2>)<br>/g, '$1')
                    .replace(/(<\/h4>)<br>/g, '$1')
                    .replace(/(<\/h5>)<br>/g, '$1')
                    .replace(/<br><br>/g, '<br>')
                    .replace(/<\/ul><br>/g, '</ul>')
                    .replace(/<\/ol><br>/g, '</ol>');

                result += `<blockquote class="my-3">${processedBqContent}</blockquote>`;
                
                lastIndex = bqRegex.lastIndex;
            }

            // 3. پردازش متن باقی‌مانده بعد از آخرین بلوک‌کوتیشن
            if (lastIndex < text.length) {
                const normalTextAfter = text.slice(lastIndex);
                result += parseMarkdownLists(normalTextAfter);
            }

            return result;
        }

        /**
         * تابع کمکی برای پردازش جداول
         */
        function processTables(text) {
            const tableRegex = /((?:\|.*\|[ \t]*\r?\n)\|[ \t:.\-|]+\r?\n(?:\|.*\|[ \t]*\r?\n?)*)/g;
            return text.replace(tableRegex, (table) => {
                const rows = table.trim().split(/\r?\n/);
                if (rows.length < 2) return table;
                const separator = rows[1];
                if (!/^(\|\s*[:\-]+\s*)+\|?$/.test(separator)) {
                    return table;
                }
                const headerCells = rows[0].split('|').slice(1, -1).map(h => `<th>${h.trim()}</th>`).join('');
                let body = '';
                for(let i = 2; i < rows.length; i++) {
                    const line = rows[i].trim();
                    if (!line) continue;
                    const cells = rows[i].split('|').slice(1, -1).map(c => `<td>${c.trim()}</td>`).join('');
                    body += `<tr>${cells}</tr>`;
                }
                return `<div class="table-wrapper overflow-x-auto"><table class="ai-table"><thead><tr>${headerCells}</tr></thead><tbody>${body}</tbody></table></div>`;
            });
        }

        /**
         * تابع parseMarkdownLists
         * این تابع لیست‌ها را در متنی که دیگر شامل > نیست پردازش می‌کند
         */
        function parseMarkdownLists(text) {
            const lines = text.split('\n');
            let result = '';
            let stack = []; // نگه‌داری نوع لیست‌ها: 'ul' یا 'ol'

            let liOpen = false;       // آیا الان داخل <li> هستیم؟
            let liLevel = -1;         // سطح <li> باز

            function openList(type) {
                stack.push(type);
                result += `<${type}>`;
            }

            function closeList() {
                const type = stack.pop();
                result += `</${type}>`;
            }

            function closeLiIfOpen() {
                if (liOpen) {
                    result += `</li>`;
                    liOpen = false;
                    liLevel = -1;
                }
            }

            function closeToLevel(level) {
                if (liOpen && stack.length > level) closeLiIfOpen();
                while (stack.length > level) closeList();
            }

            for (let line of lines) {
                // Regex ساده برای لیست‌های استاندارد (چون > ها قبلاً حذف شده‌اند)
                const listMatch = line.match(/^(\s*)([-*]|\d+[\.\)]) (.*)$/);

                if (!listMatch) {
                    // ✅ بازگرداندن منطق تشخیص توضیح زیر آیتم (Continuation)
                    // اگر خط با فاصله شروع شود و داخل لیست باشیم، احتمالاً توضیح آیتم قبلی است
                    // در متون تمیز شده (داخل بلوک‌کوتیشن)، دیگر > نداریم، پس فقط فاصله را چک می‌کنیم
                    const contMatch = line.match(/^(\s+)(.*)$/);
                    if (contMatch && liOpen) {
                        const cont = contMatch[2].trim();
                        if (cont.length) {
                            result += `<p>${escapeHtml(cont)}</p>`;
                        }
                        continue;
                    }
                    // اگر خط لیست نیست
                    closeLiIfOpen();
                    closeToLevel(0);
                    result += escapeHtml(line) + '\n';
                    continue;
                }

                const indent = listMatch[1].length;
                const marker = listMatch[2];
                const content = listMatch[3];
                const level = Math.floor(indent / 4);
                const type = /^\d+[\.\)]/.test(marker) ? 'ol' : 'ul';

                if (liOpen && level !== liLevel) closeLiIfOpen();

                if (level > stack.length - 1) {
                    openList(type);
                } else if (level < stack.length - 1) {
                    closeLiIfOpen();
                    closeToLevel(level + 1);
                }

                if (stack[stack.length - 1] !== type) {
                    closeLiIfOpen();
                    closeList();
                    openList(type);
                }

                closeLiIfOpen();
                result += `<li>${escapeHtml(content)}`;
                liOpen = true;
                liLevel = level;
            }

            closeLiIfOpen();
            closeToLevel(0);
            return result;
        }

        // شروع برنامه
        renderTable();

    </script>
</body>
</html>
